<!DOCTYPE html>
<html lang="sa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ஸ்ரீ ருத்ரம் | Sri Rudram — Complete</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+Devanagari:wght@400;600;700&family=Noto+Serif+Tamil:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep:   #080612;
      --bg-mid:    #110D22;
      --bg-card:   #1A1430;
      --bg-card2:  #1F1838;
      --saffron:   #E8852A;
      --gold:      #D4A843;
      --copper:    #C47B3A;
      --rose:      #D45B6A;
      --teal:      #3DBDAA;
      --indigo:    #7B6FD4;
      --ash:       #F0EDE8;
      --muted:     #9B96B0;
      --dim:       rgba(155,150,176,0.5);
      --glow:      rgba(232,133,42,0.2);
      --glow-soft: rgba(212,168,67,0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg-deep);
      color: var(--ash);
      font-family: 'Noto Serif', Georgia, serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Stars */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        radial-gradient(1px 1px at 15% 25%, rgba(255,255,255,0.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 12%, rgba(255,255,255,0.25) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 78% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 38% 78%, rgba(255,255,255,0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 8%  68%, rgba(255,255,255,0.25) 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 38%, rgba(255,255,255,0.18) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 48% 48%, rgba(212,168,67,0.12) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 88%, rgba(255,255,255,0.15) 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 55%, rgba(255,255,255,0.2) 0%, transparent 100%);
      pointer-events: none; z-index: 0;
    }

    .page-topbar {
      position: relative; z-index: 2;
      padding: 1rem 1.25rem 0;
    }
    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--gold);
      text-decoration: none;
      font-family: 'Noto Serif Tamil', serif;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .home-link:hover {
      opacity: 0.9;
      transform: translateX(-2px);
    }

    /* ── HEADER ── */
    header {
      position: relative; z-index: 1;
      text-align: center;
      padding: 2.5rem 1.5rem 1.5rem;
      border-bottom: 1px solid rgba(212,168,67,0.12);
      background: linear-gradient(180deg, rgba(46,34,80,0.55) 0%, transparent 100%);
    }
    .trishul {
      font-size: 3.2rem; display: block; margin-bottom: 0.4rem;
      animation: float 4s ease-in-out infinite;
      filter: drop-shadow(0 0 18px var(--saffron));
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    header h1 {
      font-family: 'Noto Serif Tamil','Noto Serif',serif;
      font-size: clamp(1.7rem,5vw,2.8rem); font-weight: 700;
      background: linear-gradient(135deg, var(--gold), var(--saffron), var(--gold));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      letter-spacing: 0.04em; line-height: 1.2;
    }
    header .subtitle { font-family:'Noto Serif Tamil',serif; color:var(--muted); font-size:0.88rem; margin-top:0.4rem; letter-spacing:0.06em; }
    header .source   { color:var(--copper); font-size:0.8rem; margin-top:0.3rem; font-style:italic; }

    /* ── SECTION NAV ── */
    .section-nav {
      position: relative; z-index: 2;
      display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem;
      padding: 1.2rem 1rem 0.8rem;
      background: rgba(8,6,18,0.6);
      border-bottom: 1px solid rgba(212,168,67,0.1);
    }
    .snav-btn {
      background: var(--bg-card); border: 1px solid rgba(212,168,67,0.18);
      color: var(--muted); padding: 0.45rem 1.1rem; border-radius: 999px;
      cursor: pointer; font-family:'Noto Serif Tamil',serif; font-size: 0.82rem;
      transition: all 0.22s; white-space: nowrap;
    }
    .snav-btn:hover { border-color:var(--gold); color:var(--gold); }
    .snav-btn.active {
      color: #fff; font-weight: 600; border-color: transparent;
      box-shadow: 0 0 16px var(--glow);
    }
    .snav-btn[data-sec="namakam"].active    { background: linear-gradient(135deg,#E8852A,#C47B3A); }
    .snav-btn[data-sec="chamakam"].active   { background: linear-gradient(135deg,#C47B3A,#9B5020); }
    .snav-btn[data-sec="maha_mrityunjaya"].active { background: linear-gradient(135deg,#7B6FD4,#5B50A0); }
    .snav-btn[data-sec="shata_rudriya"].active    { background: linear-gradient(135deg,#3DBDAA,#2A8A7B); }
    .snav-btn[data-sec="rudra_ashtadhyayi"].active{ background: linear-gradient(135deg,#D45B6A,#A03045); }
    .snav-btn[data-sec="rudra_hierarchy"].active  { background: linear-gradient(135deg,#888,#555); }

    /* ── MAIN ── */
    main { max-width: 860px; margin: 0 auto; padding: 0 1rem 5rem; position:relative; z-index:1; }

    /* ── HIERARCHY PANEL ── */
    .hierarchy-panel { padding-top: 1.5rem; }
    .hier-title {
      font-family:'Noto Serif Tamil',serif;
      font-size: clamp(1rem,2.5vw,1.3rem); font-weight:700;
      background: linear-gradient(135deg,var(--gold),var(--saffron));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      text-align:center; margin-bottom:0.5rem;
    }
    .hier-subtitle { text-align:center; font-size:0.85rem; color:var(--muted); margin-bottom:1.8rem; font-style:italic; }
    .tier-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:1rem; }
    .tier-card {
      background:var(--bg-card); border:1px solid rgba(212,168,67,0.18);
      border-radius:1rem; padding:1.25rem 1.25rem 1rem; position:relative;
      transition: box-shadow 0.2s;
    }
    .tier-card:hover { box-shadow:0 4px 24px rgba(0,0,0,0.4); }
    .tier-card .tier-num {
      position:absolute; top:-12px; left:1rem;
      font-size:0.68rem; font-weight:700; letter-spacing:0.1em;
      padding:0.15rem 0.8rem; border-radius:999px; color:#fff;
    }
    .tier-card h3 { font-size:1rem; font-weight:700; margin-bottom:0.4rem; margin-top:0.3rem; }
    .tier-card .tier-sa { font-size:0.82rem; color:var(--muted); font-style:italic; margin-bottom:0.6rem; }
    .tier-card p { font-size:0.82rem; color:var(--muted); line-height:1.7; }
    .tier-card .count-badge {
      display:inline-block; margin-top:0.7rem;
      background:rgba(212,168,67,0.1); border:1px solid rgba(212,168,67,0.2);
      font-size:0.72rem; color:var(--gold); padding:0.2rem 0.75rem; border-radius:999px;
    }
    .t1 .tier-num { background:linear-gradient(135deg,#888,#555); }
    .t2 .tier-num { background:linear-gradient(135deg,#C47B3A,#9B5020); }
    .t3 .tier-num { background:linear-gradient(135deg,#E8852A,#C47B3A); }
    .t4 .tier-num { background:linear-gradient(135deg,#D4A843,#C47B3A); }
    .t5 .tier-num { background:linear-gradient(135deg,#7B6FD4,#D4A843); }
    .hier-note {
      margin-top:1.5rem; padding:1rem 1.25rem; border-radius:0.75rem;
      background:rgba(212,168,67,0.05); border:1px solid rgba(212,168,67,0.15);
      font-size:0.82rem; color:var(--muted); line-height:1.8; text-align:center;
    }
    .hier-note strong { color:var(--gold); }

    /* ── SHLOKA VIEWER ── */
    .viewer-wrap { padding-top:1.5rem; }
    .anuvaka-label {
      text-align:center; font-family:'Noto Serif Tamil',serif;
      font-size:0.75rem; color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:0.4rem;
    }
    .progress-text { text-align:center; font-size:0.88rem; color:var(--copper); margin-bottom:1.4rem; font-style:italic; }

    .shloka-card {
      background:var(--bg-card); border:1px solid rgba(212,168,67,0.2);
      border-radius:1.25rem; padding:2rem 2rem 1.75rem; position:relative;
      box-shadow:0 4px 40px rgba(0,0,0,0.5), inset 0 0 60px var(--glow-soft);
      animation: cardIn 0.38s ease both;
    }
    @keyframes cardIn { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
    .shloka-card::before {
      content:''; position:absolute; inset:-1px; border-radius:1.3rem;
      background:linear-gradient(135deg,rgba(212,168,67,0.22),transparent 50%,rgba(232,133,42,0.12));
      pointer-events:none; z-index:0;
    }
    .shloka-number-badge {
      position:absolute; top:-13px; left:50%; transform:translateX(-50%);
      color:#fff; font-size:0.72rem; font-weight:700; padding:0.18rem 1rem;
      border-radius:999px; letter-spacing:0.08em; white-space:nowrap;
    }
    .badge-namakam    { background:linear-gradient(135deg,var(--saffron),var(--copper)); }
    .badge-chamakam   { background:linear-gradient(135deg,var(--copper),#9B5020); }
    .badge-maha       { background:linear-gradient(135deg,var(--indigo),#5B50A0); }
    .badge-shata      { background:linear-gradient(135deg,var(--teal),#2A8A7B); }
    .badge-ashta      { background:linear-gradient(135deg,var(--rose),#A03045); }

    .shloka-title {
      font-family:'Noto Serif Tamil',serif; font-size:0.75rem; color:var(--gold);
      text-align:center; letter-spacing:0.12em; text-transform:uppercase;
      margin-bottom:1.2rem; margin-top:0.5rem; position:relative; z-index:1;
    }
    .shloka-text {
      font-family:'Noto Serif Devanagari','Noto Serif Tamil','Noto Serif',serif;
      font-size:clamp(1rem,2.5vw,1.2rem); line-height:2.1; color:var(--ash);
      text-align:center; white-space:pre-line; position:relative; z-index:1;
    }
    .meaning-section {
      margin-top:1.4rem; padding-top:1.2rem;
      border-top:1px solid rgba(212,168,67,0.12); position:relative; z-index:1;
    }
    .meaning-label { font-size:0.7rem; color:var(--gold); letter-spacing:0.12em; text-transform:uppercase; margin-bottom:0.5rem; font-family:'Noto Serif Tamil',serif; }
    .meaning-text { font-size:0.9rem; color:var(--muted); line-height:1.8; font-style:italic; }

    .card-actions {
      display:flex; gap:0.7rem; justify-content:center; margin-top:1.4rem;
      position:relative; z-index:1; flex-wrap:wrap;
    }
    .action-btn {
      background:rgba(255,255,255,0.04); border:1px solid rgba(212,168,67,0.2);
      color:var(--muted); padding:0.42rem 1rem; border-radius:999px; cursor:pointer;
      font-size:0.8rem; transition:all 0.2s; display:flex; align-items:center; gap:0.35rem;
    }
    .action-btn:hover { border-color:var(--gold); color:var(--gold); background:rgba(212,168,67,0.08); }
    .action-btn.active { background:rgba(232,133,42,0.15); border-color:var(--saffron); color:var(--saffron); }

    /* ── NAV ── */
    .nav-area { display:flex; align-items:center; justify-content:space-between; margin-top:1.8rem; gap:1rem; }
    .nav-btn {
      background:var(--bg-card); border:1px solid rgba(212,168,67,0.22);
      color:var(--gold); padding:0.6rem 1.4rem; border-radius:999px; cursor:pointer;
      font-family:'Noto Serif Tamil',serif; font-size:0.88rem; transition:all 0.22s; white-space:nowrap;
    }
    .nav-btn:hover:not(:disabled) { background:linear-gradient(135deg,var(--saffron),var(--copper)); color:#fff; border-color:transparent; box-shadow:0 0 16px var(--glow); }
    .nav-btn:disabled { opacity:0.3; cursor:default; }
    .dots-area { display:flex; gap:0.5rem; flex-wrap:wrap; justify-content:center; flex:1; }
    .dot {
      width:20px; height:20px; border-radius:50%;
      background:rgba(212,168,67,0.1); border:1.5px solid rgba(212,168,67,0.22);
      cursor:pointer; transition:all 0.2s; position:relative;
    }
    .dot::after { content:''; position:absolute; inset:3px; border-radius:50%; background:var(--bg-deep); transition:background 0.2s; }
    .dot.active { border-color:var(--saffron); box-shadow:0 0 7px var(--glow); }
    .dot.active::after { background:var(--saffron); }
    .dot:hover::after { background:rgba(212,168,67,0.45); }

    /* auto-read glow */
    .auto-reading .shloka-text { animation:subtleGlow 2s ease-in-out infinite; }
    @keyframes subtleGlow { 0%,100%{text-shadow:none} 50%{text-shadow:0 0 22px rgba(232,133,42,0.38)} }

    /* ── INFO SECTION (Maha Mrityunjaya) ── */
    .info-panel { padding-top:1.5rem; }
    .info-card {
      background:var(--bg-card); border:1px solid rgba(212,168,67,0.18);
      border-radius:1.25rem; padding:1.75rem 2rem; position:relative;
      box-shadow:0 4px 30px rgba(0,0,0,0.4);
    }
    .info-card::before {
      content:''; position:absolute; inset:-1px; border-radius:1.3rem;
      pointer-events:none; z-index:0;
    }
    .info-card.purple::before { background:linear-gradient(135deg,rgba(123,111,212,0.2),transparent 60%); }
    .info-card.teal::before   { background:linear-gradient(135deg,rgba(61,189,170,0.2),transparent 60%); }
    .info-card.rose::before   { background:linear-gradient(135deg,rgba(212,91,106,0.2),transparent 60%); }
    .info-header { display:flex; align-items:flex-start; gap:1rem; margin-bottom:1.25rem; position:relative; z-index:1; }
    .info-icon { font-size:2.5rem; flex-shrink:0; }
    .info-header h2 { font-family:'Noto Serif Tamil',serif; font-size:clamp(1rem,2.5vw,1.3rem); font-weight:700; }
    .info-header .info-sa { font-size:0.82rem; color:var(--muted); font-style:italic; margin-top:0.2rem; }
    .info-header .info-src { font-size:0.75rem; color:var(--copper); margin-top:0.2rem; }
    .divider { height:1px; background:rgba(212,168,67,0.12); margin:1.1rem 0; position:relative; z-index:1; }
    .mantra-block {
      font-family:'Noto Serif Devanagari','Noto Serif',serif;
      font-size:clamp(1rem,2.5vw,1.2rem); line-height:2.1; color:var(--ash);
      text-align:center; white-space:pre-line; position:relative; z-index:1;
    }
    .meaning-block { font-size:0.88rem; color:var(--muted); line-height:1.8; font-style:italic; position:relative; z-index:1; }
    .sub-section { margin-top:1.5rem; position:relative; z-index:1; }
    .sub-section h3 { font-size:0.78rem; color:var(--gold); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:0.8rem; font-family:'Noto Serif Tamil',serif; }
    .verse-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:0.75rem; }
    .verse-item { background:rgba(255,255,255,0.03); border:1px solid rgba(212,168,67,0.12); border-radius:0.75rem; padding:0.9rem 1rem; }
    .verse-item .verse-num { font-size:0.68rem; color:var(--gold); letter-spacing:0.1em; margin-bottom:0.35rem; }
    .verse-item .verse-text { font-family:'Noto Serif Devanagari',serif; font-size:0.85rem; color:var(--ash); line-height:1.7; }
    .verse-item .verse-meaning { font-size:0.76rem; color:var(--muted); line-height:1.6; margin-top:0.4rem; font-style:italic; }

    /* ── FOOTER ── */
    footer {
      text-align:center; padding:2rem 1rem;
      font-family:'Noto Serif Tamil',serif; font-size:0.78rem; color:var(--dim);
      border-top:1px solid rgba(212,168,67,0.08); position:relative; z-index:1;
    }

    /* ── RESPONSIVE ── */
    @media(max-width:600px){
      .shloka-card,.info-card{padding:1.4rem 1.1rem}
      .nav-btn{padding:0.5rem 0.9rem;font-size:0.8rem}
      .dot{width:16px;height:16px}
      .tier-grid{grid-template-columns:1fr}
    }
    @media(prefers-reduced-motion:reduce){
      .trishul,.auto-reading .shloka-text{animation:none}
      @keyframes cardIn{from{opacity:1}}
    }
  </style>
  <link rel="stylesheet" href="assets/css/page-shell.css">
</head>

<script>

const DATA = {

  namakam: [
    { title:"நமகம் — அனுவாகம் 1 | Anuvāka 1", badge:"badge-namakam",
      text:`நமஸ்தே ருத்ர மன்யவ உதோத இஷவே நம: ।
நமஸ்தே அஸ்து தன்வனே பாஹுப்யாம் உத தே நம: ॥

யா த இஷு: சிவதமா சிவம் பபூவ தே தனு: ।
சிவா சரவ்யா யா தவ தயா நோ ருத்ர மிருடய ॥

யா தே ருத்ர சிவா தனூரகோராऽபாபகாசினீ ।
தயா நஸ்தனுவா சந்தமயா கிரிசந்தாபிசாகசீஹி ॥

யாமிஷும் கிரிசந்த ஹஸ்தே பிபர்ஷ்யஸ்தவே ।
சிவாம் கிரித்ர தாம் குரு மா ஹிம்ஸீ: புருஷம் ஜகத் ॥

சிவேன வசஸா த்வா கிரிசாச்சா வதாமசி ।
யதா ந: சர்வமிஜ்ஜகதயக்ஷ்மம் சுமனா அசத் ॥

அத்யவோசததி வக்தா ப்ரதமோ தைவ்யோ பிஷக் ।
அஹீச்ச சர்வாஞ்ஜம்பயன் சர்வாச்ச யாதுதானீ: ॥

அசௌ யஸ்தாம்ரோ அருண உத பப்ரு: சுமங்கள: ।
யே சேமா ருத்ரா அபிதோ திக்ஷு ஸ்ரிதா: சஹஸ்ரசோऽவைஷாம் ஹேட ஈமஹே ॥

அசௌ யோऽவசர்பதி நீலக்ரீவோ விலோஹித: ।
உதைனம் கோபா அதிருசன்னதிருசன்னுதாஹார்ய: ।
உதைனம் விஷ்வா பூதானி ச திருஷ்டோ மிருடயாதி ந: ॥

நமோ அஸ்து நீலக்ரீவாய சஹஸ்ராக்ஷாய மீடுஷே ।
அதோ யே அஸ்ய சத்வானோऽஹம் தேப்யோऽகரந் நம: ॥

ப்ரமுஞ்ச தன்வனஸ்த்வமுபயோரார்த்நியோர்ஜ்யாம் ।
யாச்ச தே ஹஸ்த இஷவ: பரா தா பகவோ வப ॥

அவதத்ய தனுஸ்த்வம் சஹஸ்ராக்ஷ சதேஷுதே ।
நிசீர்ய சல்யானாம் முகா சிவோ ந: சுமனா பவ ॥

விஜ்யம் தனு: கபர்தினோ விசல்யோ பாணவான் உத ।
அநேசன்னச்யேஷவ ஆபுரஸ்ய நிஷங்கதி: ॥

யா தே ஹேதிர்மீடுஷ்டம ஹஸ்தே பபூவ தே தனு: ।
தயாऽஸ்மான் விஷ்வதஸ்த்வமயக்ஷ்மயா பரிப்புஜ ॥

நமஸ்தே அஸ்த்வாயுதாயானாததாய திருஷ்ணவே ।
உபாப்யாமுத தே நமோ பாஹுப்யாம் தவ தன்வனே ॥

பரி தே தன்வனோ ஹேதிரஸ்மான் விருணக்து விஷ்வத: ।
அதோ ய இஷுதிஸ்தவாரே அஸ்மன் நிதேஹி தம் ॥`,
      meaning:"O Rudra, salutations to your wrath and to your arrow; salutations to your bow and to both your arms. May your most auspicious arrow, and your bow which has become a source of welfare, through your gracious form which heals and brings no harm, look upon us with mercy. Whatever weapon you hold to bring forth peace, O Lord of mountains, may it spare our people and our cattle, doing no harm to any living being. We address you with auspicious words, O dweller of mountains, that all our world may become free from disease, with a well-disposed mind. The first divine physician proclaimed this and quelled the serpents and sorceresses. Salutations to the copper-red, tawny, and most auspicious Rudras dwelling in every direction in their thousands — we seek to free ourselves from their wrath. Salutations to the blue-throated, red-bodied one who moves stealthily, whom the cowherds and water-maidens have seen, and all beings have seen — may that seen form bring us happiness. Salutations to the blue-throated, thousand-eyed, most bountiful one, and to his attendant hosts, to whom I now offer salutations. Unstring your bow at both ends and cast away the arrows held in your hand. Loosen your bow, O thousand-eyed one, and break the points of your shafts — be gracious and well-disposed toward us. May your bow be unstrung, your quiver emptied of shafts, and the points of your arrows that remain be rendered harmless. With that weapon in your hand and that bow which is yours, protect us on every side from disease. Salutations to your weapon strung and unstrung, and salutations to both your arms and to your bow. May your weapon's range pass us by on every side, and may you place the quiver that is yours far away from us." },

    { title:"நமகம் — அனுவாகம் 2 | Anuvāka 2", badge:"badge-namakam",
      text:`நமஸ்தே அஸ்து பகவன் விஷ்வேஷ்வராய மஹாதேவாய த்ர்யம்பகாய த்ரிபுராந்தகாய த்ரிகாக்னிகாலாய காலாக்னிருத்ராய நீலகண்டாய மிருத்யுஞ்ஜயாய சர்வேஷ்வராய சதாசிவாய ஸ்ரீமன் மஹாதேவாய நம: ॥

நமோ ஹிரண்யபாஹவே சேனான்யே திசாஞ்ச பதயே நமோ நமோ
வ்ருக்ஷேப்யோ ஹரிகேசேப்ய: பசூனாம் பதயே நமோ நம:
சச்பிஞ்சராய த்விஷீமதே பதீனாம் பதயே நமோ நமோ
பப்லுசாய விவ்யாதினேऽன்னானாம் பதயே நமோ நமோ
ஹரிகேசாயோபவீதினே புஷ்டானாம் பதயே நமோ நமோ
பவஸ்ய ஹேத்யை ஜகதாம் பதயே நமோ நமோ
ருத்ராயாததாவினே க்ஷேத்ராணாம் பதயே நமோ நம:
ஸூதாயாஹந்த்யாய வனானாம் பதயே நமோ நம: ॥

ரோஹிதாய ஸ்தபதயே வ்ருக்ஷாணாம் பதயே நமோ நமோ
மந்த்ரிணே வாணிஜாய கக்ஷாணாம் பதயே நமோ நமோ
புஞ்ஜயே வாரிவஸ்க்ருதாயௌஷதீனாம் பதயே நமோ நம
உச்சைர்கோஷாயாக்ரந்தயதே பத்தீனாம் பதயே நமோ நம:
க்ருத்ஸ்நவீதாய தாவதே சத்வனாம் பதயே நம: ॥`,
      meaning:"Salutations to you, O Lord, Master of the universe, Mahadeva, three-eyed one, destroyer of the three cities, fire of the three time-periods, Rudra who is the fire at the end of time, blue-throated one, conqueror of death, Lord of all, the eternal auspicious one, the blessed Mahadeva. Salutations to the golden-armed one, leader of armies, lord of all directions; salutations to the one who dwells among trees with golden-green hair, lord of beasts; salutations to the tawny, radiant lord of travelers; salutations to the piercer, lord of food; salutations to the golden-haired sacred-thread-wearer, lord of the well-nourished; salutations to him whose weapon is creation itself, lord of the worlds; salutations to Rudra of the unbent bow, lord of fields; salutations to the charioteer of swiftness, lord of forests. Salutations to the reddish one, lord of carpenters, lord of trees; salutations to the counselor, the merchant, lord of thickets; salutations to him who nourishes and bestows wealth, lord of medicinal herbs; salutations to the loud-voiced one who calls out, lord of foot-soldiers; salutations to the swift runner who covers all ground, lord of hunters' hounds." },

    { title:"நமகம் — அனுவாகம் 3 | Anuvāka 3", badge:"badge-namakam",
      text:`நம: சஹமானாய நிவ்யாதினே ஆவ்யாதினீனாம் பதயே நமோ நமோ
ககுபாய நிஷங்கிணே ஸ்தேனானாம் பதயே நமோ நமோ
நிஷங்கிண இஷுதிமதே தஸ்கராணாம் பதயே நமோ நமோ
வஞ்சதே பரிவஞ்சதே ஸ்தாயூனாம் பதயே நமோ நமோ
நிசேரவே பரிசராயாரண்யானாம் பதயே நமோ நம:
ஸ்ருகாவிப்யோ ஜிகாம்சத்ப்யோ முஷ்ணதாம் பதயே நமோ நமோऽ
சிமத்ப்யோ நக்தம் சரத்ப்ய: ப்ரக்ருந்தானாம் பதயே நமோ நம
உஷ்ணீஷிணே கிரிசராய குலுஞ்சானாம் பதயே நம: ॥

இஷுமத்ப்யோ தன்வாவிப்யச்ச வோ நமோ நம

ஆயச்சத்ப்யோ விஸ்ருஜத்ப்யச்ச வோ நமோ நமோऽ
ச்யத்ப்யோ வித்யத்ப்யச்ச வோ நமோ நம
ஆசீனேப்ய: சயானேப்யச்ச வோ நமோ நம:
ஸ்வபத்ப்யோ ஜாக்ரத்ப்யச்ச வோ நமோ நம
ஸ்திஷ்டத்ப்யோ தாவத்ப்யச்ச வோ நமோ நம:
சபாப்ய: சபாபதிப்யச்ச வோ நமோ நமோऽ
ஸ்வேப்யோऽஸ்வபதிப்யச்ச வோ நம: ॥`,
      meaning:"Salutations to the forbearing one and the vanquisher of obstacles, lord of all who afflict; salutations to the dweller of high places who bears a quiver, lord of thieves; salutations to the armed bearer of weapons, lord of robbers; salutations to the deceiver and the great deceiver, lord of stealthy ones; salutations to him who roams and stalks, lord of forest beings; salutations to those bearing ladles who seek to slay, lord of plunderers; salutations to those armed with knives who prowl by night, lord of those who cut down; salutations to the turbaned one who roams mountains, lord of those who steal in secret. Salutations to those armed with arrows and bows, salutations to those stringing and stretching their bows, salutations to those drawing and releasing their shafts, salutations to those striking and piercing, salutations to those seated and those lying down, salutations to those asleep and those awake, salutations to those standing still and those running, salutations to assemblies and the lords of assemblies, salutations to horses and to the lords of horses." },

    { title:"நமகம் — அனுவாகம் 4 | Anuvāka 4", badge:"badge-namakam",
      text:`நம ஆவ்யாதினீப்யோ விவித்யந்தீப்யச்ச வோ நமோ நம
உகணாப்யஸ்த்ருஹதீப்யச்ச வோ நமோ நமோ
க்ருத்சேப்யோ க்ருத்சபதிப்யச்ச வோ நமோ நமோ
வ்ராதேப்யோ வ்ராதபதிப்யச்ச வோ நமோ நமோ
கணேப்யோ கணபதிப்யச்ச வோ நமோ நமோ
விரூபேப்யோ விஷ்வரூபேப்யச்ச வோ நமோ நமோ
மஹத்ப்ய: க்ஷுல்லகேப்யச்ச வோ நமோ நமோ
ரதிப்யோऽரதேப்யச்ச வோ நமோ நமோ ரதேப்ய: ॥

ரதபதிப்யச்ச வோ நமோ நம:
சேனாப்ய: சேனானிப்யச்ச வோ நமோ நம:
க்ஷத்ருப்ய: ஸங்க்ரஹீத்ருப்யச்ச வோ நமோ நம
ஸ்தக்ஷப்யோ ரதகாரேப்யச்ச வோ நமோ நம:
குலாலேப்ய: கர்மாரேப்யச்ச வோ நமோ நம:
புஞ்ஜிஷ்டேப்யோ நிஷாதேப்யச்ச வோ நமோ நம
இஷுக்ருத்ப்யோ தன்வக்ருத்ப்யச்ச வோ நமோ நமோ
மிருகயுப்ய: ஸ்வநிப்யச்ச வோ நமோ நம:
ஸ்வப்ய: ஸ்வபதிப்யச்ச வோ நம: ॥`,
      meaning:"Salutations to those who pierce and those who strike, salutations to the hosts and those who fell, salutations to the chosen ones and the lords of the chosen, salutations to the bands and the lords of bands, salutations to the troops and the leaders of troops, salutations to the diverse-formed and the all-formed, salutations to the great and the small, salutations to charioteers and those without chariots, salutations to chariots themselves. Salutations to the lords of chariots, to armies and the leaders of armies, salutations to attendants and gatherers, salutations to carpenters and chariot-makers, salutations to potters and smiths, salutations to gatherers of fruit and fisher-folk, salutations to arrow-makers and bow-makers, salutations to hunters and dog-handlers, salutations to dogs and to the lords of dogs." },

      text:`நமோ பவாய ச ருத்ராய ச நம: சர்வாய ச பசுபதயே ச

நம: சஹஸ்ராக்ஷாய ச சததன்வனே ச
நமோ கிரிசாய ச சிபிவிஷ்டாய ச
நமோ மீடுஷ்டமாய சேஷுமதே ச நமோ ஹ்ரஸ்வாய ச வாமனாய ச
நமோ ப்ருஹதே ச வர்ஷீயசே ச

    { title:"நமகம் — அனுவாகம் 6 | Anuvāka 6", badge:"badge-namakam",
      text:`நமோ ஜ்யேஷ்டாய ச கனிஷ்டாய ச

நமோ ஜகன்யாய ச புத்நியாய ச
நம: சோப்யாய ச ப்ரதிசர்யாய ச

நம உர்வர்யாய ச கல்யாய ச

நமோ வன்யாய ச கக்ஷ்யாய ச
நம: ஸ்ரவாய ச ப்ரதிஸ்ரவாய ச ॥

நம ஆசுஷேணாய சாசுரதாய ச

      meaning:"Salutations to the eldest and the youngest; salutations to the firstborn and the later-born; salutations to the middle one and to the one nearly grown; salutations to the last-born and to the one rooted at the base; salutations to the dweller of assemblies and the wanderer; salutations to him dwelling toward the south and the auspicious one; salutations to the lord of fertile fields and barren ground; salutations to the renowned and to him who has reached his end; salutations to the dweller of forests and thickets; salutations to fame and to him who follows fame. Salutations to him of swift hosts and swift chariots; salutations to the hero and to the piercer; salutations to the armored one and the shielded one; salutations to the helmeted and the coat-of-mail wearer; salutations to the renowned one and to the renowned army." },

      text:`நமோ துந்துப்யாய சாஹனன்யாய ச நமோ த்ருஷ்ணவே ச ப்ரமிருசாய ச
நமோ தூதாய ச ப்ரஹிதாய ச நமோ நிஷங்கிணே சேஷுதிமதே ச
நமஸ்தீக்ஷ்ணேஷவே சாயுதினே ச நம: ஸ்வாயுதாய ச சுதன்வனே ச

நமோ வாஸ்தவ்யாய ச வாஸ்துபாய ச ॥`,
      meaning:"Salutations to the wielder of the war-drum and to the destroyer; salutations to the bold one and the assailant; salutations to the messenger and the emissary; salutations to the armed bearer of weapons and the quiver-bearer; salutations to the sharp-arrowed and the armed one; salutations to the well-armed and good bow-bearer; salutations to him of the highway and the path; salutations to the dweller of forts and riverbanks; salutations to him of rivers and lakes; salutations to him of streams and watery places. Salutations to him of wells and pits; salutations to the giver of rain and the withholder of rain; salutations to him of clouds and of lightning; salutations to the swift one and the sun-scorched one; salutations to him of the storm-wind and to the destroyer; salutations to the dweller of homesteads and the guardian of dwellings." },

    { title:"நமகம் — அனுவாகம் 8 | Anuvāka 8", badge:"badge-namakam",
      text:`நம: சோமாய ச ருத்ராய ச நமஸ்தாம்ராய சாருணாய ச
நம: சங்காய ச பசுபதயே ச நம உக்ராய ச பீமாய ச
நமோ அக்ரேவதாய ச தூரேவதாய ச
நமோ ஹந்த்ரே ச ஹனீயசே ச நமோ வ்ருக்ஷேப்யோ ஹரிகேசேப்யோ
நமஸ்தாராய நம: சம்பவே ச மயோபவே ச
நம: சங்கராய ச மயஸ்கராய ச
நம: சிவாய ச சிவதராய ச ॥

நமஸ்தீர்த்யாய ச கூல்யாய ச
நம: பார்யாய சாவார்யாய ச
நம: ப்ரதரணாய சோத்தரணாய ச
நம ஆதார்யாய சாலாத்யாய ச
நம: சஷ்ப்யாய ச பேன்யாய ச நம:
சிகத்யாய ச ப்ரவாஹ்யாய ச ॥`,
      meaning:"Salutations to Soma and to Rudra, salutations to the copper-hued and the rosy-hued; salutations to the benevolent Shankha and Pashupati; salutations to the fierce and the terrible; salutations to him near at the front and to him distant; salutations to the slayer and to him most worthy of being slain; salutations to those golden-locked dwellers among trees; salutations to the deliverer, to Shambhu the bestower of bliss, to Shankara the doer of good, to the giver of joy; salutations to Shiva, the auspicious, and to the supremely auspicious one. Salutations to him of river-crossings and canals; salutations to him on this shore and the far shore; salutations to him who helps cross over and ferries across; salutations to him of the ford and the firewood-gathering place; salutations to him of soft grasses and of foam; salutations to him of sandy banks and of flowing waters." },

    { title:"நமகம் — அனுவாகம் 9 | Anuvāka 9", badge:"badge-namakam",
      text:`நம இரிண்யாய ச ப்ரபத்யாய ச
நம: கிம்சிலாய ச க்ஷயணாய ச
நம: கபர்தினே ச புலஸ்தயே ச
நமோ கோஷ்ட்யாய ச க்ருஹ்யாய ச
நமஸ்தல்ப்யாய ச கேஹ்யாய ச
நம: காட்யாய ச கஹ்வரேஷ்டாய ச
நமோ ஹ்ருதய்யாய ச நிவேஷ்ப்யாய ச
நம: பாம்சவ்யாய ச ரஜஸ்யாய ச
நம: சுஷ்க்யாய ச ஹரித்யாய ச
நமோ லோப்யாய சோலப்யாய ச ॥

நம ஊர்வ்யாய ச சூர்ம்யாய ச
நம: பர்ண்யாய ச பர்ணசத்யாய ச
நமோऽபகுரமாணாய சாபிக்னதே ச
நம ஆக்கிததே ச ப்ரக்கிததே ச
நமோ வ: கிரிகேப்யோ தேவானாம் ஹிருதயேப்யோ
நமோ விக்ஷீணகேப்யோ நமோ விசின்வத்கேப்யோ
நம ஆனிர்ஹதேப்யோ நம ஆமீவத்கேப்ய: ॥`,
      meaning:"Salutations to him of barren wastelands and dried-up places; salutations to him of rocky soil and ruins; salutations to the matted-haired and to Pulastya; salutations to him of cattle-pens and homes; salutations to him of beds and dwellings; salutations to him of forts and ravines; salutations to him dwelling in the heart and in habitations; salutations to him of dust and ash; salutations to him of dry places and yellow-hued ground; salutations to him hidden and to him no longer hidden. Salutations to him of meadows and of water-pools; salutations to him of leaves and fallen leaves; salutations to him who provokes and to him who strikes; salutations to him who digs and excavates; salutations to those hill-dwelling hosts who are the hearts of the gods; salutations to the wasted ones and the discriminating ones; salutations to the unafflicted and to those bringing illness." },

    { title:"நமகம் — அனுவாகம் 10 | Anuvāka 10", badge:"badge-namakam",
      text:`த்ராபே அந்தஸஸ்பதே தரித்ரன்நீலலோஹித ।
ஏஷாம் புருஷாணாமேஷாம் பசூனாம் மா பேர்மா ரோ மோ ஏஷாம் கிஞ்சனாமமத் ॥

யா தே ருத்ர சிவா தனூ: சிவா விஷ்வாஹ பேஷஜீ ।
சிவா ருத்ரஸ்ய பேஷஜீ தயா நோ மிருட ஜீவஸே ॥

இமா ருத்ராய தவஸே கபர்தினே க்ஷயத்வீராய ப்ரபராமஹே மதிம் ।
யதா ந: சமசத்த்விபதே சதுஷ்பதே விஷ்வம் புஷ்டம் க்ராமே அஸ்மின்னநாதுரம் ॥

மிருடா நோ ருத்ரோத நோ மயஸ்க்ருதி க்ஷயத்வீராய நமசா விதேம தே ।
யச்சம் ச யோச்ச மனுராயஜே பிதா ததச்யாம தவ ருத்ர ப்ரணீதௌ ॥

மா நோ மஹாந்தமுத மா நோ அர்பகம்
மா ந உக்ஷந்தமுத மா ந உக்ஷிதம் ।
மா நோ வதீ: பிதரம் மோத மாதரம் ப்ரியா மா
நஸ்தனுவோ ருத்ர ரீரிஷ: ॥

மா நஸ்தோகே தனயே மா ந ஆயுஷி மா நோ கோஷு
மா நோ அஸ்வேஷு ரீரிஷ: ।
வீரான்மா நோ ருத்ர பாமிதோऽவதீர் ஹவிஷ்மந்தோ
நமசா விதேம தே ॥

ஆராத்தே கோக்ன உத பூருஷக்னே க்ஷயத்வீராய
சும்னமஸ்மே தே அஸ்து ।
ரக்ஷா ச நோ அதி ச தேவ ப்ரூஹ்யதா ச ந:
சர்ம யச்ச த்விபர்ஹா: ॥

ஸ்துஹி ஸ்ருதம் கர்தசதம் யுவானம் மிருகந்ந பீமமுபஹந்துமுக்ரம் ।
மிருடா ஜரித்ரே ருத்ர ஸ்தவானோ அந்யந்தே
அஸ்மன்னிவபந்து சேனா: ॥

பரிணோ ருத்ரஸ்ய ஹேதிர்விருணக்து பரி த்வேஷஸ்ய துர்மதிரகாயோ: ।
அவ ஸ்திரா மகவத்ப்யஸ்தனுஷ்வ மீட்வஸ்தோகாய
தனயாய மிருடய ॥

மீடுஷ்டம சிவதம சிவோ ந: சுமனா பவ ।
பரமே வ்ருக்ஷ ஆயுதம் நிதாய க்ருத்திம் வசான
ஆசர பினாகம் விப்ரதாகாஹி ॥`,
      meaning:"O lord of nourishment, terrible one of reddish-blue hue, be not wrathful nor destroy these our people, our cattle — let nothing of theirs perish in any way. May your auspicious form, O Rudra, that brings healing in every place, the healing remedy of Rudra — by that, give us mercy and grant us life. We offer this prayer of devotion to mighty, matted-haired Rudra, the lord of dwelling heroes, that all in this village, biped and quadruped, may thrive and remain free of affliction. Be gracious to us, Rudra, grant us joy, O lord of dwelling heroes; with reverence we offer salutation, that we may obtain what our father Manu obtained through sacrifice, by your guidance, O Rudra. Harm not our great ones nor our little ones, harm not those who beget nor those soon to be born; harm not our father nor our mother; do not, O Rudra, injure these dear bodies of ours. Harm not our offspring or descendants, harm not our span of life, harm not our cattle or our horses; slay not our heroes in your fury, O Rudra — we offer oblations and salutation to you. Far be your wrath from the slayer of cattle and from the slayer of men, O lord of dwelling heroes; may your favor be with us; protect us, speak on our behalf, O god, and grant us shelter twice over. Praise the renowned, youthful one seated in the cave, terrible as a wild beast and fierce in striking down; be gracious to your praiser, O Rudra — let your hosts pass over and strike elsewhere, not us. May the weapon of Rudra and his ill-will born of anger pass us by on every side; loosen the bowstring for the prosperous and be merciful toward our children, O bounteous one. O most bountiful, most auspicious one, be well-disposed toward us; having placed your weapon upon the great tree and wrapped yourself in a hide, come bearing the Pinaka bow." },

    { title:"நமகம் — அனுவாகம் 11 | Anuvāka 11 (Upasaṃhāra)", badge:"badge-namakam",
      text:`விகிரித விலோஹித நமஸ்தே அஸ்து பகவன் ।
யாஸ்தே சஹஸ்ரஹேதயோऽன்யமஸ்மன்னிவபந்து தா: ॥

சஹஸ்ராணி சஹஸ்ரதா பாஹுவோஸ்தவ ஹேதய: ।
தாசாமீசானோ பகவ: பராசீனா முகா க்ருதி ॥

சஹஸ்ராணி சஹஸ்ரசோ யே ருத்ரா அதி பூம்யாம் ।
தேஷாம் சஹஸ்ரயோஜனேऽவதன்வானி தன்மசி ॥

அஸ்மின் மஹத்யர்ணவேऽந்தரிக்ஷே பவா அதி ॥
நீலக்ரீவா: சிதிகண்டா: சர்வா அத: க்ஷமாசரா: ॥
நீலக்ரீவா: சிதிகண்டா திவருத்ரா உபஸ்ரிதா: ॥
யே வ்ருக்ஷேஷு சச்பிஞ்சரா நீலக்ரீவா விலோஹிதா: ॥
யே பூதானாமதிபதயோ விசிகாச: கபர்தின: ॥
யே அன்னேஷு விவித்யந்தி பாத்ரேஷு பிபதோ ஜனான் ॥
யே பதாம் பதிரக்ஷய ஐலப்ருதா யவ்யுத: ॥
யே தீர்தானி ப்ரசரந்தி ஸ்ருகாவந்தோ நிஷங்கிண: ॥

ய ஏதாவந்தச்ச பூயாம்சச்ச திசோ ருத்ரா விதஸ்திரே
தேஷாம் சஹஸ்ரயோஜனே । அவதன்வானி தன்மசி ॥

நமோ ருத்ரேப்யோ யே ப்ருதிவ்யாம் யே । அந்தரிக்ஷே
யே திவி யேஷாமன்னம் வாதோ வர்ஷமிஷவஸ்தேப்யோ தச
ப்ராசீர்தச தக்ஷிணா தச ப்ரதீசீர்தசோதீசீர்தசோர்த்வாஸ்தேப்யோ
நமஸ்தே நோ மிருடயந்து தே யம் த்விஷ்மோ யச்ச நோ த்வேஷ்டி
தம் வோ ஜம்பே ததாமி ॥

த்ர்யம்பகம் யஜாமஹே சுகந்திம் புஷ்டிவர்தனம் ।
உர்வாருகமிவ பந்தனான் மிருத்யோர் முக்ஷீய மாऽம்ருதாத் ॥

யோ ருத்ரோ அக்னௌ யோ அப்சு ய ஓஷதீஷு ।
யோ ருத்ரோ விஷ்வா புவனாऽऽவிவேச
தஸ்மை ருத்ராய நமோ அஸ்து ॥

தமுஷ்டுஹி ய: ஸ்விஷு: சுதன்வா யோ விஷ்வஸ்ய க்ஷயதி பேஷஜஸ்ய ।
யக்ஷ்வாமஹே சௌமனசாய ருத்ரம் நமோபிர்தேவமசுரம் துவஸ்ய ॥

அயம் மே ஹஸ்தோ பகவானயம் மே பகவத்தர: ।
அயம் மே விஷ்வபேஷஜோऽயம் சிவாபிமர்சன: ॥

யே தே சஹஸ்ரமயுதம் பாசா மிருத்யோ மர்த்யாய ஹந்தவே ।
தான் யஜ்ஞஸ்ய மாயயா சர்வானவ யஜாமஹே ।
மிருத்யவே ஸ்வாஹா மிருத்யவே ஸ்வாஹா ॥

நமோ பகவதே ருத்ராய விஷ்ணவே மிருத்யுர்மே பாஹி ।
ப்ராணானாம் கிரந்திரசி ருத்ரோ மா விசாந்தக: ।
தேனான்னேனாப்யாயஸ்வ ॥

நமோ ருத்ராய விஷ்ணவே மிருத்யுர்மே பாஹி ॥

ஓம் சாந்தி: சாந்தி: சாந்தி: ॥`,
      meaning:"O scatterer and tawny-red one, salutations to you, O Lord — let your thousand weapons fall upon another, not on us. Thousands upon thousands of weapons are in your arms; turn their faces away from us, O Lord. Thousands upon thousands of Rudras dwell upon this earth — at a thousand leagues' distance, we unstring their bows. Upon this vast ocean, in the atmosphere, dwell the Bhava-Rudras: the blue-throated, white-throated wanderers of the lower realms; the blue-throated, white-throated celestial Rudras above; those golden-tawny, blue-throated, red-bodied ones who dwell in trees; those turbaned, sharp-weaponed lords of beings; those who strike down people partaking of food and drink from vessels; the guardians of paths, swift protectors of travelers; those who roam sacred fords bearing ladles and weapons. To however many Rudras, in all directions, who have taken their stand — at a thousand leagues distance we unstring their bows. Salutations to the Rudras who dwell on earth, in the atmosphere, and in the heavens, whose food is wind and whose arrows are rain — salutations in the ten directions: east, south, west, north, and upward. May they show us mercy; whoever we hate, and whoever hates us, that one we deliver into their jaws. We worship the three-eyed one, fragrant and the increaser of prosperity; like a cucumber freed from its stem, may we be freed from death, not from immortality. Salutations to that Rudra who is in fire, who is in the waters, who is in the herbs, who has entered all the worlds. Praise him who bears a good arrow and a good bow, who rules over every remedy; with salutations we worship Rudra, the divine one, for our well-being — we honor that mighty god. This hand of mine is divine, this hand of mine is most divine; this hand of mine is the universal remedy, this is the auspicious healing touch. Whatever thousand or ten thousand snares Death holds for mortal beings to seize them, all of these we appease through the power of sacrifice — to Death, salutation; to Death, salutation. Salutations to the blessed Rudra-Vishnu — let Death protect me. You are the knot that binds the life-breaths, O Rudra; let it not slip away — be nourished by this offering. Salutations to Rudra-Vishnu — let Death protect me. Om Peace, Peace, Peace." }
  ],

  chamakam: [
    { title:"சமகம் — அனுவாகம் 1 | Anuvāka 1", badge:"badge-chamakam",
      text:`அக்னாவிஷ்ணூ சஜோஷசேமா வர்தந்து வாம் கிர: ।
த்யும்னைர்வாஜேபிராகதம் ।

வாஜச்ச மே ப்ரசவச்ச மே
ப்ரயதிச்ச மே ப்ரசிதிச்ச மே தீதிச்ச மே க்ரதுச்ச
மே ஸ்வரச்ச மே ச்லோகச்ச மே ஸ்ராவச்ச மே ஸ்ருதிச்ச
மே ஜ்யோதிச்ச மே சுவச்ச மே ப்ராணச்ச மேऽபானச்ச மே
வ்யானச்ச மேऽசுச்ச மே சித்தம் ச ம ஆதீதம் ச மே
வாக்ச மே மனச்ச மே சக்ஷுச்ச மே ஸ்ரோத்ரம் ச மே
தக்ஷச்ச மே பலம் ச ம ஓஜச்ச மே சஹச்ச ம
ஆயுச்ச மே ஜரா ச ம ஆத்மா ச மே தனூச்ச மே சர்ம
ச மே வர்ம ச மேऽங்கானி ச மேऽஸ்தானி ச மே பரு:ம்ஷி
ச மே சரீராணி ச மே ॥`,
      meaning:"O Agni and Vishnu, may these our words of praise, offered together, increase you both — may you both come with radiance and with strength. May vigor and the power that brings it forth be mine. May effort and concentration be mine, may meditation and right action be mine. May good resonance, fame, glory, and learning be mine. May light and heavenly bliss be mine. May the in-breath, the down-breath, and the diffused breath be mine. May vital force, consciousness, and resolve be mine. May speech, mind, sight, and hearing be mine. May skill, strength, vigor, and endurance be mine. May long life and graceful old age be mine, may the self and the body be mine. May well-being and protection be mine, may my limbs and bones, my joints and my whole body be mine." },

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let currentSection = 'namakam';
let currentIndex   = 0;
let autoInterval   = null;

// ═══════════════════════════════════════════════════════
//  SECTION SWITCH
// ═══════════════════════════════════════════════════════
function switchSection(sec) {
  currentSection = sec;
  currentIndex   = 0;
  stopAuto();
  document.querySelectorAll('.snav-btn').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
  renderSection();
}

function renderSection() {
  const main = document.getElementById('main-content');
  if (currentSection === 'rudra_hierarchy') {
    main.innerHTML = renderHierarchy();
  } else if (currentSection === 'maha_mrityunjaya') {
    main.innerHTML = renderMahaMrityunjaya();
  } else {
    renderViewer(main);
  }
}

// ═══════════════════════════════════════════════════════
//  HIERARCHY PANEL

        <h3>அதி ருத்ரம் | Ati Rudram</h3>
        <div class="tier-sa">அதி ருத்ர — உத்தம</div>
        <p>The supreme and ultimate form — eleven Maha Rudrams (14,641 total recitations of Namakam). Performed rarely, lasting several days, with hundreds of Vedic priests. Considered the highest worship of Shiva.</p>
        <span class="count-badge">11× Mahā = 14,641× Namakam</span>
      </div>
    </div>
    <div class="hier-note">
      <strong>ஏகம் சத்</strong> — The One Truth is called by many names. All five levels are paths to the same Rudra, 
      who is <strong>Namakam</strong>'s fierce protector and <strong>Chamakam</strong>'s compassionate bestower of boons.<br/>
      The Eswara Geetha proclaims: <em>"Vedānāṃ Sāmavedīyam, Yājuṣam Śatarudrīyam"</em> — among the Vedas I am Samaveda; among Yajur hymns I am the Śatarudrīya.
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════
//  MAHA MRITYUNJAYA PANEL
// ═══════════════════════════════════════════════════════
function renderMahaMrityunjaya() {
  return `
  <div class="info-panel">
    <div class="info-card purple">
      <div class="info-header">
        <div class="info-icon">🔱</div>
        <div>
          <h2>மஹா மிருத்யுஞ்ஜய மந்திரம்</h2>
          <div class="info-sa">Mahā Mṛtyuñjaya Mantra — The Great Death-Conquering Mantra</div>
          <div class="info-src">ரிக் வேத 7.59.12 · யஜுர் வேத 3.60 · Sri Rudram (Namakam) உள்ளே | Embedded in Sri Rudram</div>
        </div>
      </div>
      <div class="divider"></div>

      <div class="mantra-block">ஓம் திரயம்பகம் யஜாமஹே
ஸுகன்திம் புஷ்டிவர்தனம் ।
உர்வாருகமிவ பன்தனான்
ம்ருத்யோர்முக்ஷீய மாம்ருதாத் ॥</div>

      <div class="meaning-section">
        <div class="meaning-label">🔆 பொருள் | Meaning (Word by Word)</div>
        <div class="meaning-text">
          We worship the three-eyed one (Tryambaka = Shiva) who is fragrant and who nourishes all beings.
          May He liberate us from death like the cucumber (urvāruka) is separated from its vine —
          and may He not withhold immortality from us.
        </div>
      </div>

      <div class="sub-section">
        <h3>⚗️ சொல் பொருள் | Word-by-Word Breakdown</h3>
        <div class="verse-grid">
          <div class="verse-item"><div class="verse-num">1</div><div class="verse-text">திரயம்பகம் (Tryambakam)</div><div class="verse-meaning">The three-eyed one — Shiva</div></div>
          <div class="verse-item"><div class="verse-num">2</div><div class="verse-text">யஜாமஹே (Yajāmahe)</div><div class="verse-meaning">We worship / offer reverence</div></div>
          <div class="verse-item"><div class="verse-num">3</div><div class="verse-text">ஸுகன்திம் (Sugandhim)</div><div class="verse-meaning">The fragrant one / sweet-scented</div></div>
          <div class="verse-item"><div class="verse-num">4</div><div class="verse-text">புஷ்டிவர்தனம் (Puṣṭivardhanam)</div><div class="verse-meaning">The nourisher and increaser of all</div></div>
          <div class="verse-item"><div class="verse-num">5</div><div class="verse-text">உர்வாருகம் (Urvārukam)</div><div class="verse-meaning">The cucumber (bound to its vine)</div></div>
          <div class="verse-item"><div class="verse-num">6</div><div class="verse-text">இவ பன்தனாத் (iva bandhanāt)</div><div class="verse-meaning">Like from its bondage / stalk</div></div>
          <div class="verse-item"><div class="verse-num">7</div><div class="verse-text">ம்ருத்யோர் முக்ஷீய (Mṛtyormukṣīya)</div><div class="verse-meaning">May I be released from death</div></div>
          <div class="verse-item"><div class="verse-num">8</div><div class="verse-text">மாம்ருதாத் (Māmṛtāt)</div><div class="verse-meaning">Not separated from immortality (amṛta)</div></div>
        </div>
      </div>

      <div class="sub-section">
        <h3>✨ சிறப்பு | Significance</h3>
        <div class="meaning-text" style="font-style:normal;">
          The Maha Mrityunjaya is one of the most potent mantras in all the Vedas. It appears as verse 7.59.12 of the Rigveda, verse 3.60 of the Yajurveda, and is embedded within the Namakam of Sri Rudram. It is also known as the <strong style="color:var(--gold)">Tryambaka Mantra</strong> and <strong style="color:var(--gold)">Mrityunjaya Mantra</strong>. The mantra invokes Shiva as the destroyer of death itself — chanting it 108 times is a complete cycle; 1,008 times constitutes a Japa Mala parayana; and 125,000 recitations constitute the Maha Mrityunjaya Homa.

      <div class="card-actions">

}

function copyMM() {
  const text = `ஓம் திரயம்பகம் யஜாமஹே\nஸுகன்திம் புஷ்டிவர்தனம் ।\nஉர்வாருகமிவ பன்தனான்\nம்ருத்யோர்முக்ஷீய மாம்ருதாத் ॥`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.card-actions .action-btn');
    if(btn){ btn.textContent = '✅ நகல் ஆனது'; setTimeout(()=>{ btn.textContent='📋 மந்திரத்தை நகல் செய்'; },2000); }
  });
}

// ═══════════════════════════════════════════════════════
//  SHLOKA VIEWER
// ═══════════════════════════════════════════════════════
function renderViewer(main) {
  const data  = DATA[currentSection];
  const item  = data[currentIndex];
  const total = data.length;

  const sectionLabels = {
    namakam:          ['அனுவாகம்','Anuvāka'],
    chamakam:         ['அனுவாகம்','Anuvāka'],
    shata_rudriya:    ['பாகம்','Part'],
    rudra_ashtadhyayi:['அத்யாயம்','Chapter']
  };
  const [tamil, eng] = sectionLabels[currentSection] || ['பாகம்','Part'];

  const dots = data.map((_,i) =>
    `<div class="dot${i===currentIndex?' active':''}" title="${tamil} ${i+1}" onclick="goTo(${i})"></div>`
  ).join('');

  main.innerHTML = `
    <div class="viewer-wrap">
      <div class="anuvaka-label" id="anuvaka-label">${tamil} ${currentIndex+1} | ${eng} ${currentIndex+1}</div>
      <div class="progress-text">${currentIndex+1} / ${total} ${tamil}கள்</div>
      <div class="shloka-card" id="shloka-card">
        <div class="shloka-number-badge ${item.badge}">${tamil} ${currentIndex+1}</div>
        <div class="shloka-title">${item.title}</div>
        <div class="shloka-text" id="shloka-text">${item.text}</div>
        <div class="meaning-section">
          <div class="meaning-label">🔆 பொருள் | Meaning</div>
          <div class="meaning-text" id="meaning-text">${item.meaning}</div>
        </div>
        <div class="card-actions">
          <button class="action-btn ${autoInterval?'active':''}" id="auto-btn" onclick="toggleAuto()">
            ${autoInterval?'⏹ நிறுத்து':'▶️ தானாக படிக்கவும்'}
          </button>
          <button class="action-btn" onclick="copyText()">📋 நகல் செய்</button>
        </div>
      </div>
      <div class="nav-area">
        <button class="nav-btn" id="prev-btn" onclick="navigate(-1)" ${currentIndex===0?'disabled':''}>← முந்தைய</button>
        <div class="dots-area">${dots}</div>
        <button class="nav-btn" id="next-btn" onclick="navigate(1)" ${currentIndex===total-1?'disabled':''}>அடுத்த →</button>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════════════
function navigate(dir) {
  const data = DATA[currentSection];
  const next = currentIndex + dir;
  if(next >= 0 && next < data.length) { currentIndex = next; renderSection(); window.scrollTo({top:0,behavior:'smooth'}); }
}
function goTo(i) { currentIndex = i; renderSection(); window.scrollTo({top:0,behavior:'smooth'}); }

// ═══════════════════════════════════════════════════════
//  AUTO-READ
// ═══════════════════════════════════════════════════════
function toggleAuto() { autoInterval ? stopAuto() : startAuto(); }
function startAuto() {
  autoInterval = setInterval(() => {
    const data = DATA[currentSection];
    if(currentIndex < data.length - 1) { currentIndex++; renderSection(); }
    else stopAuto();
  }, 8000);
  renderSection();
}
function stopAuto() { clearInterval(autoInterval); autoInterval = null; renderSection(); }

// ═══════════════════════════════════════════════════════
//  COPY
// ═══════════════════════════════════════════════════════
function copyText() {
  const el = document.getElementById('shloka-text');
  if(!el) return;
  navigator.clipboard.writeText(el.textContent).then(() => {
    const btns = document.querySelectorAll('.card-actions .action-btn');
    const btn = btns[btns.length-1];
    if(btn){ btn.textContent='✅ நகல் ஆனது'; setTimeout(()=>{ btn.textContent='📋 நகல் செய்'; },2000); }
  });
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
renderSection();
</script>
</body>
</html>
