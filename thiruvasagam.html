 மா மலர்ச் சேவடிக்கண், நம் சென்னி மன்னி, திகழுமே!", "முத்தனை, முதல் சோதியை, முக் கண் அப்பனை, முதல் வித்தினை,\nசித்தனை, சிவலோகனை, திரு நாமம் பாடித் திரிதரும்\nபத்தர்காள்! இங்கே, வம்மின், நீர்; உங்கள் பாசம் தீரப் பணிமினோ;\nசித்தம் ஆர்தரும் சேவடிக்கண், நம் சென்னி மன்னி, திகழுமே.!"]], ["திருவார்த்தை", ["மாது இவர் பாகன், மறை பயின்ற வாசகன், மா மலர் மேய சோதி,\nகோது இல் பரம் கருணை, அடியார் குலாவும் நீதி குணம் ஆய\nநல்கும்,\nபோது அலர் சோலைப் பெருந்துறை, எம் புண்ணியன், மண்ணிடை\nவந்திழிந்து,\nஆதிப் பிரமம் வெளிப்படுத்த அருள் அறிவார் எம்பிரான் ஆவாரே.", "மால், அயன், வானவர் கோனும், வந்து வணங்க, அவர்க்கு\nஅருள்செய்த ஈசன்,\nஞாலம் அதனிடை வந்திழிந்து, நல் நெறி காட்டி, நலம் திகழும்\nகோல மணி அணி மாடம் ணீடு குலாவும் இடவை மட நல்லாட்கு,\nசீலம் மிகக் கருணை அளிக்கும் திறம் அறிவார் எம்பிரான் ஆவாரே.", "அணி முடி ஆதி அமரர் கோமான், ஆனந்தக் கூத்தன், அறு சமயம்\nபணி வகை செய்து, படவு அது ஏறி, பாரொடு விண்ணும் பரவி ஏத்த,\nபிணி கெட, நல்கும் பெருந்துறை எம் பேர் அருளாளன், பெண்பால்\nஉகந்து,\nமணி வலை கொண்டு, வான் மீன் விசிறும் வகை அறிவார்\nஎம்பிரான் ஆவாரே.", "வேடு உர ஆகி, மயேந்திரத்து மிகு குறை வானவர் வந்து,\nதன்னைத்\nதேட இருந்த சிவபெருமான், சிந்தனை செய்து, அடியோங்கள் உய்ய,\nஆடல் அமர்ந்த பரிமா ஏறி, ஐயன், பெருந்துறை ஆதி, அந் நாள்\nடெர்களை எங்கும் ஆண்டுகொண்ட இயல்பு அறிவார் எம்பிரான்\nஆவாரே.", "வந்து, இமையோர்கள் வணங்கி ஏத்த, மாக் கருணைக் கடல் ஆய்,\nஅடியார்\nபந்தனை விண்டு அற நல்கும், எங்கள் பரமன், பெருந்துறை ஆதி, அந்\nநாள்\nஉந்து திரைக் கடலைக் கடந்து, அன்று, ஓங்கு மதில் இலங்கை\nஅதனில்,\nபந்து அணை மெல் விரலாட்கு அருளும் பரிசு அறிவார் எம்பிரான்\nஆவாரே.", "வேவ, திரிபுரம், செற்ற வில்லி, வேடுவன் ஆய், கடி நாய்கள் சூழ,\nவெல் செயல் செய்யும் தேவர் முன்னே எம்பெருமான் தான்,\nஇயங்கு காட்டில்\nஏ உண்ட பன்றிக்கு இரங்கி, ஈசன், எந்தை, பெருந்துறை ஆதி, அன்று\nகேவலம் கேழல் ஆய், பால் கொடுத்த கிடப்பு அறிவார் எம்பிரான்\nஆவாரே.", "நாதம் உடையது ஒர் நல் கமலப் போதினில் நண்ணிய நல்\nநுதலார்,\nஓதி, பணிந்து, அலர் தூவி, ஏத்த, ஒளி வளர் சோதி, எம் ஈசன்;\nமன்னும்,\nபோது அலர் சோலை, பெருந்துறை எம் புண்ணியன்; மண்ணிடை\nவந்து தோன்றி,\nபேதம் கெடுத்து, அருள் செய் பெருமை அறியவல்லார் எம்பிரான்\nஆவாரே.", "பூ அலர் கொன்றை அம் மாலை மார்பன், போர் உகிர் வன் புலி\nகொன்ற வீரன்,\nமாது நல்லாள், உமை மங்கை, பங்கன், வண் பொழில் சூழ் தென்\nபெருந்துறைக் கோன்,\nஏது இல் பெரும் புகழ் எங்கள் ஈசன், இரும் கடல் வாணற்குத்\nதீயில் தோன்றும்\nஓவிய மங்கையர் தோள் புணரும் உருவு அறிவார் எம்பிரான்\nஆவாரே.", "தூ வெள்ளை நீறு அணி எம்பெருமான், சோதி மயேந்திர நாதன்,\nவந்து\nதேவர் தொழும் பதம் வைத்த ஈசன், தென்னன், பெருந்துறை ஆளி,\nஅன்று\nகாதல் பெருக, கருணை காட்டி, தன் கழல் காட்டி, கசிந்து உ௬௧,\nகேதம் கெடுத்து, என்னை ஆண்டருளும் கிடப்பு அறிவார் எம்பிரான்\nஆவாரே.", "அம் கணன், எங்கள் அமரர் பெம்மான், அடியார்க்கு அமுதன், அவனி\nவந்த\nஎங்கள் பிரான், இரும் பாசம் தீர இக பரம் ஆயது ஒர் இன்பம் எய்த,\nசங்கம் கவர்ந்து, வண் சாத்தினோடும், சதுரன், பெருந்துறை ஆளி,\nஅன்று,\nமங்கையர் மல்கு மதுரை சேர்ந்த வகை அறிவார் எம்பிரான்\nஆவாரே."]], ["எண்ணப் பதிகம்", ["பார் ௨௬ ஆய பிறப்பு அற வேண்டும்; பத்திமையும் பெற வேண்டும்;\nசீர் உ௬ ஆய சிவபெருமானே, செம் கமல மலர் போல\nஆர் ௨௬ ஆய என் ஆர் அமுதே, உன் அடியவர் தொகை நடுவே,\nஓர் ௨௬ ஆய நின் திருவருள் காட்டி, என்னையும்\nஉய்யக்கொண்டருளே.", "உரியேன் அல்லேன் உனக்கு அடிமை; உன்னைப் பிரிந்து, இங்கு ஒரு\nபொழுதும்\nதரியேன், நாயேன்; இன்னது என்று அறியேன்; சங்கரா!\nகருணையினால்\nபெரியோன் ஒருவன், கண்டு கொள் என்று, உன் பெய் கழல் அடி\nகாட்ட,\nபிரியேன் என்று என்று, அருளிய அருளும் பொய்யோ? எங்கள்\nபெருமானே!", "என்பே உரக, நின் அருள் அளித்து, உன் இணை மலர் அடி காட்டி,\nமுன்பே என்னை ஆண்டுகொண்ட முனிவா, முனிவர், முழு முதலே,\nஇன்பே அருளி, எனை உருக்கி, உயிர் உண்கின்ற எம்மானே,\nநன்பே அருளாய் என் உயிர் நாதா! நின் அருள் நாணாமே.", "பத்து இலன் ஏனும், பணிந்திலன் ஏனும், உன் உயர்ந்த பைம் கழல்\nகாணப்\nபித்து இலன் ஏனும், பிதற்றிலன் ஏனும், பிறப்பு அறுப்பாய்;\nஎம்பெருமானே!\nமுத்து அனையானே! மணி அனையானே! முதல்வனே!\nமுறையோ?' என்று\nஎத்தனையானும் யான் தொடர்ந்து, உன்னை இனிப் பிரிந்து\nஆற்றேனே.", "காணும் அது ஒழிந்தேன் நின் திருப் பாதம்; கண்டு கண் களி கூர,\nபேணும் அது ஒழிந்தேன்; பிதற்றும் அது ஒழிந்தேன்; பின்னை,\nஎம்பெருமானே,\nதாணுவே, அழிந்தேன்: நின் நினைந்து உருகும் தன்மை, என்\nபுன்மைகளால்\nகாணும் அது ஒழிந்தேன்; நீ இனி வரினும், காணவும் நாணுவனே.", "பால் திரு நீற்று எம் பரமனை; பரம் கருணையொடும் எதிர்ந்து\nதோற்றி, மெய் அடியார்க்கு அருள் துறை அளிக்கும் சோதியை; நீதி\nஇலேன்,\nபோற்றி, என் அமுதே, என நினைந்து, ஏத்தி, புகழ்ந்து, அழைத்து,\nஅலறி, என் உள்ளே\nஆற்றுவன் ஆக; உடையவனே, எனை, ஆவ' என்று அருளாயே!"]], ["யாத்திரைப் பத்து", ["பூ ஆர் சென்னி மன்னன், எம் புயங்கப் பெருமான், சிறியோமை\nஓவாது உள்ளம் கலந்து, உணர்வு ஆய் உருக்கும் வெள்ளக்\nகருணையினால்,\nஆ! ஆ! என்னப் பட்டு, அன்பு ஆய் ஆட்பட்டீர், வந்து ஒருப்படுமின்;\nபோவோம்; காலம் வந்தது காண்; பொய் விட்டு, உடையான் கழல்\nபுகவே.", "புகவே வேண்டாம் புலன்களில் நீர்; புயங்கப் பெருமான் பூம்\nகழல்கள்\nமிகவே நினைமின்; மிக்க எல்லாம் வேண்டா; போக விடுமின்கள்;\nநகவே, ஞாலத்து உள் புகுந்து நாயே அனைய நமை ஆண்ட,\nதகவே உடையான் தனைச் சாரத் தளராது இருப்பார் தாம் தாமே.", "தாமே தமக்குச் சுற்றமும், தாமே தமக்கு விதி வகையும்;\nயாம் ஆர்? எமது ஆர்? பாசம் ஆர்? என்ன மாயம்? இவை போக,\nகோமான் பண்டைத் தொண்டரொடும், அவன் தன் குறிப்பே\nகுறிக்கொண்டு,\nபோம் ஆறு அமைமின் பொய் நீக்கி, புயங்கன் ஆள்வான் பொன்\nஅடிக்கே.", "அடியார் ஆனீர் எல்லீரும், அகலவிடுமின் விளையாட்டை;\nகடி சேர் அடியே வந்து அடைந்து, கடைக்கொண்டு இருமின் திருக்\nகுறிப்பை;\nசெடி சேர் உடலைச் செல நீக்கி, சிவலோகத்தே நமை வைப்பான்\nபொடி சேர் மேனிப் புயங்கன் தன், பூ ஆர் கழற்கே புகவிடுமே.", "விடுமின் வெகுளி, வேட்கை நோய்; மிகவே, காலம் இனி இல்லை;\nஉடையான் அடிக்கீழ், பெரும் சாத்தோடு உடன் போவதற்கே\nஒருப்படுமின்;\nஅடைவோம், நாம் போய்ச் சிவபுரத்துள், அணி ஆர் கதவு அது\nஅடையாமே;\nபுடைபட்டு உருகிப் போற்றுவோம், புயங்கன் ஆள்வான்\nபுகழ்களையே.", "புகழ்மின்; தொழுமின்; பூப் புனைமின்; புயங்கன் தாளே புந்தி\nவைத்திட்டு,\nஇகழ்மின் எல்லா அல்லலையும்; இனி, ஓர் இடையூறு அடையாமே,\nதிகழும் சீர் ஆர் சிவபுரத்துச் சென்று, சிவன் தாள் வணங்கி, நாம்\nநிகழும் அடியார் முன் சென்று, நெஞ்சம் உருகி, நிற்போமே.", "நிற்பார் நிற்க; நில்லா உலகில் நில்லோம்; இனி, நாம் செல்வோமே,\nபொற்பால் ஒப்பாம் திருமேனிப் புயங்கன் ஆள்வான் பொன்\nஅடிக்கே;\nநிற்பீர் எல்லாம், தாழாதே, நிற்கும் பரிசே, ஒருப்படுமின்;\nபிற்பால் நின்று, பேழ்கணித்தால், பெறுதற்கு அரியன், பெருமானே.", "பெருமான் பேர் ஆனந்தத்துப் பிரியாது இருக்கப் பெற்றீர்காள்,\nஅரு மால் உற்றுப் பின்னை நீர், அம்மா! அழுங்கி அரற்றாதே,\nதிரு மா மணி சேர் திருக் கதவம் திறந்தபோதே, சிவபுரத்து,\nதிருமால் அறியாத் திருப் புயங்கன் திருத் தாள் சென்று\nசேர்வோமே.", "சேரக் கருதி, சிந்தனையைத் திருந்த வைத்து, சிந்திமின்;\nபோரில் பொலியும் வேல் கண்ணாள் பங்கன், புயங்கன், அருள்\nஅமுதம்\nஆரப் பருகி, ஆராத ஆர்வம் கூர அழுந்துவீர!\nபோரப் புரிமின் சிவன் கழற்கே, பொய்யில் கிடந்து புரளாதே.", "புரள்வார், தொழுவார், புகழ்வார், ஆய்; இன்றே வந்து, ஆள் ஆகாதீர்,\nமருள்விர; பின்னை, மதிப்பார் ஆர்? மதியுள் கலங்கி, மயங்குவீர்;\nதெருள்வீர் ஆகில், இது செய்மின்; சிவலோகக் கோன், திருப்புயங்கன்\nஅருள் ஆர் பெறுவார், அகல் இடத்தே? அந்தோ! அந்தோ! அந்தோவே!"]], ["திருப்படை எழுச்சி", ["ஞான வாள் ஏந்தும் ஐயர் நாதப் பறை அறைமின்;", "மான மா ஏறும் ஐயர் மதி வெண் குடை கவிமின்;\nஆன நீற்றுக் கவசம் அடையப் புகுமின்கள்;\nவான ஊர் கொள்வோம் நாம் மாயப் படை வாராமே.\nதொண்டர்காள், தூசி செல்லீர்; பத்தர்காள், சூழப் போகீர்;", "ஒண் திறல் யோகிகளே, பேர் அணி உந்தீர்கள்;\nதிண் திறல் சித்தர்களே, கடைக் கூழை செல்மின்கள்;\nஅண்டர் நாடு ஆள்வோம் நாம் அல்லல் படை வாராமே."]], ["திருவெண்பா", ["வெய்ய வினை இரண்டும் வெந்து அகல, மெய் உருகி,", "பொய்யும் பொடி ஆகாது; என் செய்கேன்? செய்ய\nதிரு ஆர் பெருந்துறையான் தேன் உந்து செம் தீ\nமருவாது இருந்தேன் மனத்து.\nஆர்க்கோ? அரற்றுகோ? ஆடூகோ? பாடுகோ?", "பார்க்கோ? பரம்பரனே, என் செய்கேன்? தீர்ப்பு அரிய\nஆனந்த மால் ஏற்றும் அத்தன், பெருந்துறையான்\nதான்' என்பார் ஆர் ஒருவர் தாழ்ந்து?", "செய்த பிழை அறியேன்; சேவடியே, கை தொழுதே,\nஉய்யும் வகையின் உயிர்ப்பு அறியேன் வையத்து\nஇருந்து, உறையுள் வேல் மடுத்து, என் சிந்தனைக்கே கோத்தான்\nபெருந்துறையில் மேய பிரான்.", "முன்னை வினை இரண்டும் வேர் அறுத்து, முன் நின்றான்\nபின்னைப் பிறப்பு அறுக்கும் பேராளன்; தென்னன்;\nபெருந்துறையில் மேய பெரும் கருணையாளன்;\nவரும் துயரம் தீர்க்கும் மருந்து.", "அறையோ, அறிவார்க்கு? அனைத்து உலகும் ஈன்ற\nமறையோனும், மாலும், மால் கொள்ளும் இறையோன்;\nபெருந்துறையுள் மேய பெருமான்; பிரியாது\nஇருந்து உறையும், என் நெஞ்சத்து இன்று.", "பித்து என்னை ஏற்றும்; பிறப்பு அறுக்கும்; பேச்சு அரிது ஆம்;\nமத்தமே ஆக்கும், வந்து, என் மனத்தை; அத்தன்,\nபெருந்துறையான், ஆட்கொண்டு பேர் அருளால் நோக்கும்\nமருந்து, இறவாப் பேரின்பம், வந்து.", "வாரா வழி அருளி வந்து, எனக்கு மாறு இன்றி,\nஆரா அமுதாய் அமைந்தன்றே சீர் ஆர்\nதிருத்தன், பெருந்துறையான், என் சிந்தை மேய\nஒருத்தன், பெருக்கும் ஒளி.", "யாவர்க்கும் மேல் ஆம் அளவு இலாச் சீர் உடையான்,\nயாவர்க்கும் கீழ் ஆம் அடியேனை, யாவரும்\nபெற்று அறியா இன்பத்துள் வைத்தாய்க்கு, என் எம்பெருமான்!\nமற்று அறியேன் செய்யும் வகை.", "மூவரும், முப்பத்து மூவரும், மற்று ஒழிந்த\nதேவரும், காணாச் சிவபெருமான் மா ஏறி,\nவையகத்தே வந்திழிந்த வார் கழல்கள் வந்திக்க,\nமெய்யகத்தே இன்பம் மிகும்.", "இருந்து என்னை ஆண்டான் இணை அடியே சிந்தித்து\nஇருந்து, இரந்துகொள், நெஞ்சே! எல்லாம் தரும் காண்\nபெருந்துறையில் மேய பெரும் கருணையாளன்,\nமருந்து உருவாய், என் மனத்தே, வந்து.", "இன்பம் பெருக்கி, இருள் அகற்றி, எஞ்ஞான்றும்\nதுன்பம் தொடர்வு அறுத்து, சோதி ஆய், அன்பு அமைத்து,\nசீர் ஆர் பெருந்துறையான் என்னுடைய சிந்தையே\nஊர் ஆகக் கொண்டான், உவந்து.", "பண்டு ஆய நான்மறை", "பண்டு ஆய நான்மறையும் பால் அணுகா; மால், அயனும்,\nகண்டாரும் இல்லை; கடையேனைத் தொண்டு ஆகக்\nகொண்டருளும் கோகழி எம் கோமாற்கு, நெஞ்சமே!\nஉண்டாமோ கைம்மாறு? உரை.", "உள்ள மலம் மூன்றும் மாய, உகு பெரும் தேன்\nவெள்ளம் தரும், பரியின் மேல் வந்த, வள்ளல்\nமருவும் பெருந்துறையை வாழ்த்துமின்கள்; வாழ்த்த,\nகருவும் கெடும், பிறவிக் காடு.", "காட்டகத்து வேடன்; கடலில் வலை வாணன்;\nநாட்டில் பரிப் பாகன்; நம் வினையை விட்டி,\nஅருளும் பெருந்துறையான்; அம் கமல பாதம்,\nமருளும் கெட, நெஞ்சே! வாழ்த்து.", "வாழ்ந்தார்கள் ஆவாரும், வல் வினையை மாய்ப்பாரும்,\nதாழ்ந்து உலகம் ஏத்தத் தகுவாரும் சூழ்ந்து அமரர்\nசென்று, இறைஞ்சி, ஏத்தும் திரு ஆர் பெருந்துறையை\nநன்று இறைஞ்சி, ஏத்தும் நமர்.", "நண்ணிப் பெருந்துறையை, நம் இடர்கள் போய் அகல,\nஎண்ணி எழு கோகழிக்கு அரசை, பண்ணின்\nமொழியாளோடு உத்தரகோசமங்கை மன்னிக்\nகழியாது இருந்தவனை, காண்.", "காணும் கரணங்கள் எல்லாம் பேரின்பம் என,\nபேணும் அடியார் பிறப்பு அகல, காணும்\nபெரியானை, நெஞ்சே! பெருந்துறையில் என்றும்\nபிரியானை, வாய் ஆரப் பேசு.", "பேசும் பொருளுக்கு இலக்கிதம் ஆய், பேச்சு இறந்த\nமாசு இல் மணியின் மணி வார்த்தை பேசி,\nபெருந்துறையே என்று, பிறப்பு அறுத்தேன் நல்ல\nமருந்தின் அடி என் மனத்தே வைத்து."]], ["திருப்படை ஆட்சி", ["கண்கள் இரண்டும் அவன்கழல் கண்டு களிப்பன ஆகாதே\nகாரிகை யார்கள்தம் வாழ்விலென் வாழ்வு கடைப்படும் ஆகாதே\nமண்களில் வந்து பிறந்திடு மாறு மறந்திடூும் ஆகாதே\nமாலறி யாமலர்ப் பாதம் இரண்டும் வணங்குதும் ஆகாதே\nபண்களி கூர்தரு பாடலொ டாடல் பயின்றிடும் ஆகாதே\nபாண்டிநன் னாடுடை யான்படை யாட்சிகள் பாடுதும் ஆகாதே\nவிண்களி கூர்வதோர் வேதகம் வந்து வெளிப்படும் ஆகாதே\nமீன்வலை வீசிய கானவன் வந்து வெளிப்படு மாயிடிலே.", "ஒன்றினொடூ ஒன்றும், ஒர் ஜஐந்தினொடு ஐந்தும், உயிர்ப்பதும்\nஆகாதே?\nஉன் அடியார் அடியார் அடியோம் என உய்ந்தன ஆகாதே?", "கன்றை நினைந்து எழு தாய் என வந்த கணக்கு அதும் ஆகாதே?\nகாரணம் ஆகும் மன ஆதி குணங்கள் கருத்து உறும் ஆகாதே?\nநன்று, இது, தீது, என வந்த நடுக்கம் நடந்தன ஆகாதே?\nநாமும் மேல் ஆம் அடியாருடனே செல, நண்ணுதும் ஆகாதே?\nஎன்றும் என் அன்பு நிறைந்த பராஅமுது எய்துவது ஆகாதே?\nஏறு உடையான், எனை ஆளுடை நாயகன், என்னுள் புகுந்திடிலே!", "பந்த விகார குணங்கள் பறிந்து மறிந்திடும் ஆகாதே?\nபாவனை ஆய கருத்தினில் வந்த பரா அமுது ஆகாதே?\nஅந்தம் இலாத அகண்டமும் நம்முள் அகப்படும் ஆகாதே?\nஆதி முதல் பரம் ஆய பரம் சுடர் அண்ணுவது ஆகாதே?\nசெம் துவர் வாய் மடவார் இடர் ஆனவை சிந்திடும் ஆகாதே?\nசேல் அன கண்கள் அவன் திருமேனி திளைப்பன ஆகாதே?\nஇந்திரஞால இடர்ப் பிறவித் துயர் ஏகுவது ஆகாதே?\nஎன்னுடை நாயகன் ஆகிய ஈசன் எதிர்ப்படும் ஆயிடிலே!", "என் அணி ஆர் முலை ஆகம் அளைந்து, உடன் இன்புறும் ஆகாதே?\nஎல்லை இல் மாக் கருணைக் கடல் இன்று இனிது ஆடுதும்\nஆகாதே?\nநல் மணி நாதம் முழங்கி, என் உள் உற, நண்ணுவது ஆகாதே?\nநாதன் அணித் திரு நீற்றினை நித்தலும் நண்ணுவது ஆகாதே?\nமன்னிய அன்பரில் என் பணி முந்துற வைகுவது ஆகாதே?\nமா மறையும் அறியா மலர்ப் பாதம் வணங்குதும் ஆகாதே?\nஇன் இயல் செங்கழுநீர் மலர் என் தலை எய்துவது ஆகாதே?\nஎன்னை உடைப் பெருமான், அருள் ஈசன், எழுந்தருளப் பெறிலே!", "மண்ணினில் மாயை மதித்து, வகுத்த மயக்கு அறும் ஆகாதே?\nவானவரும் அறியா மலர்ப் பாதம் வணங்குதும் ஆகாதே?\nகண் இலி காலம் அனைத்தினும் வந்த கலக்கு அறும் ஆகாதே?\nகாதல் செயும் அடியார் மனம் இன்று களித்திடும் ஆகாதே?\nபெண், அலி, ஆண், என, நாம் என, வந்த பிணக்கு அறும் ஆகாதே?", "பேர் அறியாத அனேக பவங்கள் பிழைத்தன ஆகாதே?\nஎண் இலி ஆகிய சித்திகள் வந்து, எனை எய்துவது ஆகாதே?\nஎன்னை உடைப் பெருமான், அருள் ஈசன், எழுந்தருளப் பெறிலே!", "பொன் இயலும் திருமேனி வெண் நீறு பொலிந்திடும் ஆகாதே?\nபூ மழை, மாதவர் கைகள் குவிந்து, பொழிந்திடும் ஆகாதே?\nமின் இயல் நுண் இடையார்கள் கருத்து வெளிப்படும் ஆகாதே?\nவீணை முரன்று எழும் ஓசையில் இன்பம் மிகுத்திடூும் ஆகாதே?\nதன் அடியார் அடி என் தலைமீது தழைப்பன ஆகாதே?\nதான் அடியோமுடனே உய வந்து, தலைப்படும் ஆகாதே?\nஇன் இயம் எங்கும் நிறைந்து, இனிது ஆக இயம்பிடும் ஆகாதே?\nஎன்னை முன் ஆளுடை ஈசன், என் அத்தன், எழுந்தருளப் பெறிலே!\nசொல் இயலாது எழு தூ மணி ஓசை சுவை தரும் ஆகாதே?", "துண் என என் உளம் மன்னிய சோதி தொடர்ந்து எழும் ஆகாதே?\nபல் இயல்பு ஆய பரப்பு அற வந்த பரா பரம் ஆகாதே?\nபண்டு அறியாத பர அனுபவங்கள் பரந்து எழும் ஆகாதே?\nவில் இயல் நல் நுதலார் மயல் இன்று விளைந்திடும் ஆகாதே?\nவிண்ணவரும் அறியாத விழுப் பொருள் இப் பொருள் ஆகாதே?\nஎல்லை இலாதன எண் குணம் ஆனவை எய்திடும் ஆகாதே?\nஇந்து சிகாமணி எங்களை ஆள, எழுந்தருளப் பெறிலே!\nசங்கு திரண்டு, முரன்று எழும் ஓசை தழைப்பன ஆகாதே?", "சாதி விடாத குணங்கள் நம்மோடு சலித்திடும் ஆகாதே?\nஅங்கு இது நன்று, இது நன்று, எனும் மாயை அடங்கிடும் ஆகாதே?\nஆசை எலாம், அடியார் அடியோம் எனும் அத்தனை ஆகாதே?\nசெம் கயல் ஒண் கண் மடந்தையர் சிந்தை திளைப்பன ஆகாதே?\nசீர் அடியார்கள் சிவ அனுபவங்கள் தெரிந்திடும் ஆகாதே?\nஎங்கும் நிறைந்து, அமுது ஊறு, பரம்சுடர் எய்துவது ஆகாதே?\nஈறு அறியா மறையோன் எனை ஆள, எழுந்தருளப் பெறிலே!"]], ["ஆனந்த மாலை", ["மின் நேர் அனைய பூம் கழல்கள் அடைந்தார் கடந்தார், வியன்\nஉலகம்;\nபொன் நேர் அனைய மலர் கொண்டு போற்றா நின்றார், அமரர்\nஎல்லாம்;\nகல் நேர் அனைய மனக் கடையாய், கழிப்புண்டு, அவலக் கடல்\nவீழ்ந்த\nஎன் நேர் அனையேன், இனி, உன்னைக் கூடும்வண்ணம் இயம்பாயே.\nஎன்னால் அறியாப் பதம் தந்தாய்; யான் அது அறியாதே கெட்டேன்;", "உன்னால் ஒன்றும் குறைவு இல்லை; உடையாய், அடிமைக்கு யார்?\nஎன்பேன்:\nபல் நாள் உன்னைப் பணிந்து ஏத்தும் பழைய அடியரொடும் கூடாது,\nஎன் நாயகமே! பிற்பட்டூ, இங்கு, இருந்தேன் நோய்க்கு விருந்தாயே.\nசீலம் இன்றி, நோன்பு இன்றி, செறிவே இன்றி, அறிவு இன்றி,", "தோலின் பாவைக் கூத்தாட்டு ஆய், சுழன்று, விழுந்து, கிப்பேனை\nமாலும் காட்டி, வழி காட்டி, வாரா உலக நெறி ஏற,\nகோல     function stop() { clearTimeout(timer); timer = null; speechSynthesis && speechSynthesis.cancel(); $('auto').classList.remove('on'); $('auto').textContent = '▶️ தானாக படிக்கவும்' }
    function step() {
      if (i >= flat.length - 1) { stop(); return }
      const f = flat[i], ms = Math.max(6000, f.v.length * 110);
      const go = () => { if (!timer) return; show(i + 1); step() };
      if ('speechSynthesis' in window && speechSynthesis.getVoices().some(v => v.lang.startsWith('ta'))) {
        const u = new SpeechSynthesisUtterance(f.v); u.lang = 'ta-IN'; u.onend = () => { if (timer) timer = setTimeout(go, 1200) };
        timer = setTimeout(() => { }, 1e9); speechSynthesis.speak(u);
      } else timer = setTimeout(go, ms);
    }
    $('auto').onclick = () => { if (timer) { stop(); return } $('auto').classList.add('on'); $('auto').textContent = '⏸️ நிறுத்து'; step() };
    $('prev').onclick = () => { stop(); show(i - 1) };
    $('next').onclick = () => { stop(); show(i + 1) };
    $('sel').onchange = e => { stop(); show(firstIdx[+e.target.value]) };
    $('copy').onclick = async () => {
      const f = flat[i], t = f.t + ' - பாடல் ' + f.n + '\n\n' + f.v;
      try { await navigator.clipboard.writeText(t) } catch (e) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove() }
      const b = $('copy'), o = b.textContent; b.textContent = '✅ நகல் செய்யப்பட்டது'; setTimeout(() => b.textContent = o, 1500)
    };
    document.addEventListener('keydown', e => { if (e.target.tagName === 'SELECT') return; if (e.key === 'ArrowLeft') { stop(); show(i - 1) } if (e.key === 'ArrowRight') { stop(); show(i + 1) } });
    show(i);
  </script>
  <script src="assets/js/shared-header.js"></script>
</body>
