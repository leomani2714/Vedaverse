\nஉதைத்தல் பாடி,\nஇயைந்தன முப்புரம் எய்தல் பாடி ஏழை அடியோமை\nஆண்டுகொண்ட\nநயம் தனைப் பாடிநின்று, ஆடி ஆடி, நாதற்கு, சுண்ணம் இடித்தும்,\nநாமே!", "வட்ட மலர்க் கொன்றை மாலை பாடி, மத்தமும் பாடி, மதியும் பாடி,\nசிட்டர்கள் வாழும் தென் தில்லை பாடி, சிற்றம்பலத்து எங்கள்\nசெல்வம் பாடி,\nகட்டிய மாசுணக் கச்சை பாடி, கங்கணம் பாடி, கவித்த கைம்மேல்\nஇட்டுநின்று ஆடும் அரவம் பாடி, ஈசற்கு, சுண்ணம் இடித்தும், நாமே!", "வேதமும், வேள்வியும், ஆயினார்க்கு; மெய்ம்மையும், பொய்ம்மையும்,\nஆயினார்க்கு;\nசோதியும் ஆய், இருள் ஆயினார்க்கு; துன்பமும் ஆய், இன்பம்\nஆயினார்க்கு;\nபாதியும் ஆய், முற்றும் ஆயினார்க்கு; பந்தமும் ஆய், விடும்\nஆயினாருக்கு;\nஆதியும், அந்தமும், ஆயினாருக்கு; ஆட, பொற்சுண்ணம் இடித்தும்,\nநாமே!"]], ["திருக்கோத்தும்பி", ["பூ ஏறு கோனும், புரந்தரனும், பொற்பு அமைந்த\nநா ஏறு செல்வியும், நாரணனும், நான்மறையும்,\nமா ஏறு சோதியும், வானவரும், தாம் அறியாச்\nசே ஏறு சேவடிக்கே சென்று ஊதாய்; கோத்தும்பீ!", "நான் ஆர்? என் உள்ளம் ஆர்? ஞானங்கள் ஆர்? என்னை யார்\nஅறிவார்\nவானோர் பிரான் என்னை ஆண்டிலனேல்? மதி மயங்கி\nஊன் ஆர் உடை தலையில் உண் பலி தேர் அம்பலவன்\nதேன் ஆர் கமலமே சென்று ஊதாய்; கோத்தும்பி", "தினைத்தனை உள்ளது ஓர் பூவினில் தேன் உண்ணாதே,\nநினைத்தொறும், காண்தொறும், பேசும்தொறும், எப்போதும்,\nஅனைத்து எலும்பு உள் நெக, ஆனந்தத் தேன் சொரியும்\nகுனிப்பு உடையானுக்கே சென்று ஊதாய்; கோத்தும்பீ\nகண்ணப்பன் ஒப்பது ஓர் அன்பு இன்மை கண்டபின்,\nஎன் அப்பன், என் ஒப்பு இல் என்னையும் ஆட்கொண்டருளி,\nவண்ணப் பணித்து, என்னை வா! என்ற வான் கருணைச்\nசுண்ணப் பொன் நீற்றற்கே சென்று ஊதாய்; கோத்தும்பீ", "அத் தேவர் தேவர்; அவர் தேவர்;' என்று, இங்ஙன்,\nபொய்த் தேவு பேசி, புலம்புகின்ற பூதலத்தே,\nபத்து ஏதும் இல்லாது, என் பற்று அற, நான் பற்றிநின்ற\nமெய்த் தேவர் தேவற்கே சென்று ஊதாய்; கோத்தும்பி", "வைத்த நிதி, பெண்டிர், மக்கள், குலம், கல்வி, என்னும்\nபித்த உலகில், பிறப்போடு இறப்பு, என்னும்\nசித்த விகாரக் கலக்கம் தெளிவித்த\nவித்தகத் தேவற்கே சென்று ஊதாய்; கோத்தும்பீ", "சட்டோ நினைக்க, மனத்து அமுது ஆம் சங்கரனை,\nகெட்டேன், மறப்பேனோ? கேடுபடாத் திருவடியை\nஒட்டாத பாவித் தொழும்பரை நாம் ௨௬ அறியோம்;\nசிட்டாய சிட்டற்கே சென்று ஊதாய்; கோத்தும்பீ!", "ஒன்று ஆய், முளைத்து, எழுந்து, எத்தனையோ கவடு விட்டு,\nநன்று ஆக வைத்து, என்னை நாய் சிவிகை ஏற்றுவித்த\nஎன் தாதை; தாதைக்கும், எம் அனைக்கும், தம் பெருமான்!\nகுன்றாத செல்வற்கே சென்று ஊதாய்; கோத்தும்பி", "கரணங்கள் எல்லாம் கடந்துநின்ற கறை மிடற்றன்\nசரணங்களே சென்று சார்தலுமே, தான் எனக்கு\nமரணம், பிறப்பு, என்று, இவை இரண்டின் மயக்கு அறுத்த\nகருணைக் கடலுக்கே சென்று ஊதாய்; கோத்தும்பீ", "நோய் உற்று, மூத்து, நான் நுந்து கன்றாய் இங்கு இருந்து,\nநாய் உற்ற செல்வம் நயந்து அறியாவண்ணம் எல்லாம்,\nதாய் உற்று வந்து, என்னை ஆண்டுகொண்ட தன் கருணைத்\nதேய் உற்ற செல்வற்கே சென்று ஊதாய்; கோத்தும்பீ!", "வல் நெஞ்சக் கள்வன், மன வலியன்,' என்னாதே,\nகல் நெஞ்சு உருக்கி, கருணையினால் ஆண்டுகொண்ட,\nஅன்னம் திளைக்கும் அணி தில்லை அம்பலவன்\nபொன் அம் கழலுக்கே சென்று ஊதாய்; கோத்தும்பீ", "நாயேனைத் தன் அடிகள் பாடுவித்த நாயகனை,\nபேயேனது உள்ளப் பிழை பொறுக்கும் பெருமையனை,\nசீ ஏதும் இல்லாது என் செய் பணிகள் கொண்டருளும்\nதாய் ஆன ஈசற்கே சென்று ஊதாய்; கோத்தும்பீ!", "நான் தனக்கு அன்பு இன்மை, நானும், தானும், அறிவோம்;\nதான் என்னை ஆட்கொண்டது எல்லாரும் தாம் அறிவார்;\nஆன கருணையும் அங்கு உற்றே தான்; அவனே\nகோன் என்னைக் கூட குளிர்ந்து ஊதாய்; கோத்தும்பீ!", "௧௬ ஆய், உலகினுக்கு அப்புறம் ஆய், இப் புறத்தே\nமரு ஆர் மலர்க் குழல் மாதினொடும் வந்தருளி,\nஅரு ஆய், மறை பயில் அந்தணன் ஆய், ஆண்டுகொண்ட\nதிரு ஆன தேவற்கே சென்று ஊதாய்; கோத்தும்பீ!", "நானும், என் சிந்தையும், நாயகனுக்கு எவ் இடத்தோம்\nதானும், தன் தையலும், தாழ் சடையோன் ஆண்டிலனேல்?\nவானும், திசைகளும், மா கடலும், ஆய பிரான்\nதேன் உந்து சேவடிக்கே சென்று ஊதாய்; கோத்தும்பீ", "உள்ளப்படாத திருஉருவை உள்ளுதலும்,\nகள்ளப்படாத களிவந்த வான் கருணை\nவெள்ளப் பிரான், எம்பிரான், என்னை வேறே ஆட்\nகொள் அப் பிரானுக்கே சென்று ஊதாய்; கோத்தும்பீ", "பொய் ஆய செல்வத்தே புக்கு, அழுந்தி, நாள்தோறும்\nமெய்யாக் கருதிக் கிடந்தேனை, ஆட்கொண்ட\nஐயா! என் ஆர் உயிரே! அம்பலவா! என்று, அவன் தன்\nசெய் ஆர் மலர் அடிக்கே சென்று ஊதாய்; கோத்தும்பீ", "தோலும், துகிலும்; குழையும், சுருள் தோடும்;\nபால் வெள்ளை நீறும், பசும் சாந்தும்; பைங் கிளியும்,\nசூலமும்; தொக்க வளையும்; உடைத் தொன்மைக்\nகோலமே நோக்கி குளிர்ந்து ஊதாய்; கோத்தும்பீ!", "கள்வன், கடியன், கலதி, இவன்! என்னாதே,\nவள்ளல், வரவர வந்து ஒழிந்தான் என் மனத்தே;\nஉள்ளத்து உறு துயர், ஒன்று ஒழியாவண்ணம், எல்லாம்\nதெள்ளும் கழலுக்கே சென்று ஊதாய்; கோத்தும்பி", "பூ மேல் அயனோடு மாலும் புகல் அரிது என்று\nஏமாறி நிற்க, அடியேன் இறுமாக்க,\nநாய் மேல் தவிசு இட்டு, நன்றாப் பொருட்படுத்த\nதீ மேனியானுக்கே சென்று ஊதாய்; கோத்தும்பீ"]], ["திருத்தெள்ளேணம்", ["திருமாலும் பன்றியாய்ச் சென்று உணராத் திருவடியை,\nஉர நாம் அறிய, ஓர் அந்தணன் ஆய், ஆண்டுகொண்டான்;\nஒரு நாமம், ஓர் உருவம், ஒன்றும் இல்லாற்கு, ஆயிரம்\nதிருநாமம் பாடி, நாம் தெள்ளேணம் கொட்டாமோ!", "திரு ஆர் பெருந்துறை மேய பிரான் என் பிறவிக்\n௧௬ வேர் அறுத்தபின், யாவரையும் கண்டது இல்லை;\nஅரு ஆய், உருவமும் ஆய பிரான், அவன் மருவும்\nதிருவாரூர் பாடி, நாம் தெள்ளேணம் கொட்டாமோ!", "அரிக்கும், பிரமற்கும், அல்லாத தேவர்கட்கும்,\nதெரிக்கும் படித்து அன்றி நின்ற சிவம், வந்து, நம்மை\nஉருக்கும், பணி கொள்ளும், என்பது கேட்டு, உலகம் எல்லாம்\nசிரிக்கும் திறம் பாடி தெள்ளேணம் கொட்டாமோ!", "அவம் ஆய தேவர் அவ கதியில் அழுந்தாமே\nபவ மாயம் காத்து, என்னை ஆண்டுகொண்ட பரஞ்சோதி\nநவம் ஆய செம் சுடர் நல்குதலும், நாம் ஒழிந்து,\nசிவம் ஆனவா பாடி தெள்ளேணம் கொட்டாமோ!", "அருமந்த தேவர், அயன், திருமாற்கு, அரிய சிவம்\nஉருவந்து, பூதலத்தோர் உகப்பு எய்த, கொண்டருளி,\n௧௬ வெந்து விறக் கடைக்கணித்து, என் உளம் புகுந்த\nதிரு வந்தவா பாடி தெள்ளேணம் கொட்டாமோ!", "அரை ஆடு நாகம் அசைத்த பிரான், அவனியின்மேல்,\nவரை ஆடு மங்கை தன் பங்கொடும், வந்து, ஆண்ட திறம்\nஉரை ஆட, உள் ஒளி ஆட, ஒள் மா மலர்க் கண்களில் நீர்\nதிரை ஆடுமா பாடி தெள்ளேணம் கொட்டாமோ!", "ஆ! ஆ! அரி, அயன், இந்திரன், வானோர்க்கு, அரிய சிவன்,\nவா, வா என்று, என்னையும் பூதலத்தே வலிந்து ஆண்டுகொண்டான்;\nபூ ஆர் அடிச் சுவடு என் தலைமேல் பொறித்தலுமே,\nதே ஆனவா பாடி தெள்ளேணம் கொட்டாமோ!", "கறங்கு ஓலை போல்வதுஓர் காயப் பிறப்போடுஇறப்பு என்னும்,\nஅறம், பாவம், என்று இரண்டு அச்சம் தவிர்த்து, என்னை\nஆண்டுகொண்டான்;\nமறந்தேயும் தன் கழல் நான் மறவாவண்ணம் நல்கிய, அத்\nதிறம் பாடல் பாடி, நாம் தெள்ளேணம் கொட்டாமோ!", "கல் நார் உரித்து என்ன, என்னையும் தன் கருணையினால்\nபொன் ஆர் கழல் பணித்து, ஆண்ட பிரான் புகழ் பாடி,\nமின் நேர் நுடங்கு இடை, செம் துவர் வாய், வெள் நகையீர்!\nதென்னா, தென்னா என்று தெள்ளேணம் கொட்டாமோ!", "கனவேயும் தேவர்கள் காண்பு அரிய கனை கழலோன்\nபுன வேய் அன வளைத் தோளியொடும் புகுந்தருளி,\nநனவே எனைப் பிடித்து, ஆட்கொண்டவா நயந்து, நெஞ்சம்,\nசின வேல் கண் நீர் மல்க தெள்ளேணம் கொட்டாமோ!", "கயல் மாண்ட கண்ணி தன் பங்கன் எனைக் கலந்து ஆண்டலுமே,\nஅயல் மாண்டு, அருவினைச் சுற்றமும் மாண்டு, அவனியின்மேல்\nமயல் மாண்டு, மற்று உள்ள வாசகம் மாண்டு, என்னுடைய\nசெயல் மாண்டவா பாடி தெள்ளேணம் கொட்டாமோ!", "முத்திக்கு உழன்று முனிவர் குழாம் நனி வாட,\nஅத்திக்கு அருளி, அடியேனை ஆண்டுகொண்டு,\nபத்திக் கடலுள் பதித்த பரஞ்சோதி,\nதித்திக்குமா பாடி தெள்ளேணம் கொட்டாமோ!", "பார் பாடும், பாதாளர் பாடும், விண்ணோர் தம் பாடும்,\nஆர் பாடும், சாரா வகை அருளி, ஆண்டுகொண்ட\nநேர் பாடல் பாடி, நினைப்பு அரிய தனிப் பெரியோன்\nசீர் பாடல் பாடி, நாம் தெள்ளேணம் கொட்டாமோ!", "மாலே, பிரமனே, மற்று ஒழிந்த தேவர்களே,\nநூலே, நுழைவுஅரியான் நுண்ணியன் ஆய், வந்து, அடியேன்\nபாலே புகுந்து, பரிந்து உருக்கும் பாவகத்தால்,\nசேல் ஏர் கண் நீர் மல்க தெள்ளேணம் கொட்டாமோ!", "உருகிப் பெருகி, உளம் குளிர முகந்துகொண்டு,\nபருகற்கு இனிய பரம் கருணைத் தடம் கடலை\nமருவி, திகழ் தென்னன் வார் கழலே நினைந்து, அடியோம்\nதிருவைப் பரவி, நாம் தெள்ளேணம் கொட்டாமோ!", "புத்தன், புரந்தர ஆதியர், அயன், மால், போற்றி செயும்\nபித்தன்; பெருந்துறை மேய பிரான்; பிறப்பு அறுத்த\nஅத்தன்; அணி தில்லை அம்பலவன்; அருள் கழல்கள்\nசித்தம் புகுந்தவா தெள்ளேணம் கொட்டாமோ!", "உவலைச் சமயங்கள், ஒவ்வாத சாத்திரம், ஆம்\nசவலைக் கடல் உளனாய்க் கிடந்து, தடுமாறும்\nகவலைக் கெடுத்து, கழல் இணைகள் தந்தருளும்\nசெயலைப் பரவி, நாம் தெள்ளேணம் கொட்டாமோ!", "வான் கெட்டு, மாருதம் மாய்ந்து, அழல், நீர், மண், கெடினும்,\nதான் கெட்டல் இன்றி, சலிப்பு அறியாத் தன்மையனுக்கு,\nஊன் கெட்டு, உயிர் கெட்டு, உணர்வு கெட்டு, என் உள்ளமும் போய்,\nநான் கெட்டவா பாடி தெள்ளேணம் கொட்டாமோ!", "விண்ணோர் முழு முதல்; பாதாளத்தார் வித்து;\nமண்ணோர் மருந்து; அயன், மால், உடைய வைப்பு; அடியோம்\nகண் ஆர, வந்துநின்றான்; கருணைக் கழல் பாடி,\nதென்னா, தென்னா என்று தெள்ளேணம் கொட்டாமோ!", "குலம் பாடி, கொக்கு இறகும் பாடி, கோல் வளையாள்\nநலம் பாடி, நஞ்சு உண்டவா பாடி, நாள்தோறும்\nஅலம்பு ஆர் புனல் தில்லை அம்பலத்தே ஆடுகின்ற\nசிலம்பு ஆடல் பாடி, நாம் தெள்ளேணம் கொட்டாமோ!"]], ["திருச் சாழல்", ["பூசுவதும் வெள் நீறு, பூண்பதுவும் பொங்கு அரவம்,\nபேசுவதும் திருவாயால் மறை போலும்? காண், ஏடீ!\nபூசுவதும், பேசுவதும், பூண்பதுவும், கொண்டு என்னை?", "ஈசன் அவன் எவ் உயிர்க்கும் இயல்பு ஆனான்; சாழலோ!", "என் அப்பன், எம்பிரான், எல்லார்க்கும் தான் ஈசன்;\nதுன்னம் பெய் கோவணமாக் கொள்ளும்அது என்? ஏடீ!\nமன்னு கலை, துன்னு பொருள் மறை நான்கே, வான் சரடா,\nதன்னையே கோவணமா, சாத்தினன், காண்; சாழலோ!", "கோயில் சுடுகாடு, கொல் புலித் தோல் நல் ஆடை,\nதாயும் இலி, தந்தை இலி, தான் தனியன் காண்; ஏட!\nதாயும் இலி, தந்தை ஒலி, தான் தனியன்; ஆயிடினும்,\nகாயில், உலகு அனைத்தும் கல் பொடு, காண்; சாழலோ!", "அயனை, அனங்கனை, அந்தகனை, சந்திரனை,\nவயனங்கள் மாயா வடுச் செய்தான்; காண், ஏடீ!\nநயனங்கள் மூன்று உடைய நாயகனே தண்டித்தால்,\nசயம் அன்றோ வானவர்க்கு, தாழ் குழலாய்? சாழலோ!", "தக்கனையும், எச்சனையும், தலை அறுத்து, தேவர் கணம்\nதொக்கென வந்தவர்தம்மைத் தொலைத்ததுதான் என்? ஏடீ!\nதொக்கென வந்தவர் தம்மைத் தொலைத்தருளி அருள் கொடுத்து,\nஅங்கு\nஎச்சனுக்கு மிகைத் தலை மற்று அருளினன், காண்; சாழலோ!", "அலரவனும், மாலவனும், அறியாமே, அழல் உர ஆய்,\nநிலம் முதல், கீழ் அண்டம் உற, நின்றதுதான் என்? ஏடீ!\nநிலம் முதல், கீழ் அண்டம் உற, நின்றிலனேல் இருவரும் தம்\nசலம் முகத்தால் ஆங்காரம் தவிரார் காண் சாழலோ!", "மலை மகளை ஒரு பாகம் வைத்தலுமே மற்று ஒருத்தி\nசலம் முகத்தால் அவன் சடையில் பாயும் அது என் ஏடீ\nசலம் முகத்தால் அவன் சடையில் பாய்ந்திலளேல் தரணி எல்லாம்\nபில முகத்தே புகப்பாய்ந்து பெருங்கேடு ஆம் சாழலோ!", "கோலாலம் ஆகிக் குரை கடல்வாய் அன்று எழுந்த\nஆலாலம் உண்டான் அவன் சதுர் தான் என் ஏடீ\nஆலாலம் உண்டிலனேல் அன்று அயன் மால் உள்ளிட்ட\nமேல் ஆய தேவர் எல்லாம் விடுவர் காண் சாழலோ!", "தென் பால் உகந்து ஆடும் தில்லைச் சிற்றம்பலவன்\nபெண் பால் உகந்தான்; பெரும் பித்தன், காண்; ஏட!\nபெண் பால் உகந்திலனேல், பேதாய்! இரு நிலத்தோர்\nவிண் பால் யோகு எய்தி, வீடுவர், காண்; சாழலோ!", "தான் அந்தம் இல்லான், தனை அடைந்த நாயேனை\nஆனந்த வெள்ளத்து அழுந்துவித்தான், காண்; ஏடீ!\nஆனந்த வெள்ளத்து அழுந்துவித்த திருவடிகள்,\nவான் உந்து தேவர்கட்கு ஓர் வான் பொருள், காண்; சாழலோ!", "நங்காய்! இது என்ன தவம்? நரம்போடு, எலும்பு, அணிந்து,\nகங்காளம் தோள்மேலே காதலித்தான், காண்; ஏட!\nகங்காளம் ஆமா கேள்; கால அந்தரத்து இருவர்\nதம் காலம் செய்யத் தரித்தனன், காண்; சாழலோ!", "கான் ஆர் புலித் தோல் உடை; தலை ஊண்; காடு பதி;\nஆனால், அவனுக்கு இங்கு ஆட்படுவார் ஆர்? ஏடீ!\nஆனாலும், கேளாய்; அயனும் திருமாலும்,\nவான் நாடர் கோவும், வழி அடியார்; சாழலோ!", "மலை அரையன் பொன் பாவை, வாள் நுதலாள், பெண் திருவை\nஉலகு அறிய, தீ வேட்டான் என்னும் அது என்? ஏடீ\nஉலகு அறிய, தீ வேளாது ஒழிந்தனனேல், உலகு அனைத்தும்,\nகலை நவின்ற பொருள்கள் எல்லாம் கலங்கிடும், காண்; சாழலோ!", "தேன் புக்க தண் பணை சூழ் தில்லைச் சிற்றம்பலவன்,\nதான் புக்கு நட்டம் பயிலும்அது என்? ஏடி!\nதான் புக்கு நட்டம் பயின்றிலனேல், தரணி எல்லாம்,\nஊன் புக்க வேல் காளிக்கு ஊட்டு ஆம், காண்; சாழலோ!", "கட கரியும், பரி மாவும், தேரும், உகந்து ஏறாதே,\nஇடபம் உகந்து ஏறிய ஆறு, எனக்கு அறிய இயம்பு; ஏடீ!\nதட மதில்கள் அவை மூன்றும் தழல் எரித்த அந் நாளில்\nஇடபம் அது ஆய்த் தாங்கினான் திருமால், காண்; சாழலோ!", "நன்றாக நால்வர்க்கும் நான்மறையின் உட்பொருளை,\nஅன்று, ஆலின் கீழ் இருந்து, அங்கு, அறம் உரைத்தான், காண்; ஏடீ!\nஅன்று, ஆலின் கீழ் இருந்து, அங்கு, அறம் உரைத்தான், ஆயிடினும்,\nகொன்றான், காண், புரம் மூன்றும் கூட்டோடே; சாழலோ!", "அம்பலத்தே கூத்து ஆடி, அமுது செய்யப் பலி திரியும்\nநம்பனையும் தேவன் என்று நண்ணும்அது என்? ஏடி!\nநம்பனையும் ஆமா கேள்; நான்மறைகள் தாம் அறியா,\nஎம்பெருமான், ஈசா என்று ஏத்தின, காண்; சாழலோ!", "சலம் உடைய சலந்தரன் தன் உடல் தடிந்த நல் ஆழி,\nநலம் உடைய நாரணற்கு, அன்று, அருளிய ஆறு என்? ஏடீ!\nநலம் உடைய நாரணன், தன் நயனம் இடந்து, அரன் அடிக்கீழ்\nஅலர் ஆக இட, ஆழி அருளினன், காண்; சாழலோ!", "அம்பரம் ஆம், புள்ளித் தோல்; ஆலாலம், ஆர் அமுதம்;\nஎம்பெருமான் உண்ட சதிர், எனக்கு அறிய இயம்புல் ஏடி!\nஎம்பெருமான் ஏது உடுத்து, அங்கு ஏது அமுது செய்திடினும்,\nதம் பெருமை தான் அறியாத் தன்மையன், காண்; சாழலோ!", "அரும் தவருக்கு, ஆலின் கீழ், அறம் முதலா நான்கினையும்\nஇருந்து, அவருக்கு அருளும்அது எனக்கு அறிய இயம்பு; ஏடி!", "அரும் தவருக்கு, அறம் முதல் நான்கு அன்று\nஅருளிச்செய்திலனேல்,\nதிருந்த, அவருக்கு, உலகு இயற்கை தெரியா, காண்; சாழலோ!"]], ["திருப்பூவல்லி", ["இணை ஆர் திருவடி என் தலைமேல் வைத்தலுமே,\nதுணை ஆன சுற்றங்கள் அத்தனையும், துறந்தொழிந்தேன்;\nஅணை ஆர் புனல் தில்லை அம்பலத்தே ஆடுகின்ற\nபுணையாளன் சீர் பாடி பூவல்லி கொய்யாமோ!", "எந்தை, எம் தாய், சுற்றம், மற்றும் எல்லாம், என்னுடைய\nபந்தம் அறுத்து, என்னை ஆண்டுகொண்ட பாண்டிப் பிரான்;\nஅந்த இடைமருதில், ஆனந்தத் தேன் இருந்த\nபொந்தைப் பரவி, நாம் பூவல்லி கொய்யாமோ!", "நாயின் கடைப்பட்ட நம்மையும் ஓர் பொருட்படுத்து,\nதாயின் பெரிதும் தயா உடைய தம் பெருமான்,\nமாயப் பிறப்பு அறுத்து, ஆண்டான்; என் வல் வினையின்\nவாயில் பொடி அட்டி பூவல்லி கொய்யாமோ!", "பண் பட்ட தில்லைப் பதிக்கு அரசைப் பரவாதே,\nஎண் பட்ட தக்கன், அருக்கன், எச்சன், இந்து, அனல்,\nவிண் பட்ட பூதப் படை விரபத்திரரால்\nபுண் பட்டவா பாடி பூவல்லி கொய்யாமோ!", "தேன் ஆடு கொன்றை சடைக்கு அணிந்த சிவபெருமான்\nஊன் நாடி, நாடி வந்து, உட்புகுந்தான்; உலகர் முன்னே\nநான் ஆடி ஆடி நின்று, ஓலம் இட, நடம் பயிலும்\nவான் நாடர் கோவுக்கே பூவல்லி கொய்யாமோ!", "எரி மூன்று தேவர்க்கு இரங்கி, அருள்செய்தருளி,\nசிரம் மூன்று அற, தன் திருப் புருவம் நெரித்தருளி,\nஉர மூன்றும் ஆகி, உணர்வு அரிது ஆம் ஒருவனுமே\nபுரம் மூன்று எரித்தவார் பூவல்லி கொய்யாமோ!", "வணங்க, தலை வைத்து; வார் கழல், வாய், வாழ்த்த வைத்து;\nஇணங்க, தன் சீர் அடியார் கூட்டமும் வைத்து; எம்பெருமான்,\nஅணங்கோடு அணி தில்லை அம்பலத்தே, ஆடுகின்ற\nகுணம் கூர, பாடி, நாம் பூவல்லி கொய்யாமோ!", "நெறி செய்தருளி, தன் சீர் அடியார் பொன் அடிக்கே\nகுறி செய்துகொண்டு, என்னை ஆண்ட பிரான் குணம் பரவி,\nமுறி செய்து, நம்மை முழுது உழற்றும் பழ வினையைக்\nகிறி செய்தவா பாடி பூவல்லி கொய்யாமோ!", "பல் நாள் பரவிப் பணி செய்ய, பாத மலர்\nஎன் ஆகம் துன்னவைத்த பெரியோன், எழில் சுடர் ஆய்,\nகல் நார் உரித்து என்னை ஆண்டுகொண்டான்; கழல் இணைகள்\nபொன் ஆனவா பாடி பூவல்லி கொய்யாமோ!", "பேர் ஆசை ஆம் இந்தப் பிண்டம் அற, பெருந்துறையான்,\nசீர் ஆர் திருவடி என் தலைமேல் வைத்த பிரான்,\nகார் ஆர் கடல் நஞ்சை உண்டு உகந்த காபாலி,\nபோர் ஆர் புரம் பாடி பூவல்லி கொய்யாமோ!", "பாலும், அமுதமும், தேனுடன், ஆம் பரா பரம் ஆய்,\nகோலம் குளிர்ந்து, உள்ளம் கொண்ட பிரான் குரை கழல்கள்\nஞாலம் பரவுவார் நல் நெறி ஆம்; அந் நெறியே\nபோலும் புகழ் பாடி பூவல்லி கொய்யாமோ!", "வானவன், மால், அயன், மற்றும் உள்ள தேவர்கட்கும்\nகோன் அவன் ஆய் நின்று, கூடல் இலாக் குணக் குறியோன்\nஆன நெடும் கடல் ஆலாலம் அமுது செய்ய,\nபோனகம் ஆனவா பூவல்லி கொய்யாமோ!", "அன்று, ஆல நீழல் கீழ் அரு மறைகள், தான் அருளி,\nநன்று ஆக வானவர், மா முனிவர், நாள்தோறும்,\nநின்று, ஆர ஏத்தும் நிறை கழலோன், புனை கொன்றைப்\nபொன் தாது பாடி, நாம் பூவல்லி கொய்யாமோ!", "படம் ஆக, என் உள்ளே தன் இணைப் போது அவை அளித்து, இங்கு\nஇடம் ஆகக் கொண்டிருந்த, ஏகம்பம் மேய பிரான்,\nதடம் ஆர் மதில் தில்லை அம்பலமே தான் இடமா,\nநடம் ஆடுமா பாடி பூவல்லி கொய்யாமோ!", "அங்கி, அருக்கன், இராவணன், அந்தகன், கூற்றன்,\nசெம் கண் அரி, அயன், இந்திரனும், சந்திரனும்,\nபங்கம் இல் தக்கனும், எச்சனும், தம் பரிசு அழிய,\nபொங்கிய சீர் பாடி, நாம் பூவல்லி கொய்யாமோ!", "திண் போர் விடையான், சிவபுரத்தார் போர் ஏறு,\nமண்பால், மதுரையில் பிட்டு அமுது செய்தருளி,\nதண்டாலே பாண்டியன் தன்னைப் பணிகொண்ட,\nபுண் பாடல் பாடி, நாம் பூவல்லி கொய்யாமோ!", "முன் ஆய மால் அயனும், வானவரும், தானவரும்,\nபொன் ஆர் திருவடி தாம் அறியார்; போற்றுவதே?\nஎனாகம் உள் புகுந்து ஆண்டுகொண்டான் இலங்கு அணியாம்\nபல் நாகம் பாடி, நாம் பூவல்லி கொய்யாமோ!", "சீர் ஆர் திருவடித் திண் சிலம்பு சிலம்பு ஒலிக்கே\nஆராத ஆசை அது ஆய், அடியேன் அகம் மகிழ,\nதேர் ஆர்ந்த வீதிப் பெருந்துறையான் திரு நடம் செய்\nபேரானந்தம் பாடி பூவல்லி கொய்யாமோ!", "அத்தி உரித்து, அது போர்த்தருளும் பெருந்துறையான்,\nபித்த வடிவு கொண்டு, இவ் உலகில் பிள்ளையும் ஆய்,\nமுத்தி முழு முதல், உத்தரகோசமங்கை வள்ளல்,\nபுத்தி புகுந்தவா பூவல்லி கொய்யாமோ!", "மாவார வேறி மதுரைநகர் புகுந்தருளித்\nதேவார்ந்த கோலத் திகழப் பெருந்துறையான்\nகோவாகி வந்தெம்மைக் குற்றேவல் கொண்டருளும்\nபூவார் கழல்பரவிப் பூவல்லி கொய்யாமோ"]], ["திருஉந்தியார்", ["வளைந்தது வில்லு; விளைந்தது பூசல்;\nஉளைந்தன முப்புரம் உந்தி பற!\nஒருங்கு உடன் வெந்தவாறு உந்தி பற!", "ஈர் அம்பு கண்டிலம், ஏகம்பர் தம் கையில்;\nர் அம்பே முப்புரம் உந்தி பற!\nஒன்றும் பெரு மிகை உந்தீ பற!", "தச்சு விடுத்தலும், தாம் அடியிட்டலும்,\nச்சு முறிந்தது என்று உந்தி பறு அழிந்தன முப்புரம் உந்தீ பறு", "உய்ய வல்லார் ஒரு மூவரைக் காவல் கொண்டு\nய்ய வல்லானுக்கே உந்தி பற! இள முலை பொங்க நின்று உந்தீ", "சாடிய வேள்வி சரிந்திட, தேவர்கள்\nஓடியவா பாடி உந்தீ பற! உருத்திர நாதனுக்கு உந்தீ பற!", "ஆ! ஆ! திருமால், அவிப் பாகம் கொண்டு, அன்று,\nசாவாது இருந்தான் என்று உந்தி பற! சதுர்முகன் தாதை என்று\nஉந்தி பற!", "வெய்யவன் அங்கி விழுங்கத் திரட்டிய\nகையைத் தறித்தான் என்று உந்தீ பற! கலங்கிற்று வேள்வி என்று\nஉந்தி பற!", "பார்ப்பதியைப் பகை சாற்றிய தக்கனைப்\nபார்ப்பது என்னே? ஏடி! உந்தீ பற! பணை முலை பாகனுக்கு உந்தி", "புரந்தரனார் ஒரு பூம் குயில் ஆகி,\nம் தனில் ஏறினார் உந்தி பற! வானவர் கோன் என்றே உந்தீ பற!", "வெம் சின வேள்வி வியாத்திரனார் தலை\nதுஞ்சினவா பாடி உந்தீ பற! தொடர்ந்த பிறப்பு அற உந்தி பற!", "ஆட்டின் தலையை விதிக்குத் தலை ஆகக்\nட்டியவா பாடி உந்தீ பற! கொங்கை குலுங்க நின்று உந்தீ பற!", "உண்ணப் புகுந்த பகன் ஒளித்து ஓடாமே,\nண்ணைப் பறித்தவாறு உந்த பற! கருக் கெட, நாம் எல்லாம் உந்தி", "நா மகள் நாசி, சிரம் பிரமன், பட,\nசோமன் முகம் நெரித்து உந்தி பற! தொல்லை வினை கெட உந்த", "நான்மறையோனும், மகத்து இயமான், பட,\nபோம் வழி தேடும் ஆறு உந்தீ பற! புரந்தரன் வேள்வியில் உந்தி", "சூரியனார் தொண்டை வாயினில் பற்களை\nவாரி, நெரித்த ஆறு உந்தீ பற! மயங்கிற்று வேள்வி என்று உந்தி", "தக்கனார், அன்றே, தலை இழந்தார்; தக்கன்\nக்களைச் சூழ நின்று உந்தி பற! மடிந்தது வேள்வி என்று உந்தீ பற!", "பாலகனார்க்கு, அன்று பால் கடல் ஈந்திட்ட\nகோலச் சடையற்கே உந்தீ பற! குமரன் தன் தாதைக்கே உந்தீ பற!", "நல்ல மலரின்மேல் நான்முகனார் தலை\nல்லை அரிந்தது என்று உந்தீ பற! உகிரால் அரிந்தது என்று உந்தீ", "தேரை நிறுத்தி, மலை எடுத்தான் சிரம்\nர் ஐந்தும் இற்ற ஆறு உந்தி பறு இருபதும் இற்றது என்று உந்தீ பறு", "கொச மிட்ட இருடிகள் போகாமல்\nஆகாசங் காவலென் றுந்தீபற அதற்கப்பாலூங் காவலென் றுந்தீபற"]], ["திருத்தோள் நோக்கம்", ["பூத்து ஆரும் பொய்கைப் புனல் இதுவே, எனக் கருதி,\nபேய்த்தேர் முகக்க உறும் பேதை குணம் ஆகாமே,\nதீர்த்தாய்; திகழ் தில்லை அம்பலத்தே திரு நடம் செய்\nகூத்தா! உன் சேவடி கூடும்வண்ணம் தோள் நோக்கம்!", "என்றும் பிறந்து, இறந்து, ஆழாமே, ஆண்டுகொண்டான்;\nகன்றால் விளவு எறிந்தான், பிரமன், காண்பு அரிய\nகுன்றாத சீர்த் தில்லை அம்பலவன்; குணம் பரவி,\nதுன்று ஆர் குழலினீர! தோள் நோக்கம் ஆடாமோ!", "பொருள் பற்றிச் செய்கின்ற பூசனைகள் போல் விளங்க,\nசெருப்பு உற்ற சீர் அடி, வாய்க் கலசம், ஊன் அமுதம்,\nவிருப்பு உற்று, வேடனார் சேடு எறிய மெய் குளிர்ந்து, அங்கு,\nஅருள் பெற்று, நின்றவா தோள் நோக்கம் ஆடாமோ!", "கல் போலும் நெஞ்சம் கசிந்து உ௬க, கருணையினால்\nநிற்பானைப் போல, என் நெஞ்சின் உள்ளே புகுந்தருளி,\nநல் பால் படுத்து என்னை, நாடு அறியத் தான் இங்ஙன்,\nசொல் பாலது ஆனவா தோள் நோக்கம் ஆடாமோ!", "நிலம், நீர், நெருப்பு, உயிர், நீள் விசும்பு, நிலா, பகலோன்,\nபுலன் ஆய மைந்தனோடு, எண் வகையாய்ப் புணர்ந்துநின்றான்;\nஉலகு ஏழ் என, திசை பத்து என, தான் ஒருவனுமே\nபல ஆகி, நின்றவா தோள் நோக்கம் ஆடாமோ!", "புத்தன் முதல் ஆய புல் அறிவின் சில் சமயம்,\nதம் தம் மதங்களில் தட்டுளுப்புப் பட்டு நிற்க,\nசித்தம் சிவம் ஆக்கி, செய்தனவே தவம் ஆக்கும்\nஅத்தன் கருணையினால் தோள் நோக்கம் ஆடாமோ!", "தீது இல்லை மாணி, சிவ கருமம் சிதைத்தானை,\nசாதியும் வேதியன், தாதை தனை, தாள் இரண்டும்\nசேதிப்ப, ஈசன் திருவருளால் தேவர் தொழ,\nபாதகமே சோறு பற்றினவா தோள் நோக்கம்!", "மானம் அழிந்தோம்; மதி மறந்தோம்; மங்கைநல்லீர்!\nவானம் தொழும் தென்னன் வார் கழலே நினைந்து, அடியோம்,\nஆனந்தக் கூத்தன் அருள் பெறின், நாம் அவ்வணமே\nஆனந்தம் ஆகி, நின்று ஆடாமோ தோள் நோக்கம்!", "எண் உடை மூவர் இராக்கதர்கள், எரி பிழைத்து,\nகண் நுதல் எந்தை கடைத்தலைமுன் நின்றதன் பின்,\nஎண் இலி இந்திரர், எத்தனையோ பிரமர்களும்,\nமண்மிசை மால் பலர், மாண்டனர்; காண் தோள் நோக்கம்!", "பங்கயம் ஆயிரம் பூவினில், ஓர் பூக் குறைய,\nதம் கண் இடந்து, அரன் சேவடிமேல் சாத்தலுமே,\nசங்கரன், எம் பிரான், சக்கரம் மாற்கு அருளிய ஆறு,\nஎங்கும் பரவி, நாம் தோள் நோக்கம் ஆடாமோ!", "காமன் உடல்; உயிர், காலன்; பல், காய் கதிரோன்;\nநா மகள் நாசி; சிரம், பிரமன்; கரம், எரியை;\nசோமன் கலை; தலை தக்கனையும், எச்சனையும்;\nதூய்மைகள் செய்தவா தோள் நோக்கம் ஆடாமோ!", "பிரமன், அரி, என்ற இருவரும், தம் பேதைமையால்\nபரமம், யாம் பரமம் என்றவர்கள் பதைப்பு ஒடுங்க,\nஅரனார், அழல் உர ஆய், அங்கே, அளவு இறந்து,\nபரம் ஆகி, நின்றவா தோள் நோக்கம் ஆடாமோ!", "ஏழைத் தொழும்பனேன், எத்தனையோ காலம் எல்லாம்,\nபாழுக்கு இறைத்தேன், பரம்பரனைப் பணியாதே;\nஊழி முதல், சிந்தாத நல் மணி, வந்து, என் பிறவித்\nதாழைப் பறித்தவா தோள் நோக்கம் ஆடாமோ!", "உரை மாண்ட உள் ஒளி உத்தமன் வந்து, உளம் புகலும்,\nகரை மாண்ட காமப் பெரும் கடலைக் கடத்தலுமே,\nஇரை மாண்ட இந்திரியப் பறவை இரிந்து ஓட,\nதுரை மாண்டவா பாடி தோள் நோக்கம் ஆடாமோ!"]], ["திருப்பொன் ஊசல்", ["சீர் ஆர் பவளம் கால், முத்தம் கயிறு, ஆக;\nஏர் ஆரும் பொன் பலகை ஏறி, இனிது அமர்ந்து;\nநாராயணன் அறியா நாள் மலர்த் தாள், நாய் அடியேற்கு\nஊர் ஆகத் தந்தருளும் உத்தரகோசமங்கை\nஆரா அமுதின் அருள் தாள் இணை பாடி,\nபோர் ஆர் வேல் கண் மடவிர! பொன் ஊசல் ஆடாமோ.", "மூன்று, அங்கு, இலங்கு நயனத்தன், மூவாத\nவான் தங்கு தேவர்களும், காணா மலர் அடிகள்,\nதேன் தங்கி, தித்தித்து, அமுது ஊறி, தான் தெளிந்து, அங்கு,\nஊன் தங்கிநின்று, உருக்கும் உத்தரகோசமங்கைக்\nகோன் தங்கு இடைமருது பாடி, குல மஞ்ஞை\nபோன்று, அங்கு, அன நடையீர்! பொன் ஊசல் ஆடாமோ.", "முன், ஈறும், ஆதியும் இல்லான்; முனிவர் குழாம்,\nபல் நூறு கோடி இமையோர்கள், தாம் நிற்ப,\nதன் நீறு எனக்கு அருளி, தன் கருணை வெள்ளத்து\nமன் ஊற, மன்னும் மணி உத்தரகோசமங்கை\nமின் ஏறும் மாட வியல் மாளிகை பாடி,\nபொன் ஏறு பூண் முலையீர்! பொன் ஊசல் ஆடாமோ.", "நஞ்சு அமர் கண்டத்தன்; அண்டத்தவர் நாதன்;\nமஞ்சு தோய் மாட, மணி உத்தரகோசமங்கை\nஅம் சொலாள் தன்னோடும் கூடி, அடியவர்கள்\nநெஞ்சுளே நின்று, அமுதம் ஊறி, கருணை செய்து,\nதுஞ்சல், பிறப்பு அறுப்பான்; தூய புகழ் பாடி,\nபுஞ்சம் ஆர் வெள் வளையீர்! பொன் ஊசல் ஆடாமோ.", "ஆணோ, அலியோ, அரிவையோ, என்று இருவர்\nகாணாக் கடவுள்; கருணையினால், தேவர் குழாம்\nநாணாமே உய்ய, ஆட்கொண்டருளி, நஞ்சு தனை\nஊண் ஆக உண்டருளும் உத்தரகோசமங்கைக்\nகோண் ஆர் பிறைச் சென்னிக் கூத்தன்; குணம் பரவி,\nபூண் ஆர் வன முலையீர்! பொன் ஊசல் ஆடாமோ.", "மாது ஆடு பாகத்தன்; உத்தரகோசமங்கைத்\nதாது ஆடு கொன்றைச் சடையான்; அடியாருள்\nகோதாட்டி நாயேனை ஆட்கொண்டு, என் தொல் பிறவித்\nதீது ஓடாவண்ணம் திகழ, பிறப்பு அறுப்பான்;\nகாது ஆடு குண்டலங்கள் பாடி, கசிந்து அன்பால்,\nபோது ஆடு பூண் முலையீர் பொன் ஊசல் ஆடாமோ.", "உன்னற்கு அரிய திரு உத்தரகோசமங்கை\nமன்னிப் பொலிந்து இருந்த, மா மறையோன் தன் புகழே\nபன்னிப் பணிந்து இறைஞ்ச, பாவங்கள் பற்று அறுப்பான்;\nஅன்னத்தின் மேல் ஏறி ஆடும் அணி மயில் போல்\nஎன் அத்தன்; என்னையும் ஆட்கொண்டான்; எழில் பாடி,\nபொன் ஒத்த பூண் முலையீர்! பொன் ஊசல் ஆடாமோ.", "கோல வரைக் குடுமி வந்து, குவலயத்துச்\nசால அமுது உண்டு, தாழ் கடலின் மீது எழுந்து,\nஞாலம் மிக, பரி மேற்கொண்டு, நமை ஆண்டான்;\nசீலம் திகழும் திரு உத்தரகோசமங்கை,\nமாலுக்கு அரியானை வாய் ஆர நாம் பாடி,\nபூலித்து, அகம் குழைந்து பொன் ஊசல் ஆடாமோ.", "தெங்கு உலவு சோலைத் திரு உத்தரகோசமங்கை\nதங்கு, உலவு சோதித் தனி உருவம் வந்தருளி,\nஎங்கள் பிறப்பு அறுத்திட்டு, எம் தரமும் ஆட்கொள்வான்:\nபங்கு உலவு கோதையும், தானும், பணி கொண்ட\nகொங்கு உலவு கொன்றைச் சடையான் குணம் பரவி,\nபொங்கு உலவு பூண் முலையீர்! பொன் ஊசல் ஆடாமோ."]], ["அன்னைப் பத்து", ["வேத மொழியர், வெள் நீற்றர், செம் மேனியர்,\nநாதப் பறையினர்; அன்னே! என்னும்,\nநாதப் பறையினர் நான்முகன், மாலுக்கும்,\nநாதர், இந் நாதனார்; அன்னே! என்னும்.", "கண் அஞ்சனத்தர், கருணைக் கடலினர்,\nஉள் நின்று உருக்குவர்; அன்னே! என்னும்,\nஉள் நின்று உருக்கி, உலப்பு இலா ஆனந்தக்\nகண்ணீர் தருவரால்; அன்னே! என்னும்.", "நித்த மணாளர், நிரம்ப அழகியர்,\nசித்தத்து இருப்பரால்; அன்னே! என்னும்.\nசித்தத்து இருப்பவர் தென்னன் பெருந்துறை\nஅத்தர், ஆனந்தரால்; அன்னே! என்னும்.", "ஆடு அரப் பூண், உடைத் தோல், பொடிப் பூசிற்று ஓர்\nவேடம் இருந்த ஆறு; அன்னே! என்னும்.\nவேடம் இருந்தவா, கண்டு கண்டு, என் உள்ளம்\nவாடும்; இது என்னே! அன்னே! என்னும்.", "நீண்ட கரத்தர், நெறிதரு குஞ்சியர்,\nபாண்டி நல் நாடரால்; அன்னே! என்னும்.\nபாண்டி நல் நாடர் பரந்து எழு சிந்தையை\nஆண்டு அன்பு செய்வரால்; அன்னே! என்னும்.", "உன்னற்கு அரிய சீர் உத்தரமங்கையர்\nமன்னுவது என் நெஞ்சில்; அன்னே! என்னும்.\nமன்னுவது என் நெஞ்சில்; மால், அயன், காண்கிலார்;\nஎன்ன அதிசயம்! அன்னே! என்னும்.", "வெள்ளைக் கலிங்கத்தர், வெண் திருமுண்டத்தர்\nபள்ளிக் குப்பாயத்தர்; அன்னே! என்னும்.\nபள்ளிக் குப்பாயத்தர் பாய் பரி மேற்கொண்டு, என்\nஉள்ளம் கவர்வரால்; அன்னே! என்னும்.", "தாளி அறுகினர், சந்தனச் சாந்தினர்,\nஆள் எம்மை ஆள்வரால்; அன்னே! என்னும்.", "ஆள் எம்மை ஆளும் அடிகளார் தம் கையில்,\nதாளம் இருந்த ஆறு; அன்னே! என்னும்.", "தையல் ஓர் பங்கினர், தாபத வேடத்தர்,\nஐயம் புகுவரால்; அன்னே! என்னும்.\nஐயம் புகுந்து அவர் போதலும், என் உள்ளம்\nநையும்; இது என்னே! அன்னே! என்னும்.", "கொன்றை, மதியமும், கூவிளம், மத்தமும்,\nதுன்றிய சென்னியர்; அன்னே! என்னும்.\nதுன்றிய சென்னியின் மத்தம் உன்மத்தமே,\nஇன்று, எனக்கு ஆன ஆறு; அன்னே! என்னும்."]], ["குயில் பத்து", ["கீதம் இனிய குயிலே! கேட்டியேல், எங்கள் பெருமான்\nபாதம் இரண்டும் வினவின், பாதாளம் ஏழினுக்கு அப்பால்;\nசோதி மணி முடி சொல்லின், சொல் இறந்து நின்ற தொன்மை\nஆதி குணம் ஒன்றும் இல்லான்; அந்தம் இலான்; வரக் கூவாய்!", "ஏர் தரும் ஏழ் உலகு ஏத்த, எவ் உருவும் தன் உர ஆய்,\nஆர்கலி சூழ் தென் இலங்கை, அழகு அமர் வண்டோதரிக்கு,\nபேர் அருள் இன்பம் அளித்த பெருந்துறை மேய பிரானை;\nசீரிய வாயால், குயிலே! தென் பாண்டி நாடனை; கூவாய்!", "நீல உருவின் குயிலே! நீள் மணி மாடம் நிலாவும்\nகோல அழகின் திகழும் கொடி மங்கை உள்ளுறை கோயில்,\nசீலம் பெரிதும் இனிய திரு உத்தரகோசமங்கை,\nஞாலம் விளங்க இருந்த நாயகனை, வரக் கூவாய்!", "தேன் பழச் சோலை பயிலும் சிறு குயிலே! இது கேள் நீ,\nவான் பழித்து, இம் மண் புகுந்து மனிதரை ஆட்கொண்ட வள்ளல்;\nஊன் பழித்து, உள்ளம் புகுந்து, என் உணர்வு அது ஆய ஒருத்தன்;", "மான் பழித்து ஆண்ட மென் நோக்கி மணாளனை; நீ வரக் கூவாய்!", "சுந்தரத்து இன்பக் குயிலே! சூழ் சுடர் ஞாயிறு போல,\nஅந்தரத்தே நின்று இழிந்து, இங்கு, அடியவர் ஆசை அறுப்பான்;\nமுந்தும், நடுவும், முடிவும், ஆகிய மூவர் அறியாச்\nசிந்துச் சேவடியானை; சேவகனை; வரக் கூவாய்!", "இன்பம் தருவன்; குயிலே! ஏழ் உலகும் முழுது ஆளி;\nஅன்பன்; அமுது அளித்து ஊறும் ஆனந்தன்; வான் வந்த தேவன்;\nநன் பொன் மணிச் சுவடு ஒத்த நல் பரிமேல் வருவானை;\nகொம்பின் மிழற்றும் குயிலே! கோகழி நாதனை; கூவாய்!", "உன்னை உகப்பன்; குயிலே! உன் துணைத் தோழியும் ஆவன்,\nபொன்னை அழித்த நல் மேனிப் புகழின் திகழும் அழகன்,\nமன்னன், பரிமிசை வந்த வள்ளல், பெருந்துறை மேய\nதென்னவன், சேரலன், சோழன், சீர்ப் புயங்கன், வரக் கூவாய்!", "வா, இங்கே, நீ, குயில் பிள்ளாய்! மாலொடு நான்முகன் தேடி,\nஓவி, அவர் உன்னிநிற்ப, ஒண் தழல் விண் பிளந்து ஓங்கி,\nமேவி, அன்று, அண்டம் கடந்து, விரி சுடர் ஆய், நின்ற மெய்யன்;\nதாவி வரும் பரிப் பாகன்; தாழ் சடையோன்; வரக் கூவாய்!", "கார் உடைப் பொன் திகழ் மேனி, கடி பொழில் வாழும், குயிலே!\nசீர் உடைச் செம் கமலத்தில் திகழ் ௨௬ ஆகிய செல்வன்;\nபாரிடைப் பாதங்கள் காட்டி, பாசம் அறுத்து எனை ஆண்ட\nஆர் உடை அம் பொனின் மேனி அமுதினை; நீ, வரக் கூவாய்!", "கொந்து அணவும் பொழில் சோலைக் கூம் குயிலே! இது கேள் நீ;\nஅந்தணன் ஆகி வந்து, இங்கே, அழகிய சேவடி காட்டி,\nஎம் தமர் ஆம் இவன்' என்று இங்கு என்னையும்\nஆட்கொண்டருளும்,\nசெம் தழல் போல் திருமேனித் தேவர் பிரான், வரக் கூவாய்!"]], ["திருத்தசாங்கம்", ["ஏர் ஆர் இளம் கிளியே! எங்கள் பெருந்துறைக் கோன்\nசீர் ஆர் திரு நாமம் தேர்ந்து உரையாய் ஆரூரன்,\nசெம் பெருமான், வெள் மலரான், பால் கடலான், செப்புவ போல்,\nஎம் பெருமான், தேவர் பிரான், என்று.", "ஏதம் இலா இன் சொல் மரகதமே! ஏழ் பொழிற்கும்\nநாதன், நமை ஆளுடையான், நாடு உரையாய் காதலர்க்கு\nஅன்பு ஆண்டு, மீளா அருள் புரிவான் நாடு, என்றும்,\nதென் பாண்டி நாடே, தெளி.", "தாது ஆடு பூஞ்சோலைத் தத்தாய்! நமை ஆளும்\nமாது ஆடும் பாகத்தன் வாழ் பதி என்? கோதாட்டிப்\nபத்தர் எல்லாம் பார்மேல், சிவபுரம்போல், கொண்டாடும்\nஉத்தரகோசமங்கை ஊர்.", "செய்ய வாய்ப் பைம் சிறகின் செல்வி நம் சிந்தை சேர்\nஐயன், பெருந்துறையான், ஆறு உரையாய் தையலாய்!\nவான் வந்த சிந்தை மலம் கழுவ வந்து, இழியும்\nஆனந்தம் காண், உடையான் ஆறு.", "கிஞ்சுக வாய் அம் சுகமே! கேடு இல் பெருந்துறைக் கோன்\nமஞ்சு மருவு மலை பகராய் நெஞ்சத்து\nஇருள் அகல வாள் வீசி, இன்பு அமரும் முத்தி\nஅருளும் மலை என்பது காண், ஆய்ந்து.", "இப் பாடே வந்து, இயம்பு; கூடு புகல் என்? கிளியே!\nஒப்பு ஆடாச் சீர் உடையான் ஊர்வது என்னே? எப்போதும்\nதேன் புரையும் சிந்தையர் ஆய், தெய்வப் பண் ஏத்து இசைப்ப,\nவான் புரவி ஊரும், மகிழ்ந்து.", "கோல் தேன் மொழிக் கிள்ளாய்! கோது இல் பெருந்துறைக் கோன்,\nமாற்றாரை வெல்லும் படை பகராய் ஏற்றார்\nஅழுக்கு அடையா நெஞ்சு உரக, மும் மலங்கள் பாயும்\nகழுக்கடை காண், கைக்கொள் படை.", "இன் பால் மொழிக் கிள்ளாய்! எங்கள் பெருந்துறைக் கோன்\nமுன்பால் முழங்கும் முரசு இயம்பாய் அன்பால்,\nபிறவிப் பகை கலங்க, பேரின்பத்து ஓங்கும்,\nபரு மிக்க நாதப் பறை.", "ஆய மொழிக் கிள்ளாய்! அள்ளூறும் அன்பர்பால்\nமேய பெருந்துறையான் மெய்த் தார் என்? தீய வினை\nநாளும் அணுகாவண்ணம் நாயேனை ஆளுடையான்,\nதாளி அறுகு ஆம், உவந்த தார்.", "சோலைப் பசும் கிளியே! தூ நீர்ப் பெருந்துறைக் கோன்\nகோலம் பொலியும் கொடி கூறாய் சாலவும்\nஏதிலார் துண் என்ன, மேல் விளங்கி, ஏர் காட்டும்\nகோது இலா ஏறு ஆம், கொடி."]], ["திருப்பள்ளி எழுச்சி", ["போற்றி! என் வாழ் முதல் ஆகிய பொருளே! புலர்ந்தது; பூம் கழற்கு\nஇணை துணைமலர் கொண்டு\nஏற்றி, நின் திருமுகத்து எமக்கு அருள் மலரும் எழில் நகை கண்டு,\nநின் திருவடிதொழுகோம்\nசேற்று இதழ்க் கமலங்கள் மலரும் தண் வயல் சூழ்\nதிருப்பெருந்துறை உறைசிவபெருமானே!\nஏற்று உயர் கொடி உடையாய்! எமை உடையாய்! எம்பெருமான்!\nபள்ளி எழுந்தருளாயே!", "அருணன், இந்திரன் திசை அணுகினன்; இருள் போய் அகன்றது;\nஉதயம் நின் மலர்த்திருமுகத்தின்\nகருணையின் சூரியன் எழ எழ, நயனக் கடி மலர் மலர, மற்று\nஅண்ணல் அம்கண் ஆம்\nதிரள் நிரை அறுபதம் முரல்வன; இவை ஓர் திருப்பெருந்துறை\nஉறைசிவபெருமானே!\nஅருள் நிதி தர வரும் ஆனந்த மலையே! அலை கடலே! பள்ளி\nஎழுந்தருளாயே!", "கூவின பூம் குயில்; கூவின கோழி; குருகுகள் இயம்பின; இயம்பின\nசங்கம்;\nஓவின தாரகை ஒளி; ஒளி உதயத்து ஒருப்படுகின்றது விருப்பொடு,\nநமக்கு.\nதேவ! நல் செறி கழல் தாள் இணை காட்டாய்! திருப்பெருந்துறை\nஉறை சிவபெருமானே!\nயாவரும் அறிவு அரியாய்! எமக்கு எளியாய்! எம்பெருமான்! பள்ளி\nஎழுந்தருளாயே!", "இன் இசை வீணையர், யாழினர், ஒருபால்; இருக்கொடு தோத்திரம்\nஇயம்பினர், ஒருபால்;\nதுன்னிய பிணை மலர்க் கையினர், ஒருபால்; தொழுகையர்,\nஅழுகையர்,துவள்கையர், ஒருபால்;\nசென்னியில் அஞ்சலி கூப்பினர், ஒருபால். திருப்பெருந்துறை உறை\nசிவபெருமானே!\nஎன்னையும் ஆண்டுகொண்டு, இன் அருள் புரியும் எம்பெருமான்!\nபள்ளி எழுந்தருளாயே!\nபூதங்கள்தோறும் நின்றாய்! எனின், அல்லால், போக்கு இலன், வரவு", "இலன், என,நினைப் புலவோர்\nகீதங்கள் பாடுதல், ஆடுதல், அல்லால், கேட்டு அறியோம், உனைக்\nகண்டு அறிவாரை.", "சீதம் கொள் வயல் திருப்பெருந்துறை மன்னா! சிந்தனைக்கும்\nஅரியாய்! எங்கள் முன்வந்து,\nஏதங்கள் அறுத்து, எம்மை ஆண்டு, அருள்புரியும் எம்பெருமான்!\nபள்ளி எழுந்தருளாயே!", "பப்பு அற விட்டு இருந்து உணரும் நின் அடியார், பந்தனை வந்து\nஅறுத்தார்; அவர்பலரும்,\nமைப்பு உறு கண்ணியர், மானிடத்து இயல்பின் வணங்குகின்றார்.\nஅணங்கின் மணவாளா!\nசெப்பு உறு கமலங்கள் மலரும் தண் வயல் சூழ் திருப்பெருந்துறை\nஉறைசிவபெருமானே!\nஇப் பிறப்பு அறுத்து, எமை ஆண்டு, அருள்புரியும் எம்பெருமான்!\nபள்ளி எழுந்தருளாயே!", "அது, பழச் சுவை என, அமுது என; அறிதற்கு அரிது என, எளிது என;\nஅமரரும் அறியார்.\nஇது அவன் திருஉ௬; இவன், அவன்; எனவே எங்களை\nஆண்டுகொண்டு, இங்கு எழுந்தருளும்,\nமது வளர் பொழில் திரு உத்தரகோச மங்கை உள்ளாய்!\nதிருப்பெருந்துறை மன்னா!\nஎது எமைப் பணி கொளும் ஆறு? அது கேட்போம்: எம்பெருமான்!\nபள்ளி எழுந்தருளாயே!", "முந்திய முதல், நடு, இறுதியும், ஆனாய்; மூவரும் அறிகிலர்; யாவர்\nமற்றுஅறிவார்?\nபந்து அணை விரலியும், நீயும், நின் அடியார் பழம் குடில்தொறும்\nஎழுந்தருளியபரனே!\nசெம் தழல் புரை திருமேனியும் காட்டி, திருப்பெருந்துறை உறை\nகோயிலும் காட்டி,\nஅந்தணன் ஆவதும் காட்டி, வந்து ஆண்டாய்! ஆர் அமுதே! பள்ளி\nஎழுந்தருளாயே!", "விண்ணகத் தேவரும் நண்ணவும் மாட்டா விழுப் பொருளே! உன\nதொழுப்பு அடியோங்கள்,\nமண்ணகத்தே வந்து, வாழச் செய்தானே! வண்\nதிருப்பெருந்துறையாய்! வழி அடியோம்\nகண் அகத்தே நின்று, களிதரு தேனே! கடல் அமுதே! கரும்பே!\nவிரும்பு அடியார்\nஎண் அகத்தாய்! உலகுக்கு உயிர் ஆனாய்! எம்பெருமான்! பள்ளி\nஎழுந்தருளாயே!", "புவனியில் போய்ப் பிறவாமையின், நாள் நாம் போக்குகின்றோம்\nஅவமே; இந்தப் பூமி,\nசிவன் உய்யக் கொள்கின்ற ஆறு' என்று நோக்கி, திருப்பெருந்துறை\nஉறைவாய்! திருமால் ஆம்\nஅவன் விருப்பு எய்தவும், அலரவன் ஆசைப் படவும், நின் அலர்ந்த\nமெய்க்கருணையும், நீயும்,\nஅவனியில் புகுந்து எமை ஆட்கொள்ள வல்லாய்! ஆர் அமுதே!\nபள்ளி எழுந்தருளாயே!"]], ["கோயில் மூத்த திருப்பதிகம்", ["உடையாள், உன் தன் நடுவு, இருக்கும்; உடையாள் நடுவுள், நீ\nஇருத்தி;\nஅடியேன் நடுவுள், இருவீரும் இருப்பதானால், அடியேன், உன்\nஅடியார் நடுவுள் இருக்கும் அருளைப் புரியாய் பொன்னம்பலத்து\nஎம்\nமுடியா முதலே! என் கருத்து முடியும்வண்ணம், முன் நின்றே!", "முன் நின்று ஆண்டாய், எனை முன்னம்; யானும், அதுவே முயல்வு\nஉற்று,\nபின் நின்று, ஏவல் செய்கின்றேன்; பிற்பட்டு ஒழிந்தேன்; பெம்மானே!\nஎன்?' என்று, அருள் இவர நின்று, போந்திடு என்னாவிடில், அடியார்,\nஉன் நின்று, இவன் ஆர்' என்னாரோ? பொன்னம்பலக் கூத்து\nஉகந்தானே!", "உகந்தானே! அன்பு உடை அடிமைக்கு; உருகா உள்ளத்து உணர்வு\nஇலியேன்,\nசகம் தான் அறிய முறையிட்டால், தக்க ஆறு அன்று என்னாரோ?\nமகம் தான் செய்து வழி வந்தார் வாழ, வாழ்ந்தாய்; அடியேற்கு உன்\nமுகம் தான் தாராவிடின், முடிவேன்; பொன்னம்பலத்து எம் முழு\nமுதலே!", "முழு முதலே! ஐம் புலனுக்கும், மூவர்க்கும், என் தனக்கும்,\nவழி முதலே! நின் பழ அடியார் திரள், வான், குழுமிக்\nகெழு முதலே! அருள் தந்து இருக்க இரங்கும் கொல்லோ? என்று\nஅழும் அதுவே அன்றி, மற்று என் செய்கேன்? பொன்னம்பலத்து\nஅரைசே!", "அரைசே! பொன்னம்பலத்து ஆடும் அமுதே! என்று உன் அருள்\nநோக்கி,\nஇரை தேர் கொக்கு ஒத்து, இரவு பகல், ஏசற்று இருந்தே, வேசற்றேன்;\nகரை சேர் அடியார் களி சிறப்ப, காட்சி கொடுத்து, உன்\nஅடியேன்பால்,\nபிரை சேர் பாலின் நெய் போல, பேசாது இருந்தால், ஏசாரோ?", "ஏசா நிற்பர், என்னை; உனக்கு அடியான் என்று, பிறர் எல்லாம்\nபேசா நிற்பர்; யான் தானும் பேணா நிற்பேன், நின் அருளே;\nதேசா! நேசர் தழ்ந்து இருக்கும் திருவோலக்கம் சேவிக்க,\nஈசா! பொன்னம்பலத்து ஆடும் எந்தாய்! இனித்தான் இரங்காயே!", "இரங்கும் நமக்கு அம்பலக் கூத்தன்' என்று என்று,\nமொந்திருப்பனை,\nஅரும் கற்பனை கற்பித்து, ஆண்டாய்; ஆள்வார் இலி மாடு\nஆவேனோ?\nநெருங்கும் அடியார்களும், நீயும், நின்று, நிலாவி, விளையாடும்\nமருங்கே சார்ந்து, வர, எங்கள் வாழ்வே, வா என்று அருளாயே!", "அருளாது ஒழிந்தால், அடியேனை, அஞ்சேல்' என்பார் ஆர், இங்கு?\nபொருளா, என்னைப் புகுந்து ஆண்ட பொன்னே! பொன்னம்பலக்\nகூத்தா!\nமருள் ஆர் மனத்தோடு, உனைப் பிரிந்து, வருந்துவேனை, வா' என்று,\nஉன்\nதெருள் ஆர் கூட்டம் காட்டாயேல், செத்தே போனால், சிரியாரோ?", "சிரிப்பார்; களிப்பார்; தேனிப்பார்; திரண்டு, திரண்டு, உன் திருவார்த்தை\nவிரிப்பார்; கேட்பார்; மெச்சுவார்; வெவ்வேறு இருந்து, உன் திருநாமம்\nதரிப்பார் பொன்னம்பலத்து ஆடும் தலைவா என்பார்; அவர் முன்னே\nநரிப்பு ஆய், நாயேன் இருப்பேனோ? நம்பி! இனித்தான் நல்காயே!", "நல்காது ஒழியான் நமக்கு' என்று, உன் நாமாம் பிதற்றி, நயன நீர்\nமல்கா, வாழ்த்தா, வாய் குழறா, வணங்கா, மனத்தால் நினைந்து\nஉருகி,\nபல்கால் உன்னைப் பாவித்து, பரவி, பொன்னம்பலம்' என்றே\nஒல்கா நிற்கும் உயிர்க்கு இரங்கி, அருளாய்! என்னை உடையானே!"]], ["கோயில் திருப்பதிகம்", ["மாறி நின்று, என்னை மயக்கிடும் வஞ்சப் புலன் ஐந்தின் வழி\nஅடைத்து; அமுதே\nஊறி நின்று; என் உள் எழு பரஞ்சோதி! உள்ளவா காண\nவந்தருளாய்:\nதேறலின் தெளிவே! சிவபெருமானே! திருப்பெருந்துறை உறை\nசிவனே!", "ஈறு இலாப் பதங்கள் யாவையும் கடந்த இன்பமே! என்னுடை\nஅன்பே!", "அன்பினால், அடியேன் ஆவியோடு, ஆக்கை, ஆனந்தமாய்க் கசிந்து\nஉரக,\nஎன் பரம் அல்லா, இன் அருள் தந்தாய்; யான், இதற்கு இலன் ஒர்\nகைம்மாறு:\nமுன்பும் ஆய், பின்பும், முழுதும், ஆய், பரந்த முத்தனே! முடிவு இலா\nமுதலே!\nதென் பெருந்துறையாய்! சிவபெருமானே! சீர் உடைச் சிவபுரத்து\nஅரசே!", "அரைசனே! அன்பர்க்கு; அடியனேன் உடைய அப்பனே! ஆவியோடு\nஆக்கை\nபுரை புரை கனியப் புகுந்துநின்று, உருக்கி, பொய் இருள் கடிந்த\nமெய்ச் சுடரே!\nதிரை பொரா மன்னும், அமுதத் தெண் கடலே! திருப்பெருந்துறை\nஉறை சிவனே!\nஉரை, உணர்வு, இறந்துநின்று, உணர்வது ஓர் உணர்வே! யான்,\nஉன்னை உரைக்கும் ஆறு,உணர்த்தே.", "உணர்ந்த மா முனிவர், உம்பரோடு, ஒழிந்தார் உணர்வுக்கும், தெரிவு\nஅரும் பொருளே!\nஇணங்கு இலி! எல்லா உயிர்கட்கும் உயிரே! எனைப் பிறப்பு\nஅறுக்கும் எம் மருந்தே!\nதிணிந்தது ஓர் இருளில், தெளிந்த தூ ஒளியே! திருப்பெருந்துறை\nஉறை சிவனே!\nகுணங்கள் தாம் இல்லா இன்பமே! உன்னைக் குறுகினேற்கு இனி\nஎன்ன குறையே?", "குறைவு இலா நிறைவே! கோது இலா அமுதே! ஈறு இலாக்\nகொழும் சுடர்க் குன்றே!\nமறையும் ஆய், மறையின் பொருளும் ஆய், வந்து என் மனத்திடை\nமன்னிய மன்னே!\nசிறை பெறா நீர் போல், சிந்தைவாய்ப் பாயும் திருப்பெருந்துறை\nஉறை சிவனே!\nஇறைவனே! நீ, என் உடல் இடம் கொண்டாய்; இனி, உன்னை என்\nஇரக்கேனே?", "இரந்து இரந்து உ௬க, என் மனத்துள்ளே எழுகின்ற சோதியே!\nஇமையோர்\nசிரம் தனில் பொலியும் கமலச் சேவடியாய்! திருப்பெருந்துறை\nஉறை சிவனே!\nநிரந்த ஆகாயம், நீர், நிலம், தீ, கால், ஆய், அவை அல்லை ஆய்,\nஆங்கே,\nகரந்தது ஓர் உருவே! களித்தனன், உன்னைக் கண் உறக்\nகண்டுகொண்டு, இன்றே.", "இன்று, எனக்கு அருளி, இருள் கடிந்து, உள்ளத்து எழுகின்ற ஞாயிறே\nபோன்று\nநின்ற நின் தன்மை நினைப்பு அற நினைந்தேன்; நீ அலால் பிறிது\nமற்று இன்மை;\nசென்று சென்று, அணுவாய்த் தேய்ந்து தேய்ந்து, ஒன்று ஆம்\nதிருப்பெருந்துறை உறை சிவனே!\nஒன்றும் நீ அல்லை; அன்றி, ஒன்று இல்லை; யார் உன்னை\nஅறியகிற்பாரே?", "பார், பதம், அண்டம், அனைத்தும், ஆய், முளைத்துப் படர்ந்தது ஓர்\nபடர் ஒளிப்பரப்பே!\nநீர் உறு தீயே நினைவதேல், அரிய நின்மலா! நின் அருள் வெள்ளச்\nசீர் உறு, சிந்தை எழுந்தது ஓர் தேனே! திருப்பெருந்துறை உறை\nசிவனே!\nஆர் உறவு எனக்கு, இங்கு? யார் அயல் உள்ளார்? ஆனந்தம் ஆக்கும்\nஎன் சோதி!", "சோதியாய்த் தோன்றும் உருவமே! அரு ஆம் ஒருவனே!\nசொல்லுதற்கு அரிய\nஆதியே! நடுவே! அந்தமே! பந்தம் அறுக்கும் ஆனந்த மா கடலே!\nதீது இலா நன்மைத் திருவருள் குன்றே! திருப்பெருந்துறை உறை\nசிவனே!\nயாது நீ போவது ஓர் வகை? எனக்கு அருளாய் வந்து நின் இணை\nஅடி தந்தே.", "தந்தது, உன் தன்னை; கொண்டது, என் தன்னை; சங்கரா! ஆர்\nகொலோ, சதுரர்?\nஅந்தம் ஒன்று இல்லா ஆனந்தம் பெற்றேன்; யாது நீ பெற்றது\nஒன்று, என்பால்?\nசிந்தையே கோயில் கொண்ட எம்பெருமான்! திருப்பெருந்துறை\nஉறை சிவனே!\nஎந்தையே! ஈசா! உடல் இடம் கொண்டாய்; யான் இதற்கு இலன், ஓர்\nகைம்மாறே!"]], ["செத்திலாப் பத்து", ["பொய்யனேன் அகம் நெகப் புகுந்து, அமுது ஊறும், புது மலர்க் கழல்\nஇணை அமடிபிரிந்தும்,\nகையனேன், இன்னும் செத்திலேன்; அந்தோ! விழித்திருந்து உள்ளக்\nகருத்தினை இழந்தேன்.\nஐயனே! அரசே! அருள் பெரும் கடலே! அத்தனே! அயன், மாற்கு,\nஅறி ஒண்ணாச்\nசெய்ய மேனியனே! செய்வகை அறியேன்; திருப்பெருந்துறை\nமேவிய சிவனே!", "புற்றும் ஆய், மரம் ஆய்; புனல், காலே, உண்டி, ஆய்; அண்ட\nவாணரும், பிறரும்,\nமற்று யாரும், நின் மலர் அடி காணா மன்ன! என்னை ஓர்\nவார்த்தையுள் படுத்து,\nபற்றினாய்; பதையேன்; மனம் மிக உருகேன்; பரிகிலேன்; பரியா\nஉடல் தன்னைச்\nசெற்றிலேன்; இன்னும் திரிதருகின்றேன்; திருப்பெருந்துறை மேவிய\nசிவனே!", "புலையனேனையும், பொருள் என நினைந்து, உன் அருள் புரிந்தனை;\nபுரிதலும்,களித்துத்\nதலையினால் நடந்தேன்; விடைப் பாகா! சங்கரா! எண் இல்\nவானவர்க்கு எல்லாம்\nநிலையனே! அலை நீர் விடம் உண்ட நித்தனே! அடையார் புரம்\nஎரித்த\nசிலையனே! எனைச் செத்திடப் பணியாய்; திருப்பெருந்துறை\nமேவிய சிவனே!", "அன்பர் ஆகி, மற்று, அரும் தவம் முயல்வார், அயனும், மாலும்;\nமற்று, அழல் உறுமெழுகு ஆம்\nஎன்பர் ஆய், நினைவார் எனைப் பலர்; நிற்க இங்கு, எனை,\nஎற்றினுக்கு ஆண்டாய்?\nவன் பராய் முருடு ஒக்கும் என் சிந்தை; மரக் கண்; என் செவி\nஇரும்பினும் வலிது;\nதென் பராய்த்துறையாய்! சிவலோகா! திருப்பெருந்துறை மேவிய\nசிவனே!", "ஆட்டுத் தேவர் தம் விதி ஒழித்து, அன்பால், ஐயனே' என்று, உன்\nஅருள் வழி இருப்பேன்;", "நாட்டுத் தேவரும் நாடு அரும் பொருளே! நாதனே! உனைப் பிரிவு\nஉறா அருளைக்\nகாட்டி, தேவ, நின் கழல் இணை காட்டி, காய மாயத்தைக் கழித்து,\nஅருள்செய்யாய்;\nசேட்டைத் தேவர் தம் தேவர் பிரானே! திருப்பெருந்துறை மேவிய\nசிவனே!", "அறுக்கிலேன் உடல் துணிபட; தீப் புக்கு ஆர்கிலேன்; திருவருள்\nவகை அறியேன்;\nபொறுக்கிலேன் உடல்; போக்கு இடம் காணேன்; போற்றி! போற்றி!\nஎன் போர் விடைப் பாகா!\nஇறக்கிலேன் உனைப் பிரிந்து; இனிது இருக்க, என் செய்கேன்? இது\nசெய்க' என்றுஅருளாய்;\nசிறைக்கணே புனல் நிலவிய வயல் சூழ் திருப்பெருந்துறை மேவிய\nசிவனே!", "மாயனே! மறி கடல் விடம் உண்ட வானவா! மணி கண்டத்து எம்\nஅமுதே!\nநாயினேன், உனை நினையவும் மாட்டேன்; நமச்சிவாய என்று, உன்\nஅடி பணியாப்\nபேயன் ஆகிலும், பெரு நெறி காட்டாய்; பிறை குலாம் சடைப்\nபிஞ்ஞாுகனே! ஓ!\nசேயன் ஆகி நின்று, அலறுவது அழகோ? திருப்பெருந்துறை மேவிய\nசிவனே!", "போது சேர் அயன், பொரு கடல் கிடந்தோன், புரந்தர ஆதிகள், நிற்க,\nமற்றுஎன்னைக்\nகோது மாட்டி, நின் குரை கழல் காட்டி, குறிக்கொள்க' என்று, நின்\nதொண்டரில்கூட்டாய்;\nயாது செய்வது, என்று இருந்தனன்; மருந்தே! அடியனேன்\nஇடர்ப்படுவதும் இனிதோ?", "சீத வார் புனல் நிலவிய வயல் சூழ் திருப்பெருந்துறை மேவிய\nசிவனே!", "ஞாலம், இந்திரன், நான்முகன், வானோர், நிற்க, மற்று எனை நயந்து,\nஇனிது ஆண்டாய்;\nகாலன் ஆர் உயிர் கொண்ட பூம் கழலாய்! கங்கையாய்! அங்கி\nதங்கிய கையாய்!\nமாலும் ஓலம் இட்டு அலறும் அம் மலர்க்கே, மரக்கணேனையும்\nவந்திடப் பணியாய்;\nசேலும், நீலமும், நிலவிய வயல் சூழ் திருப்பெருந்துறை மேவிய\nசிவனே!", "அளித்து வந்து, எனக்கு ஆவ' என்று அருளி, அச்சம் தீர்த்த நின்\nஅருள் பெருங்கடலில்,\nதிளைத்தும், தேக்கியும், பருகியும், உருகேன்; திருப்பெருந்துறை\nமேவிய சிவனே!\nவளைக் கையானொடு மலரவன் அறியா வானவா! மலை மாது\nஒரு பாகா!\nகளிப்பு எலாம் மிகக் கலங்கிடுகின்றேன்; கயிலை மா மலை\nமேவிய கடலே!"]], ["அடைக்கலப் பத்து", ["செழுக் கமலத் திரள் அன, நின் சேவடி சேர்ந்து அமைந்த\nபழுத்த மனத்து அடியர் உடன் போயினர்; யான், பாவியேன்;\nபுழுக்கண் உடைப் புன் குரம்பை, பொல்லா, கல்வி ஞானம் இலா,\nஅழுக்கு மனத்து அடியேன்; உடையாய்! உன் அடைக்கலமே.", "வெறுப்பனவே செய்யும் என் சிறுமையை, நின் பெருமையினால்\nபொறுப்பவனே! அராப் பூண்பவனே! பொங்கு கங்கை சடைச்\nசெறுப்பவனே! நின் திருவருளால், என் பிறவியை வேர்\nஅறுப்பவனே! உடையாய்! அடியேன் உன் அடைக்கலமே.", "பெரும் பெருமான், என் பிறவியை வேர் அறுத்து, பெரும் பிச்சுத்\nதரும் பெருமான், சதுரப் பெருமான், என் மனத்தின் உள்ளே\nவரும் பெருமான், மலரோன், நெடுமால், அறியாமல் நின்ற\nஅரும் பெருமான்! உடையாய்! அடியேன் உன் அடைக்கலமே.", "பொழிகின்ற துன்பப் புயல் வெள்ளத்தில், நின் கழல் புணை\nகொண்டு,\nஇழிகின்ற அன்பர்கள் ஏறினர், வான்; யான், இடர்க் கடல்வாய்ச்\nசுழி சென்று, மாதர்த் திரை பொர, காமச் சுறவு எறிய,\nஅழிகின்றனன்; உடையாய்! அடியேன் உன் அடைக்கலமே.", "சுருள் புரி கூழையர் சூழலில் பட்டு, உன் திறம் மறந்து, இங்கு,\nஇருள் புரி யாக்கையிலே கிடந்து, எய்த்தனன்; மைத் தடம் கண்\nவெருள் புரி மான் அன்ன நோக்கி தன் பங்க, விண்ணோர்\nபெருமான்,\nஅருள் புரியாய்; உடையாய்! அடியேன் உன் அடைக்கலமே.", "மாழை, மைப் பாவிய கண்ணியர் வன் மத்து இட, உடைந்து,\nதாழியைப் பாவு தயிர் போல், தளர்ந்தேன்; தட மலர்த் தாள்,\nவாழி! எப்போது வந்து, எந் நாள், வணங்குவன் வல் வினையேன்?\nஆழி அப்பா! உடையாய்! அடியேன் உன் அடைக்கலமே.", "மின் கணினார், நுடங்கும் இடையார், வெகுளி வலையில் அகப்பட்டு,\nபுன் கணன் ஆய், புரள்வேனை, புரளாமல், புகுந்து அருளி,\nஎன்கணிலே அமுது ஊறி, தித்தித்து, என் பிழைக்கு இரங்கும்\nஅம் கணனே! உடையாய்! அடியேன் உன் அடைக்கலமே.", "மா வடு வகிர் அன்ன கண்ணி பங்கா! நின் மலர் அடிக்கே\nகூவிடுவாய்? கும்பிக்கே இடுவாய்? நின் குறிப்பு அறியேன்;\nபா இடை ஆடு குழல் போல், கரந்து, பரந்தது, உள்ளம்.\nஆ! கெடுவேன்; உடையாய்! அடியேன் உன் அடைக்கலமே.", "பிறிவு அறியா அன்பர், நின் அருள் பெய் கழல் தாள் இணைக் கீழ்,\nமறிவு அறியாச் செல்வம் வந்து பெற்றார்; உன்னை வந்திப்பது ஓர்\nநெறி அறியேன்; நின்னையே அறியேன்; நின்னையே அறியும்\nஅறிவு அறியேன்; உடையாய்! அடியேன் உன் அடைக்கலமே.", "வழங்குகின்றாய்க்கு உன் அருள் ஆர் அமுதத்தை வாரிக்கொண்டு,\nவிழுங்குகின்றேன்; விக்கினேன் வினையேன், என் விதி\nஇன்மையால்;\nதழங்கு அரும் தேன் அன்ன தண்ணீர் பருகத் தந்து, உய்யக்\nகொள்ளாய்;\nஅழுங்குகின்றேன்; உடையாய்! அடியேன் உன் அடைக்கலமே."]], ["ஆசைப் பத்து", ["கருளக் கொடியோன் காணமாட்டாக் கழல் சேவடி என்னும்\nபொருளைத் தந்து, இங்கு, என்னை ஆண்ட பொல்லா மணியே! ஓ!\nஇருளைத் துரந்திட்டு, இங்கே வா என்று, அங்கே, கூவும்\nஅருளைப் பெறுவான், ஆசைப்பட்டேன் கண்டாய்; அம்மானே!", "மொய்ப்பால் நரம்பு கயிறு ஆக, மூளை, என்பு, தோல், போர்த்த\nகுப்பாயம் புக்கு, இருக்ககில்லேன்; கூவிக்கொள்ளாய்; கோவே! ஓ!\nஎப்பாலவர்க்கும் அப்பால் ஆம் என் ஆர் அமுதே! ஓ!\nஅப்பா! காண ஆசைப்பட்டேன் கண்டாய்; அம்மானே!", "சீ வார்ந்து, ஈ மொய்த்து, அழுக்கொடு திரியும் சிறு குடில் இது\nசிதையக்\nகூவாய்; கோவே! கூத்தா! காத்து ஆட்கொள்ளும் குரு மணியே!\nதேவா! தேவர்க்கு அரியானே! சிவனே! சிறிது என் முகம் நோக்கி,\nஆ! ஆ! என்ன, ஆசைப்பட்டேன் கண்டாய்; அம்மானே!", "மிடைந்து எலும்பு, ஊத்தை மிக்கு, அழுக்கு ஊறல், வீறு இலி, நடைக்\nகூடம்\nதொடர்ந்து எனை நலைய, துயர் உறுகின்றேன்; சோத்தம்! எம்\nபெருமானே!\nஉடைந்து, நைந்து, உருகி, உள் ஒளி நோக்கி, உன் திரு மலர்ப் பாதம்\nஅடைந்து நின்றிடுவான், ஆசைப்பட்டேன் கண்டாய்; அம்மானே!", "அளி புண் அகத்து, புறம் தோல் மூடி, அடியேன் உடை யாக்கை,\nபுளியம்பழம் ஒத்து இருந்தேன்; இருந்தும், விடையாய்! பொடி ஆடி!\nஎளிவந்து, என்னை ஆண்டுகொண்ட என் ஆர் அமுதே! ஓ!\nஅளியேன்' என்ன, ஆசைப்பட்டேன் கண்டாய்; அம்மானே!", "எய்த்தேன் நாயேன்; இனி இங்கு இருக்ககில்லேன்; இவ் வாழ்க்கை\nவைத்தாய்; வாங்காய்; வானோர் அறியா மலர்ச் சேவடியானே!\nமுத்தா! உன் தன் முக ஒளி நோக்கி, முறுவல் நகை காண,\nஅத்தா! சால ஆசைப்பட்டேன் கண்டாய்; அம்மானே!", "பாரோர், விண்ணோர், பரவி ஏத்தும் பரனே! பரஞ்சோதி!\nவாராய்; வாரா உலகம் தந்து, வந்து ஆட்கொள்வானே!\nபேர் ஆயிரமும் பரவித் திரிந்து, எம் பெருமான் என ஏத்த,\nஆரா அமுதே! ஆசைப்பட்டேன் கண்டாய்; அம்மானே!", "கையால் தொழுது. உன் கழல் சேவடிகள் கழுமத் தழுவிக்கொண்டு,\nஎய்யாது என் தன் தலை மேல் வைத்து, எம் பெருமான்! பெருமான்!\nஎன்று,\nஐயா! என் தன் வாயால் அரற்றி, அழல் சேர் மெழுகு ஒப்ப,\nஐயாற்று அரசே! ஆசைப்பட்டேன் கண்டாய்; அம்மானே!", "செடி ஆர் ஆக்கைத் திறம் அற வீசி, சிவபுர நகர் புக்கு,\nகடி ஆர் சோதி கண்டுகொண்டு, என் கண் இணை களி கூர,\nபடி தான் இல்லாப் பரம்பரனே! உன் பழ அடியார் கூட்டம்,\nஅடியேன் காண ஆசைப்பட்டேன் கண்டாய்; அம்மானே!", "வெம், சேல் அனைய கண்ணார் தம் வெகுளி வலையில் அகப்பட்டு,\nநைஞ்சேன், நாயேன்; ஞானச் சுடரே! நான் ஓர் துணை காணேன்;\nபஞ்சு ஏர் அடியாள் பாகத்து ஒருவா! பவளத் திருவாயால்,\nஅஞ்சேல்! என்ன, ஆசைப்பட்டேன் கண்டாய்; அம்மானே!"]], ["அதிசயப் பத்து", ["வைப்பு, மாடு, என்று; மாணிக்கத்து ஒளி என்று; மனத்திடை\nஉருகாதே,\nசெப்பு நேர் முலை மடவரலியர்தங்கள் திறத்திடை நைவேனை\nஒப்பு இலாதன, உவமனில் இறந்தன, ஒள் மலர்த் திருப் பாதத்து\nஅப்பன் ஆண்டு, தன் அடியரில் கூட்டிய அதிசயம் கண்டாமே!", "நீதி ஆவன யாவையும் நினைக்கிலேன்; நினைப்பவரொடும் கூடேன்;\nஏதமே பிறந்து, இறந்து, உழல்வேன் தனை என் அடியான்' என்று,\nபாதி மாதொடும் கூடிய பரம்பரன், நிரந்தரமாய் நின்ற\nஆதி ஆண்டு, தன் அடியரில் கூட்டிய அதிசயம் கண்டாமே!", "முன்னை என்னுடை வல் வினை போயிட, முக்கண் அது உடை\nஎந்தை,\nதன்னை யாவரும் அறிவதற்கு அரியவன், எளியவன் அடியார்க்கு,\nபொன்னை வென்றது ஓர் புரி சடை முடி தனில் இள மதி அது\nவைத்த\nஅன்னை, ஆண்டு, தன் அடியரில் கூட்டிய அதிசயம் கண்டாமே!", "பித்தன்' என்று, எனை உலகவர் பகர்வது ஓர் காரணம் இது கேளீர்:\nஒத்துச் சென்று, தன் திருவருள் கூடிடும் உபாயம் அது அறியாமே,\nசெத்துப்போய், அரு நரகிடை வீழ்வதற்கு ஒருப்படுகின்றேனை,\nஅத்தன், ஆண்டு, தன் அடியரில் கூட்டிய அதிசயம் கண்டாமே!", "பரவுவார் அவர் பாடு சென்று அணைகிலேன்; பல் மலர் பறித்து\nஏத்தேன்;\nகுரவு வார் குழலார் திறத்தே நின்று, குடி கெடுகின்றேனை\nஇரவு நின்று, எரி ஆடிய எம் இறை, எரி சடை மிளிர்கின்ற\nஅரவன் ஆண்டு, தன் அடியரில் கூட்டிய அதிசயம் கண்டாமே.", "எண்ணிலேன் திருநாமம் அஞ்சு எழுத்தும்; என் ஏழைமை\nஅதனாலே\nநண்ணிலேன் கலை ஞானிகள் தம்மொடு; நல் வினை நயவாதே,\nமண்ணிலே பிறந்து, இறந்து, மண் ஆவதற்கு ஒருப்படுகின்றேனை,\nஅண்ணல், ஆண்டு, தன் அடியரில் கூட்டிய அதிசயம் கண்டாமே!", "பொத்தை ஊன் சுவர்; புழுப் பொதிந்து, உளுத்து, அசும்பு ஒழுகிய,\nபொய்க் கூரை;\nஇத்தை, மெய் எனக் கருதிநின்று, இடர்க் கடல் சுழித்தலைப்\nபடுவேனை\nமுத்து, மா மணி, மாணிக்க, வயிரத்த, பவளத்தின், முழுச் சோதி,\nஅத்தன் ஆண்டு, தன் அடியரில் கூட்டிய அதிசயம் கண்டாமே!", "நீக்கி, முன் எனைத் தன்னொடு நிலாவகை; குரம்பையில் புகப்\nபெய்து;\nநோக்கி; நுண்ணிய, நொடியன சொல் செய்து; நுகம் இன்றி\nவிளாக்கைத்து;\nதூக்கி; முன் செய்த பொய் அறத் துகள் அறுத்து; எழுதரு சுடர்ச்\nசோதி\nஆக்கி; ஆண்டு; தன் அடியரில் கூட்டிய அதிசயம் கண்டாமே!", "உற்ற ஆக்கையின் உறு பொருள், நறு மலர் எழுதரு நாற்றம் போல்,\nபற்றல் ஆவது ஓர் நிலை இலாப் பரம் பொருள்: அப் பொருள்\nபாராதே,\nபெற்றவா பெற்ற பயன் அது நுகர்ந்திடும் பித்தர் சொல்\nதெளியாமே,\nஅத்தன், ஆண்டு, தன் அடியரில் கூட்டிய அதிசயம் கண்டாமே!", "இருள் திணிந்து எழுந்திட்டது ஓர் வல்வினைச் சிறு குடில், இது:\nஇத்தைப்\nபொருள் எனக் களித்து, அரு நரகத்திடை விழப் புகுகின்றேனை\nதெருளும் மும்மதில், நொடி வரை இடிதர, சினப் பதத்தொடு செம் தீ\nஅருளும் மெய்ந்நெறி பொய்ந்நெறி நீக்கிய அதிசயம் கண்டாமே!"]], ["புணர்ச்சிப் பத்து", ["சுடர் பொன் குன்றை, தோளா முத்தை, வாளா தொழும்பு உகந்து\nகடை பட்டேனை ஆண்டுகொண்ட கருணாலயனை, ௧௬ மால்,\nபிரமன்,\nதடை பட்டு, இன்னும் சாரமாட்டாத் தன்னைத் தந்த என் ஆர்\nஅமுதை,\nபுடை பட்டு இருப்பது என்று கொல்லோ என் பொல்லா மணியைப்\nபுணர்ந்தே?", "ஆற்றகில்லேன் அடியேன்; அரசே! அவனி தலத்து ஐம் புலன் ஆய\nசேற்றில் அழுந்தாச் சிந்தை செய்து, சிவன், எம்பெருமான், என்று\nஏத்தி,\nஊற்று மணல் போல், நெக்கு நெக்கு உள்ளே உருகி, ஓலம் இட்டு,\nபோற்றிப் புகழ்வது என்று கொல்லோ என் பொல்லா மணியைப்\nபுணர்ந்தே?", "நீண்ட மாலும், அயனும், வெருவ நீண்ட நெருப்பை, விருப்பிலெனை\nஆண்டு கொண்ட என் ஆர் அமுதை, அள்ளூறு உள்ளத்து அடியார்\nமுன்\nவேண்டும்தனையும் வாய் விட்டு அலறி, விரை ஆர் மலர் தூவி,\nபூண்டு கிடப்பது என்று கொல்லோ என் பொல்லா மணியைப்\nபுணர்ந்தே?", "அல்லிக் கமலத்து அயனும், மாலும், அல்லாதவரும், அமரர் கோனும்,\nசொல்லிப் பரவும் நாமத்தானை, சொல்லும் பொருளும் இறந்த\nசுடரை,\nநெல்லிக் கனியை, தேனை, பாலை, நிறை இன் அமுதை, அமுதின்\nசுவையை,\nபுல்லிப் புணர்வது என்று கொல்லோ என் பொல்லா மணியைப்\nபுணர்ந்தே?", "திகழத் திகழும் அடியும் முடியும் காண்பான், கீழ் மேல், அயனும்\nமாலும்,\nஅகழப் பறந்தும், காணமாட்டா அம்மான், இம் மா நிலம் முழுதும்\nநிகழப் பணி கொண்டு, என்னை ஆட்கொண்டு, ஆ! ஆ! என்ற நீர்மை\nஎல்லாம்\nபுகழப் பெறுவது என்று கொல்லோ என் பொல்லா மணியைப்\nபுணர்ந்தே?", "பரிந்து வந்து, பரம ஆனந்தம், பண்டே, அடியேற்கு அருள்செய்ய,\nபிரிந்து போந்து, பெரு மா நிலத்தில் அரு மால் உற்றேன், என்று\nஎன்று,\nசொரிந்த கண்ணீர் சொரிய உள் நீர், உரோமம் சிலிர்ப்ப, உகந்து\nஅன்பு ஆய்,\nபுரிந்து நிற்பது என்று கொல்லோ என் பொல்லா மணியைப்\nபுணர்ந்தே?", "நினையப் பிறருக்கு அரிய நெருப்பை, நீரை, காலை, நிலனை,\nவிசும்பை,\nதனை ஒப்பாரை இல்லாத் தனியை, நோக்கி; தழைத்து; தழுத்த\nகண்டம்\nகனைய; கண்ணீர் அருவி பாய; கையும் கூப்பி, கடி மலரால்\nபுனையப் பெறுவது என்று கொல்லோ என் பொல்லா மணியைப்\nபுணர்ந்தே?", "நெக்கு நெக்கு, உள் உருகி உருகி, நின்றும், இருந்தும், கிடந்தும்,\nஎழுந்தும்,\nநக்கும், அழுதும், தொழுதும், வாழ்த்தி; நானா விதத்தால் கூத்து\nநவிற்றி;\nசெக்கர் போலும் திருமேனி திகழ நோக்கி; சிலிர் சிலிர்த்து;\nபுக்கு நிற்பது என்று கொல்லோ என் பொல்லா மணியைப்\nபுணர்ந்தே?", "தாதாய், மூ ஏழ் உலகுக்கும் தாயே, நாயேன் தனை ஆண்ட\nபேதாய், பிறவிப் பிணிக்கு ஓர் மருந்தே, பெரும் தேன் பில்க,\nஎப்போதும்\nஏது ஆம் மணியே! என்று என்று ஏத்தி, இரவும் பகலும், எழில் ஆர்\nபாதப்\nபோது ஆய்ந்து அணைவது என்று கொல்லோ என் பொல்லா\nமணியைப் புணர்ந்தே?", "காப்பாய், படைப்பாய், கரப்பாய், முழுதும்; கண் ஆர் விசும்பின்\nவிண்ணோர்க்கு எல்லாம்\nமூப்பாய்; மூவா முதலாய் நின்ற முதல்வா; முன்னே எனை ஆண்ட\nபார்ப்பானே; எம் பரமா! என்று, பாடிப் பாடிப் பணிந்து, பாதப்\nபூப் போது அணைவது என்று கொல்லோ என் பொல்லா மணியைப்\nபுணர்ந்தே?"]], ["வாழாப் பத்து", ["பாரொடு, விண்ணாய், பரந்த, எம் பரனே! பற்று நான் மற்று இலேன்\nகண்டாய்;\nசீரொடு பொலிவாய், சிவபுரத்து அரசே! திருப்பெருந்துறை உறை\nசிவனே!\nஆரொடு நோகேன்? ஆர்க்கு எடுத்து உரைக்கேன்? ஆண்ட நீ\nஅருளிலையானால்,\nவார் கடல் உலகில் வாழ்கிலேன் கண்டாய்; வருக' என்று, அருள்\nபுரியாயே.", "வம்பனேன் தன்னை ஆண்ட மா மணியே! மற்று நான் பற்று\nஇலேன் கண்டாய்;\nஉம்பரும் அறியா ஒருவனே! இருவர்க்கு உணர்வு இறந்து, உலகம்\nஊடுருவும்\nசெம் பெருமானே! சிவபுரத்து அரசே! திருப்பெருந்துறை உறை\nசிவனே!\nஎம்பெருமானே! என்னை ஆள்வானே! என்னை, நீ\nகூவிக்கொண்டருளே.", "பாடி, மால், புகழும் பாதமே அல்லால், பற்று நான் மற்று இலேன்\nகண்டாய்;\nதேடி, நீ ஆண்டாய்; சிவபுரத்து அரசே! திருப்பெருந்துறை உறை\nசிவனே!\nஊடுவது உன்னோடு; உவப்பதும் உன்னை; உணர்த்துவது, உனக்கு,\nஎனக்கு உறுதி;\nவாடினேன்; இங்கு வாழ்கிலேன் கண்டாய்; வருக' என்று,\nஅருள்புரியாயே.", "வல்லை வாள் அரக்கர் புரம் எரித்தானே! மற்று நான் பற்று இலேன்\nகண்டாய்;\nதில்லை வாழ் கூத்தா! சிவபுரத்து அரசே! திருப்பெருந்துறை உறை\nசிவனே!\nஎல்லை மூ உலகும் உருவி, அன்று, இருவர் காணும் நாள், ஆதி, ஈறு,\nஇன்மை\nவல்லையாய் வளர்ந்தாய்; வாழ்கிலேன் கண்டாய்; வருக' என்று,\nஅருள்புரியாயே.", "பண்ணின் நேர் மொழியாள் பங்க! நீ அல்லால், பற்று நான் மற்று\nஇலேன் கண்டாய்;\nதிண்ணமே ஆண்டாய்; சிவபுரத்து அரசே! திருப்பெருந்துறை உறை\nசிவனே!\nஎண்ணமே, உடல், வாய், மூக்கொடு, செவி, கண், என்று இவை\nநின்கணே வைத்து,\nமண்ணின்மேல் அடியேன் வாழ்கிலேன் கண்டாய்; வருக' என்று,\nஅருள்புரியாயே.", "பஞ்சின் மெல் அடியாள் பங்க! நீ அல்லால், பற்று நான் மற்று\nஇலேன் கண்டாய்;\nசெஞ்செவே ஆண்டாய்; சிவபுரத்து அரசே! திருப்பெருந்துறை உறை\nசிவனே!\nஅஞ்சினேன் நாயேன்; ஆண்டு, நீ அளித்த அருளினை, மருளினால்\nமறந்த\nவஞ்சனேன், இங்கு வாழ்கிலேன் கண்டாய்; வருக' என்று,\nஅருள்புரியாயே.", "பருதி வாழ் ஒளியாய்! பாதமே அல்லால், பற்று நான் மற்று இலேன்\nகண்டாய்;\nதிரு உயர் கோலச் சிவபுரத்து அரசே! திருப்பெருந்துறை உறை\nசிவனே!\nகருணையே நோக்கிக் கசிந்து, உளம் உருகிக் கலந்து, நான் வாழும்\nஆறு அறியா\nமருளனேன், உலகில் வாழ்கிலேன் கண்டாய்; வருக' என்று,\nஅருள்புரியாயே.", "பந்து அணை விரலாள் பங்க! நீ அல்லால், பற்று நான் மற்று\nஇலேன் கண்டாய்;\nசெம் தழல் போல்வாய், சிவபுரத்து அரசே! திருப்பெருந்துறை உறை\nசிவனே!", "அந்தம் இல் அமுதே! அரும் பெரும் பொருளே! ஆர் அமுதே!\nஅடியேனை\nவந்து உய, ஆண்டாய்; வாழ்கிலேன் கண்டாய்; வருக' என்று,\nஅருள்புரியாயே.", "பாவ நாசா, உன் பாதமே அல்லால், பற்று நான் மற்று இலேன்\nகண்டாய்;\nதேவர் தம் தேவே, சிவபுரத்து அரசே! திருப்பெருந்துறை உறை\nசிவனே!\nமூ உலகு உருவ, இருவர் கீழ் மேலாய், முழங்கு அழலாய்,\nநிமிர்ந்தானே!\nமா உரியானே! வாழ்கிலேன் கண்டாய்; வருக' என்று,\nஅருள்புரியாயே.", "பழுது இல் தொல் புகழாள் பங்க! நீ அல்லால், பற்று நான் மற்று\nஇலேன் கண்டாய்;\nசெழு மதி அணிந்தாய், சிவபுரத்து அரசே! திருப்பெருந்துறை உறை\nசிவனே!\nதொழுவனோ பிறரை? துதிப்பனோ? எனக்கு ஓர் துணை என\nநினைவனோ? சொல்லாய்;\nமழ விடையானே! வாழ்கிலேன் கண்டாய்; வருக' என்று,\nஅருள்புரியாயே."]], ["அருள் பத்து", ["சோதியே! சுடரே! சூழ் ஒளி விளக்கே! சுரி குழல், ணை முலை\nமடந்தை\nபாதியே! பரனே! பால் கொள் வெள் நீற்றாய்! பங்கயத்து அயனும்,\nமால், அறியா\nநீதியே! செல்வத் திருப்பெருந்துறையில் நிறை மலர்க் குருந்தம்\nமேவிய சீர்\nஆதியே! அடியேன் ஆதரித்து அழைத்தால், அதெந்துவே?' என்று,\nஅருளாயே!", "நிருத்தனே! நிமலா! நீற்றனே! நெற்றிக் கண்ணனே! விண் உளார்\nபிரானே!\nஒருத்தனே! உன்னை, ஓலம் இட்டு அலறி, உலகு எலாம் தேடியும்,\nகாணேன்;\nதிருத்தம் ஆம் பொய்கைத் திருப்பெருந்துறையில் செழு மலர்க்\nகுருந்தம் மேவிய சீர்\nஅருத்தனே! அடியேன் ஆதரித்து அழைத்தால், அதெந்துவே?' என்று,\nஅருளாயே!", "எங்கள் நாயகனே! என் உயிர்த் தலைவா! ஏல வார் குழலிமார்\nஇருவர்\nதங்கள் நாயகனே! தக்க நல் காமன் தனது உடல் தழல் எழ\nவிழித்த\nசெம் கண் நாயகனே! திருப்பெருந்துறையில் செழு மலர்க் குருந்தம்\nமேவிய சீர்\nஅம் கணா! அடியேன் ஆதரித்து அழைத்தால், அதெந்துவே?' என்று,\nஅருளாயே!", "கமல நான்முகனும், கார் முகில் நிறத்துக் கண்ணனும், நண்ணுதற்கு\nஅரிய\nவிமலனே, எமக்கு வெளிப்படாய்' என்ன, வியன் தழல் வெளிப்பட்ட\nஎந்தாய்!\nதிமில நான்மறை சேர் திருப்பெருந்துறையில் செழு மலர்க்\nகுருந்தம் மேவிய சீர்\nஅமலனே! அடியேன் ஆதரித்து அழைத்தால், அதெந்துவே?' என்று,\nஅருளாயே!", "துடி கொள் நேர் இடையாள், சுரி குழல் மடந்தை துணை\nமுலைக்கண்கள் தோய் சுவடு,\nபொடி கொள் வான் தழலில், புள்ளி போல், இரண்டு பொங்கு ஒளி\nதங்கு மார்பினனே!\nசெடி கொள் வான் பொழில் சூழ் திருப்பெருந்துறையில் செழு\nமலர்க் குருந்தம் மேவியசீர்\nஅடிகளே! அடியேன் ஆதரித்து அழைத்தால், அதெந்துவே?' என்று,\nஅருளாயே!", "துப்பனே, தூயாய்! தூய வெள் நீறு துதைந்து எழு துளங்கு ஒளி\nவயிரத்து\nஒப்பனே! உன்னை உள்குவார் மனத்தில் உறு சுவை அளிக்கும் ஆர்\nஅமுதே!\nசெப்பம் ஆம் மறை சேர் திருப்பெருந்துறையில், செழு மலர்க்\nகுருந்தம் மேவிய சீர்\nஅப்பனே! அடியேன் ஆதரித்து அழைத்தால், அதெந்துவே?' என்று,\nஅருளாயே!", "மெய்யனே! விகிர்தா! மேருவே வில்லா, மேவலர் புரங்கள் மூன்று\nஎரித்த\nகையனே! காலால் காலனைக் காய்ந்த, கடும் தழல் பிழம்பு அன்ன\nமேனிச்\nசெய்யனே! செல்வத் திருப்பெருந்துறையில் செழு மலர்க் குருந்தம்\nமேவிய சீர்\nஐயனே! அடியேன் ஆதரித்து அழைத்தால், அதெந்துவே?' என்று,\nஅருளாயே!", "முத்தனே! முதல்வா! முக்கணா! முனிவா! மொட்டு அறா மலர்\nபறித்து, இறைஞ்சி,\nபத்தியாய் நினைந்து, பரவுவார் தமக்குப் பர கதி கொடுத்து,\nஅருள்செய்யும்\nசித்தனே! செல்வத் திருப்பெருந்துறையில் செழு மலர்க் குருந்தம்\nமேவிய சீர்\nஅத்தனே! அடியேன் ஆதரித்து அழைத்தால், அதெந்துவே?' என்று,\nஅருளாயே!", "மருளனேன் மனத்தை மயக்கு அற நோக்கி, மறுமையோடு\nஇம்மையும் கெடுத்த\nபொருளனே! புனிதா! பொங்கு வாள் அரவம், கங்கை நீர், தங்கு செம்\nசடையாய்!\nதெருளும் நான்மறை சேர் திருப்பெருந்துறையில் செழு மலர்க்\nகுருந்தம் மேவிய சீர்\nஅருளனே! அடியேன் ஆதரித்து அழைத்தால், அதெந்துவே?' என்று,\nஅருளாயே!", "திருந்து வார் பொழில் சூழ் திருப்பெருந்துறையில் செழு மலர்க்\nகுருந்தம் மேவிய சீர்\nஇருந்தவாறு எண்ணி, ஏசறா, நினைந்திட்டு, என்னுடை எம்பிரான்'\nஎன்று என்று,\nஅருந்தவா! நினைந்தே, ஆதரித்து அழைத்தால், அலை கடல்\nஅதனுளே நின்று\nபொருந்த, வா; கயிலை புகு நெறி இது காண்; போதராய்' என்று\nஅருளாயே!"]], ["திருக்கழுக்குன்றப் பதிகம்", ["பிணக்கு இலாத பெருந்துறைப் பெருமான்! உன் நாமங்கள்\nபேசுவார்க்கு,\nஇணக்கு இலாதது ஓர் இன்பமே வரும்; துன்பமே துடைத்து,\nஎம்பிரான்!\nஉணக்கு இலாதது ஒர் வித்து, மேல் விளையாமல், என் வினை\nஒத்த பின்,\nகணக்கு இலாத் திருக்கோலம் நீ வந்து, காட்டினாய், கழுக்குன்றிலே!", "பிட்டு நேர்பட, மண் சுமந்த பெருந்துறைப் பெரும் பித்தனே!\nசட்ட நேர்பட, வந்திலாத சழக்கனேன் உனைச் சார்ந்திலேன்;\nசிட்டனே! சிவலோகனே! சிறு நாயினும் கடை ஆய வெம்\nகட்டனேனையும் ஆட்கொள்வான், வந்து, காட்டினாய், கழுக்குன்றிலே!", "மலங்கினேன் கண்ணின் நீரை மாற்றி, மலம் கெடுத்த பெருந்துறை\nவிலங்கினேன்; வினைக்கேடனேன், இனி மேல் விளைவது\nஅறிந்திலேன்;\nஇலங்குகின்ற நின் சேவடிகள் இரண்டும், வைப்பிடம் இன்றியே\nகலங்கினேன்; கலங்காமலே, வந்து, காட்டினாய், கழுக்குன்றிலே!", "பூண் ஒணாதது ஓர் அன்பு பூண்டு, பொருந்தி, நாள்தொறும்\nபோற்றவும்,\nநாண் ஒணாதது ஒர் நாணம் எய்தி, நடுக் கடலுள் அழுந்தி, நான்\nபேண் ஒணாத பெருந்துறைப் பெரும் தோணி பற்றி உகைத்தலும்,\nகாண் ஒணாத் திருக்கோலம், நீ வந்து, காட்டினாய், கழுக்குன்றிலே!", "கோல மேனி வராகமே! குணம் ஆம் பெருந்துறைக் கொண்டலே!\nசீலம் ஏதும் அறிந்திலாத என் சிந்தை வைத்த சிகாமணி!\nஞாலமே கரி ஆக, நான் உனை நச்சி நச்சிட வந்திடும்\nகாலமே! உனை ஓத, நீ வந்து, காட்டினாய், கழுக்குன்றிலே!", "பேதம் இல்லது ஓர் கற்பு அளித்த பெருந்துறைப் பெரு வெள்ளமே!\nதெமே பல பேச, நீ எனை ஏதிலார் முனம், என் செய்தாய்?\nசாதல் சாதல், பொல்லாமை அற்ற, தனிச் சரண் சரண் ஆம் என,\nகாதலால் உனை ஓத, நீ வந்து, காட்டினாய், கழுக்குன்றிலே!", "இயக்கிமார் அறுபத்து நால்வரை எண் குணம் செய்த ஈசனே!\nமயக்கம் ஆயது ஓர் மும் மலப் பழ வல் வினைக்குள் அழுந்தவும்,\nதுயக்கு அறுத்து, எனை ஆண்டுகொண்டு, நின் தூ மலர்க் கழல்\nதந்து, எனைக்\nகயக்க வைத்து, அடியார் முனே வந்து, காட்டினாய், கழுக்குன்றிலே!"]], ["கண்ட பத்து", ["இந்திரிய வயம் மயங்கி, இறப்பதற்கே காரணம் ஆய்,\nஅந்தரமே திரிந்து போய், அரு நரகில் விழ்வேனைச்\nசிந்தை தனைத் தெளிவித்து, சிவம் ஆக்கி, எனை ஆண்ட\nஅந்தம் இலா ஆனந்தம் அணி கொள் தில்லைக் கண்டேனே!", "வினைப் பிறவி என்கின்ற வேதனையில் அகப்பட்டு,\nதனைச் சிறிதும் நினையாதே, தளர்வு எய்திக் கிடப்பேனை,\nஎனைப் பெரிதும் ஆட்கொண்டு, என் பிறப்பு அறுத்த, இணை\nஇலியை\nஅனைத்து உலகும் தொழும் தில்லை அம்பலத்தே கண்டேனே!", "உருத் தெரியாக் காலத்தே, உள் புகுந்து, என் உளம் மன்னி,\nகருத்து இருத்தி, ஊன் புக்கு கருணையினால் ஆண்டுகொண்ட\nதிருத்துருத்தி மேயானை, தித்திக்கும் சிவபதத்தை\nஅருத்தியினால் நாய் அடியேன் அணிகொள் தில்லைக் கண்டேனே!", "கல்லாத, புல் அறிவின் கடைப்பட்ட நாயேனை,\nவல்லாளன் ஆய் வந்து, வனப்பு எய்தி இருக்கும்வண்ணம்,\nபல்லோரும் காண, என்தன் பசுபாசம் அறுத்தானை\nஎல்லோரும் இறைஞ்சு தில்லை அம்பலத்தே கண்டேனே!", "சாதி, குலம், பிறப்பு, என்னும் சுழிப்பட்டூத் தடுமாறும்\nஆதம் இலி நாயேனை, அல்லல் அறுத்து; ஆட்கொண்டு;\nபேதை குணம், பிறர் உருவம், யான், எனது, என் உரை, மாய்த்து;\nகோது இல் அமுது ஆனானை குலாவு தில்லைக் கண்டேனே!", "பிறவி தனை அற மாற்றி; பிணி, மூப்பு, என்ற இவை இரண்டும்,\nஉறவினொடும், ஒழியச் சென்று; உலகு உடைய ஒரு முதலை\nசெறி பொழில் சூழ் தில்லைநகர்த் திருச்சிற்றம்பலம் மன்னி,\nமறையவரும், வானவரும், வணங்கிட நான் கண்டேனே!", "பத்திமையும் பரிசும் இலாப் பசு பாசம் அறுத்தருளி,\nபித்தன் இவன் என, என்னை ஆக்குவித்து, பேராமே,\nசித்தம் எனும் திண் கயிற்றால் திருப்பாதம் கட்டுவித்த\nவித்தகனார் விளையாடல் விளங்கு தில்லைக் கண்டேனே!", "அளவு இலாப் பாவகத்தால் அமுக்கு உண்டு, இங்கு, அறிவு இன்றி,\nவிளைவு ஒன்றும் அறியாதே, வெறுவியனாய்க் கிடப்பேனுக்கு\nஅளவு இலா ஆனந்தம் அளித்து, என்னை ஆண்டானை\nகளவு இலா வானவரும் தொழும் தில்லைக் கண்டேனே!", "பாங்கினொடு பரிசு ஒன்றும் அறியாத நாயேனை,\nஓங்கி, உளத்து, ஒளி வளர; உலப்பு இலா அன்பு அருளி;\nவாங்கி, வினை; மலம் அறுத்து; வான் கருணை தந்தானை\nநான்கு மறை பயில் தில்லை அம்பலத்தே கண்டேனே!", "பூதங்கள் ஐந்து ஆகி, புலன் ஆகி, பொறி ஆகி,\nபேதங்கள் அனைத்தும் ஆய், பேதம் இலாப் பெருமையனை,\nகேதங்கள் கெடுத்து ஆண்ட கிளர் ஒளியை, மரகதத்தை\nவேதங்கள் தொழுது ஏத்தும் விளங்கு தில்லைக் கண்டேனே!"]], ["பிரார்த்தனைப் பத்து", ["கலந்து, நின் அடியாரோடு, அன்று, வாளா, களித்திருந்தேன்;\nபுலர்ந்து போன, காலங்கள்; புகுந்து நின்றது இடர், பின் நாள்;\nஉலர்ந்து போனேன்; உடையானே! உலவா இன்பச் சுடர் காண்பான்,\nஅலந்து போனேன்; அருள் செய்யாய், ஆர்வம் கூர, அடியேற்கே!", "அடியார் சிலர், உன் அருள் பெற்றார், ஆர்வம் கூர; யான் அவமே,\nமுடை ஆர் பிணத்தின், முடிவு இன்றி, முனிவால், அடியேன்,\nமூக்கின்றேன்;", "கடியேனுடைய கடு வினையைக் களைந்து, உன் கருணைக் கடல்\nபொங்க,\nஉடையாய்! அடியேன் உள்ளத்தே ஓவாது ௨௬௧, அருளாயே!", "அருள் ஆர் அமுதப் பெரும் கடல்வாய், அடியார் எல்லாம் புக்கு\nஅழுந்த,\nஇருள் ஆர் ஆக்கை இது பொறுத்தே எய்த்தேன் கண்டாய்;\nஎம்மானே!\nமருள் ஆர் மனத்து ஓர் உன்மத்தன் வருமால்' என்று, இங்கு, எனைக்\nகண்டார்\nவெருளாவண்ணம், மெய் அன்பை, உடையாய்! பெற நான்\nவேண்டுமே!", "வேண்டும், வேண்டும், மெய் அடியார் உள்ளே, விரும்பி, எனை\nஅருளால்\nஆண்டாய்; அடியேன் இடர் களைந்த அமுதே! அரு மா மணி\nமுத்தே!\nதூண்டா விளக்கின் சுடர் அனையாய்! தொண்டனேற்கும்\nஉண்டாம்கொல்\nவேண்டாது ஒன்றும் வேண்டாது, மிக்க அன்பே மேவுதலே?", "மேவும் உன் தன் அடியாருள் விரும்பி, யானும், மெய்ம்மையே,\nகாவி சேரும் கயல் கண்ணாள் பங்கா, உன் தன் கருணையினால்\nபாவியேற்கும் உண்டாமோ பரம ஆனந்தப் பழம் கடல் சேர்ந்து,\nஆவி, யாக்கை, யான், எனது, என்று யாதும் இன்றி, அறுதலே?", "அறவே பெற்றார், நின் அன்பர் அந்தம் இன்றி, அகம் நெகவும்;\nபுறமே கிடந்து, புலை நாயேன் புலம்புகின்றேன்; உடையானே!\nபெறவே வேண்டும், மெய் அன்பு; பேரா, ஒழியா, பிரிவு இல்லா,\nமறவா, நினையா, அளவு இலா, மாளா, இன்ப மா கடலே!", "கடலே அனைய ஆனந்தம் கண்டார் எல்லாம் கவர்ந்து உண்ண,\nஇடரே பெருக்கி, ஏசற்று, இங்கு, இருத்தல் அழகோ, அடி நாயேன்?\nஉடையாய்! நீயே அருளுதி என்று, உணர்த்தாது ஒழிந்தே,\nகழிந்தொழிந்தேன்;\nசுடர் ஆர் அருளால், இருள் நீங்க, சோதி இனித்தான் துணியாயே!", "துணியா, உரகா, அருள் பெருகத் தோன்றும் தொண்டர் இடைப்\nபுகுந்து,\nதிணி ஆர் மூங்கில் சிந்தையேன், சிவனே! நின்று தேய்கின்றேன்;\nஅணி ஆர் அடியார் உனக்கு உள்ள அன்பும் தாராய்; அருள் அளியத்\nதணியாது, ஒல்லை வந்தருளி, தளிர் பொன் பாதம் தாராயே!", "தாரா அருள் ஒன்று இன்றியே தந்தாய்' என்று, உன் தமர் எல்லாம்\nஆரா நின்றார்; அடியேனும், அயலார் போல, அயர்வேனோ?\nசீர் ஆர் அருளால், சிந்தனையைத் திருத்தி ஆண்ட சிவலோகா!\nபேர் ஆனந்தம் பேராமை வைக்கவேண்டும், பெருமானே!", "மான் ஓர் பங்கா! வந்திப்பார் மதுரக் கனியே! மனம் நெகா\nநான், ஓர் தோளாச் சுரை ஒத்தால், நம்பி! இனித்தான் வாழ்ந்தாயே?\nஊனே புகுந்த உனை உணர்ந்தே, உருகிப் பெருகும் உள்ளத்தை,\nகோனே! அருளும் காலம் தான், கொடியேற்கு, என்றோ கூடுவதே?", "கூடிக் கூடி, உன் அடியார் குனிப்பார், சிரிப்பார், களிப்பாராய்;\nவாடி வாடி, வழி அற்றே, வற்றல் மரம் போல் நிற்பேெனோ?\nஊடி ஊடி, உடையாயொடு கலந்து, உள் உருகி, பெருகி, நெக்கு,\nஆடி ஆடி, ஆனந்தம் அதுவே ஆக, அருள் கலந்தே!"]], ["குழைத்த பத்து", ["குழைத்தால், பண்டைக் கொடு வினை, நோய், காவாய்; உடையாய்!\nகொடு வினையேன்\nஉழைத்தால், உறுதி உண்டோ தான்? உமையாள் கணவா! எனை\nஆள்வாய்;\nபிழைத்தால், பொறுக்க வேண்டாவோ? பிறை சேர் சடையாய்!\nமுறையோ?' என்று\nஅழைத்தால், அருளாது ஒழிவதே, அம்மானே, உன் அடியேற்கே?", "அடியேன் அல்லல் எல்லாம், முன், அகல ஆண்டாய், என்று\nஇருந்தேன்;\nகொடி ஏர் இடையாள் கூறா, எம் கோவே, ஆ! ஆ! என்று அருளி,\nசெடி சேர் உடலைச் சிதையாதது எத்துக்கு? எங்கள் சிவலோகா!\nஉடையாய்! கூவிப் பணி கொள்ளாது, ஒறுத்தால், ஒன்றும் போதுமே?", "ஒன்றும் போதா நாயேனை உய்யக் கொண்ட நின் கருணை,\nஇன்றே, இன்றிப் போய்த்தோ தான்? ஏழை பங்கா! எம் கோவே!\nகுன்றே அனைய குற்றங்கள் குணம் ஆம் என்றே, நீ கொண்டால்,\nஎன் தான் கெட்டது? இரங்கிடாய்; எண் தோள், முக் கண், எம்மானே!", "மான் நேர் நோக்கி மணவாளா! மன்னே! நின் சீர் மறப்பித்து, இவ்\nஊனே புக, என் தனை நூக்கி, உழலப் பண்ணுவித்திட்டாய்;\nஆனால், அடியேன் அறியாமை அறிந்து, நீயே அருள் செய்து,\nகோனே! கூவிக்கொள்ளும் நாள் என்று? என்று, உன்னைக் கூறுவதே?", "கூறும் நாவே முதலாகக் கூறும் கரணம் எல்லாம் நீ!\nதேறும் வகை நீடதிகைப்பு நீ தீமை, நன்மை, முழுதும் நீ!\nவேறு ஓர் பரிசு, இங்கு, ஒன்று இல்லை; மெய்ம்மை, உன்னை\nவிரித்து உரைக்கின்,\nதேறும் வகை என்? சிவலோகா! திகைத்தால், தேற்ற வேண்டாவோ?", "வேண்டத் தக்கது அறிவோய் நீ! வேண்ட, முழுதும் தருவோய் நீ!\nவேண்டும் அயன், மாற்கு, அரியோய் நீட வேண்டி, என்னைப் பணி\nகொண்டாய்;", "வேண்டி, நீ யாது அருள் செய்தாய், யானும், அதுவே வேண்டின்\nஅல்லால்,\nவேண்டும் பரிசு ஒன்று உண்டு என்னில், அதுவும், உன் தன் விருப்பு\nஅன்றே?", "அன்றே, என் தன் ஆவியும், உடலும், உடைமை எல்லாமும்,\nகுன்றே அனையாய்! என்னை ஆட்கொண்ட போதே\nகொண்டிலையோ?\nஇன்று, ஓர் இடையூறு எனக்கு உண்டோ? எண் தோள், முக் கண்,\nஎம்மானே!\nநன்றே செய்வாய்; பிழை செய்வாய்; நானோ இதற்கு நாயகமே?", "நாயின் கடை ஆம் நாயேனை நயந்து, நீயே ஆட்கொண்டாய்;\nமாயப் பிறவி உன் வசமே வைத்திட்டு இருக்கும் அது அன்றி,\nஆயக் கடவேன், நானோ தான்? என்னதோ, இங்கு, அதிகாரம்?\nகாயத்து இடுவாய்; உன்னுடைய கழல் கீழ் வைப்பாய்; கண் நுதலே!", "கண் ஆர் நுதலோய்! கழல் இணைகள் கண்டேன், கண்கள் களி கூர;\nஎண்ணாது, இரவும் பகலும், நான் அவையே எண்ணும்்இது அல்லால்\nமண்மேல் யாக்கை விடும் ஆறும், வந்து, உன் கழற்கே புகும் ஆறும்\nஅண்ணா! எண்ணக் கடவேனோ? அடிமை சால அழகு உடைத்தே!", "அழகே புரிந்திட்டு, அடி நாயேன் அரற்றுகின்றேன்; உடையானே!\nதிகழா நின்ற திருமேனி காட்டி, என்னைப் பணிகொண்டாய்;\nபுகழே பெரிய பதம் எனக்கு, புராண! நீ, தந்தருளாதே,\nகுழகா, கோல மறையோனே, கோனே, என்னைக் குழைத்தாயே!"]], ["உயிருண்ணிப் பத்து", ["பைந் நாப் பட அரவு ஏர் அல்குல் உமை பாகம் அது ஆய், என்\nமெய்ந் நாள்தொறும் பிரியா, வினைக் கேடா! விடைப் பாகா!\nசெம் நாவலர் பரசும் புகழ்த் திருப்பெருந்துறை உறைவாய்!", "எந் நாள் களித்து, எந் நாள் இறுமாக்கேன், இனி, யானே?", "நான் ஆர், அடி அணைவான்? ஒரு நாய்க்குத் தவிசு இட்டு, இங்கு,\nஊன் ஆர் உடல் புகுந்தான்; உயிர் கலந்தான்; உளம் பிரியான்;\nதேன் ஆர் சடை முடியான்; மன்னு திருப்பெருந்துறை உறைவான்;\nவானோர்களும் அறியாதது ஒர் வளம் ஈந்தனன், எனக்கே.", "எனை, நான் என்பது அறியேன்; பகல், இரவு, ஆவதும் அறியேன்;\nமன வாசகம் கடந்தான் எனை மத்த உன்மத்தன் ஆக்கி;\nசின மால் விடை உடையான், மன்னு திருப்பெருந்துறை உறையும்\nபனவன், எனைச் செய்த படிறு அறியேன்; பரம் சுடரே!", "வினைக்கேடரும் உளரோ பிறர், சொல்லீர்? வியன் உலகில்\nஎனை, தான் புகுந்து, ஆண்டான்; எனது என்பின் புரை உருக்கி,\nபினை, தான் புகுந்து, எல்லே! பெருந்துறையில் உறை பெம்மான்,\nமனத்தான்; கண்ணின் அகத்தான்; மறு மாற்றத்திடையானே!", "பற்று ஆங்கு அவை அற்றிர், பற்றும் பற்று ஆங்கு அது பற்றி,\nநற்று ஆம் கதி அடைவோம் எனின், கெடுவீர், ஓடி வம்மின்;\nதெற்று ஆர் சடைமுடியான், மன்னு திருப்பெருந்துறை இறை, சீர்\nகற்று ஆங்கு, அவன் கழல் பேணினரொடும் கூடுமின், கலந்தே!", "கடலின் திரை அது போல் வரு கலக்கம், மலம், அறுத்து; என்\nஉடலும், எனது உயிரும், புகுந்து, ஒழியாவணம், நிறைந்தான்:\nசுடரும் சுடர் மதி சூடிய, திருப்பெருந்துறை உறையும்,\nபடரும் சடை மகுடத்து, எங்கள் பரன் தான் செய்த படிறே!", "வேண்டேன் புகழ்; வேண்டேன் செல்வம்; வேண்டேன் மண்ணும்,\nவிண்ணும்;\nவேண்டேன் பிறப்பு, இறப்பு; சிவம் வேண்டார் தமை நாளும்\nதீண்டேன்; சென்று, சேர்ந்தேன், மன்னு திருப்பெருந்துறை; இறை தாள்\nபூண்டேன்; புறம் போகேன்; இனி, புறம்போகல் ஒட்டேனே!", "கோல்தேன் எனக்கு என்கோகுரை கடல்வாய் அமுது என்கோ\nஆற்றேன்; எங்கள் அரனே! அரு மருந்தே! எனது அரசே!\nசேற்று ஆர் வயல் புடை சூழ்தரு திருப்பெருந்துறை உறையும்,\nநீற்று ஆர்தரு திருமேனி நின்மலனே! உனை யானே?", "எச்சம் அறிவேன் நான்; எனக்கு இருக்கின்றதை அறியேன்;\nஅச்சோ! எங்கள் அரனே! அரு மருந்தே! எனது அமுதே!\nசெச்சை மலர் புரை மேனியன், திருப்பெருந்துறை உறைவான்,\nநிச்சம் என நெஞ்சில் மன்னி, யான் ஆகி நின்றானே!", "வான் பாவிய உலகத்தவர் தவமே செய, அவமே,\nஊன் பாவிய உடலைச் சுமந்து, அடவி மரம் ஆனேன்;\nதேன் பாய் மலர்க் கொன்றை மன்னு திருப்பெருந்துறை\nஉறைவாய்!\nநான் பாவியன் ஆனால், உனை நல்காய் எனல் ஆமே?"]], ["அச்சப் பத்து", ["புற்றில் வாள் அரவும் அஞ்சேன்; பொய்யர் தம் மெய்யும் அஞ்சேன்;\nகற்றை வார் சடை எம் அண்ணல், கண் நுதல், பாதம் நண்ணி,\nமற்றும் ஓர் தெய்வம் தன்னை உண்டு என நினைந்து, எம்\nபெம்மாற்கு\nஅற்றிலாதவரைக் கண்டால், அம்ம! நாம் அஞ்சுமாறே!", "வெருவரேன், வேட்கை வந்தால்; வினைக் கடல் கொளினும்,\nஅஞ்சேன்;\nஇருவரால் மாறு காணா எம்பிரான், தம்பிரான், ஆம்\nதிரு ௨௬ அன்றி, மற்று ஓர் தேவர், எத் தேவர்? என்ன\nஅருவராதவரைக் கண்டால், அம்ம! நாம் அஞ்சுமாறே!", "வன் புலால் வேலும் அஞ்சேன்; வளைக் கையார் கடைக் கண்\nஅஞ்சேன்;\nஎன்பு எலாம் உருக நோக்கி, அம்பலத்து ஆடுகின்ற\nஎன் பொலா மணியை ஏத்தி, இனிது அருள் பருக மாட்டா\nஅன்பு இலாதவரைக் கண்டால், அம்ம! நாம் அஞ்சுமாறே!", "கிளி அனார் கிளவி அஞ்சேன்; அவர் கிறி முறுவல் அஞ்சேன்;\nவெளிய நீறு ஆடும் மேனி வேதியன் பாதம் நண்ணி,\nதுளி உலாம் கண்ணர் ஆகி, தொழுது, அழுது, உள்ளம் நெக்கு, இங்கு,\nஅளி இலாதவரைக் கண்டால், அம்ம! நாம் அஞ்சுமாறே!", "பிணி எலாம் வரினும், அஞ்சேன்; பிறப்பினோடு இறப்பும் அஞ்சேன்;\nதுணி நிலா அணியினான் தன் தொழும்பரோடு அழுந்தி, அம் மால்,\nதிணி நிலம் பிளந்தும், காணாச் சேவடி பரவி, வெண் நீறு\nஅணிகிலாதவரைக் கண்டால், அம்ம! நாம் அஞ்சுமாறே!", "வாள் உலாம் எரியும் அஞ்சேன்; வரை புரண்டிடினும், அஞ்சேன்;\nதோள் உலாம் நீற்றன், ஏற்றன், சொல் பதம் கடந்த அப்பன்,\nதாள தாமரைகள் ஏத்தி, தட மலர் புனைந்து, நையும்\nஆள் அலாதவரைக் கண்டால், அம்ம! நாம் அஞ்சுமாறே!", "தகைவு இலாப் பழியும் அஞ்சேன்; சாதலை முன்னம் அஞ்சேன்;\nபுகை முகந்து எரி கை வீசி, பொலிந்த அம்பலத்துள் ஆடும்,\nமுகை நகைக் கொன்றை மாலை, முன்னவன் பாதம் ஏத்தி,\nஅகம் நெகாதவரைக் கண்டால், அம்ம! நாம் அஞ்சுமாறே!", "தறி செறு களிறும் அஞ்சேன்; தழல் விழி உழுவை அஞ்சேன்;\nவெறி கமழ் சடையன், அப்பன், விண்ணவர் நண்ண மாட்டாச்\nசெறிதரு கழல்கள் ஏத்தி, சிறந்து, இனிது இருக்க மாட்டா\nஅறிவு இலாதவரைக் கண்டால், அம்ம! நாம் அஞ்சுமாறே!", "மஞ்சு உலாம் உருமும் அஞ்சேன்; மன்னரோடு உறவும் அஞ்சேன்;", "நஞ்சமே அமுதம் ஆக்கும் நம் பிரான் எம்பிரான் ஆய்,\nசெஞ்செவே ஆண்டு கொண்டான் திருமுண்டம் தீட்ட மாட்டாது,\nஅஞ்சுவார் அவரைக் கண்டால், அம்ம! நாம் அஞ்சுமாறே!", "கோண் இலா வாளி அஞ்சேன்; கூற்றுவன் சீற்றம் அஞ்சேன்;\nநீள் நிலா அணியினானை நினைந்து, நைந்து, உருகி, நெக்கு,\nவாள் நிலாம் கண்கள் சோர, வாழ்த்திநின்று, ஏத்தமாட்டா\nஆண் அலாதவரைக் கண்டால், அம்ம! நாம் அஞ்சுமாறே!"]], ["திருப்பாண்டிப் பதிகம்", ["பரு வரை மங்கை தன் பங்கரை, பாண்டியற்கு ஆர் அமுது ஆம்\nஒருவரை, ஒன்றும் இலாதவரை, கழல் போது இறைஞ்சி,\nதெரிவர நின்று, உருக்கி, பரி மேற்கொண்ட சேவகனார்\nஒருவரை அன்றி, உருவு அறியாது என் தன் உள்ளம் அதே.", "சதிரை மறந்து, அறி மால் கொள்வர் சார்ந்தவர்; சாற்றிச்\nசொன்னோம்;\nகதிரை மறைத்தன்ன சோதி, கழுக்கடை கைப் பிடித்து,\nகுதிரையின் மேல் வந்து கூடிடுமேல், குடி கேடு கண்டீர்!\nமதுரையர் மன்னன் மறு பிறப்பு ஓட மறித்திடுமே.", "நீர் இன்ப வெள்ளத்துள் நீந்திக் குளிக்கின்ற நெஞ்சம் கொண்டீர்;\nபார் இன்ப வெள்ளம் கொள, பரி மேற்கொண்ட பாண்டியனார்,\nஓர் இன்ப வெள்ளத்து உருக் கொண்டு, தொண்டரை உள்ளம்\nகொண்டார்;\nபேர் இன்ப வெள்ளத்துள், பெய் கழலே சென்று பேணுமினே.", "செறியும் பிறவிக்கு நல்லவர் செல்லல்மின்; தென்னன், நல் நாட்டு\nஇறைவன், கிளர்கின்ற காலம் இக் காலம், எக் காலத்துள்ளும்;\nஅறிவு ஒண் கதிர் வாள் உறை கழித்து, ஆனந்த மாக் கடவி,\nஎறியும் பிறப்பை, எதிர்ந்தார் புரள, இரு நிலத்தே.", "காலம் உண்டாகவே, காதல் செய்து உய்ம்மின்; கருது அரிய\nஞாலம் உண்டானொடு, நான்முகன், வானவர், நண் அரிய\nஆலம் உண்டான்; எங்கள் பாண்டிப் பிரான்; தன் அடியவர்க்கு\nமூல பண்டாரம் வழங்குகின்றான்: வந்து, முந்துமினே.", "ஈண்டிய மாய இருள் கெட, எப் பொருளும் விளங்க,\nதூண்டிய சோதியை, மீனவனும் சொல்ல வல்லன் அல்லன்;\nவேண்டிய போதே விலக்கு இலை வாய்தல்; விரும்புமின் தாள்;\nபாண்டியனார் அருள்செய்கின்ற முத்திப் பரிசு இதுவே.", "மாய வனப் பரி மேற்கொண்டு, மற்று அவர் கைக்கொளலும்,\nபோய் அறும், இப் பிறப்பு என்னும் பகைகள்: புகுந்தவருக்கு,\nஆய, அரும் பெரும், சீர் உடைத் தன் அருளே அருளும்:\nசேய நெடும் கொடைத் தென்னவன் சேவடி சேர்மின்களே.", "அழிவு இன்றி நின்றது ஒர் ஆனந்த வெள்ளத்திடை அழுத்தி,\nகழிவு இல் கருணையைக் காட்டி, கடிய வினை அகற்றி,\nபழ மலம் பற்று அறுத்து, ஆண்டவன், பாண்டிப் பெரும் பதமே,\nமுழுது உலகும், தருவான், கொடையே; சென்று முந்துமினே.", "விரவிய தீ வினை மேலைப் பிறப்பு முந்நீர் கடக்க,\nபரவிய அன்பரை, என்பு உருக்கும் பரம் பாண்டியனார்,\nபுரவியின் மேல் வர, புந்தி கொளப்பட்ட பூம் கொடியார்\nமர இயல் மேற்கொண்டு, தம்மையும் தாம் அறியார், மறந்தே.", "கூற்றை வென்று, ஆங்கு ஐவர் கோக்களையும் வென்று இருந்து,\nஅழகால்\nவீற்றிருந்தான், பெரும் தேவியும், தானும் ஒர் மீனவன்பால்\nஏற்று வந்து, ஆர் உயிர் உண்ட, திறல் ஒற்றைச் சேவகனே;\nதேற்றம் இலாதவர்! சேவடி சிக்கெனச் சேர்மின்களே."]], ["பிடித்த பத்து", ["உம்பர்கட்கு அரசே! ஒழிவு அற நிறைந்த யோகமே! ஊத்தையேன்\nதனக்கு\nவம்பு எனப் பழுத்து, என் குடி முழுது ஆண்டு, வாழ்வு அற\nவாழ்வித்த மருந்தே!\nசெம் பொருள் துணிவே! சீர் உடைக் கழலே! செல்வமே!\nசிவபெருமானே!\nஎம்பொருட்டு, உன்னைச் சிக்கெனப் பிடித்தேன்; எங்கு\nஎழுந்தருளுவது, இனியே?", "விடை விடாது உகந்த விண்ணவர் கோவே! வினையனேனுடைய\nமெய்ப் பொருளே!\nமுடை விடாது, அடியேன் மூத்து, அற மண் ஆய், முழுப் புழுக்\nகுரம்பையில் கிடந்து,\nகடைபடாவண்ணம் காத்து, எனை ஆண்ட கடவுளே! கருணை மா\nகடலே!\nஇடைவிடாது, உன்னைச் சிக்கெனப் பிடித்தேன்; எங்கு\nஎழுந்தருளுவது, இனியே?", "அம்மையே! அப்பா! ஒப்பு இலா மணியே! அன்பினில் விளைந்த\nஆர் அமுதே!\nபொய்ம்மையே பெருக்கி, பொழுதினைச் சுருக்கும், புழுத் தலைப்\nபுலையனேன் தனக்கு,\nசெம்மையே ஆய சிவபதம் அளித்த செல்வமே! சிவபெருமானே!\nஇம்மையே, உன்னைச் சிக்கெனப் பிடித்தேன்; எங்கு எழுந்தருளுவது,\nஇனியே?", "அருள் உடைச் சுடரே! அளிந்தது ஓர் கனியே! பெரும் திறல் அரும்\nதவர்க்கு அரசே!", "பொருள் உடைக் கலையே! புகழ்ச்சியைக் கடந்த போகமே!\nயோகத்தின் பொலிவே!\nதெருள் இடத்து அடியார் சிந்தையுள் புகுந்த செல்வமே!\nசிவபெருமானே!\nஇருள் இடத்து, உன்னைச் சிக்கெனப் பிடித்தேன்; எங்கு\nஎழுந்தருளுவது, இனியே?", "ஒப்பு உனக்கு இல்லா ஒருவனே! அடியேன் உள்ளத்துள் ஒளிர்கின்ற\nஒளியே!\nமெய்ப் பதம் அறியா வீறு இலியேற்கு, விழுமியது அளித்தது ஓர்\nஅன்பே!\nசெப்புதற்கு அரிய செழும் சுடர் மூர்த்தி செல்வமே! சிவபெருமானே!\nஎய்ப்பு இடத்து, உன்னைச் சிக்கெனப் பிடித்தேன்; எங்கு\nஎழுந்தருளுவது, இனியே?", "அறவையேன் மனமே கோயிலாக் கொண்டு, ஆண்டு, அளவு இலா\nஆனந்தம் அருளி,\nபிறவி வேர் அறுத்து, என் குடி முழுது ஆண்ட பிஞ்ஞகா! பெரிய\nஎம் பொருளே!\nதிறவிலே கண்ட காட்சியே! அடியேன் செல்வமே! சிவபெருமானே!\nஇறவிலே, உன்னைச் சிக்கெனப் பிடித்தேன்; எங்கு எழுந்தருளுவது,\nஇனியே?", "பாச வேர் அறுக்கும் பழம் பொருள்! தன்னைப் பற்றும் ஆறு,\nஅடியனேற்கு அருளி,\nபூசனை உகந்து, என் சிந்தையுள் புகுந்து, பூம் கழல் காட்டிய\nபொருளே!\nதேசு உடை விளக்கே! செழும் சுடர் மூர்த்தி செல்வமே!\nசிவபெருமானே!\nஈசனே! உன்னைச் சிக்கெனப் பிடித்தேன்; எங்கு எழுந்தருளுவது,\nஇனியே?", "அத்தனே! அண்டர் அண்டம் ஆய் நின்ற ஆதியே! யாதும் ஈறு\nஇல்லாச்\nசித்தனே! பத்தர் சிக்கெனப் பிடித்த செல்வமே! சிவபெருமானே!\nபித்தனே! எல்லா உயிரும் ஆய்த் தழைத்து, பிழைத்து, அவை\nஅல்லை ஆய் நிற்கும்\nஎத்தனே! உன்னைச் சிக்கெனப் பிடித்தேன்; எங்கு எழுந்தருளுவது,\nஇனியே?", "பால் நினைந்து ஊட்டும் தாயினும் சாலப் பரிந்து, நீ,\nபாவியேனுடைய\nஊனினை உருக்கி, உள் ஒளி பெருக்கி, உலப்பு இலா ஆனந்தம் ஆய\nதேனினைச் சொரிந்து, புறம் புறம் திரிந்த செல்வமே!\nசிவபெருமானே!\nயான் உனைத் தொடர்ந்து, சிக்கெனப் பிடித்தேன்; எங்கு\nஎழுந்தருளுவது, இனியே?", "புன் புலால் யாக்கை புரை புரை கனிய பொன் நெடும் கோயிலாப்\nபுகுந்து, என்\nஎன்பு எலாம் உருக்கி, எளியை ஆய், ஆண்ட ஈசனே! மாசு இலா\nமணியே!\nதுன்பமே, பிறப்பே, இறப்பொடு, மயக்கு, ஆம் தொடக்கு எலாம்,\nஅறுத்த நல் சோதி\nஇன்பமே! உன்னைச் சிக்கெனப் பிடித்தேன்; எங்கு எழுந்தருளுவது,\nஇனியே?"]], ["திருஏசறவு", ["இரும்பு தர மனத்தேனை ஈர்த்து, ஈர்த்து, என் என்பு உருக்கி,\nகரும்பு தரு சுவை எனக்குக் காட்டினை உன் கழல் இணைகள்;\nஒருங்கு திரை உலவு சடை உடையானே! நரிகள் எல்லாம்\nபெரும் குதிரை ஆக்கிய ஆறு அன்றே, உன் பேர் அருளே!", "பண் ஆர்ந்த மொழி மங்கை பங்கா! நின் ஆள் ஆனார்க்கு\nஉண் ஆர்ந்த ஆர் அமுதே! உடையானே! அடியேனை\nமண் ஆர்ந்த பிறப்பு அறுத்திட்டூ ஆள்வாய், நீ வா என்ன;\nகண் ஆர உய்ந்த ஆறு அன்றே, உன் கழல் கண்டே!", "ஆதம் இலி யான், பிறப்பு, இறப்பு, என்னும் அரு நரகில்,\nஆர் தமரும் இன்றியே, அழுந்துவேற்கு, ஆ! ஆ! என்று,\nஓதம் மலி நஞ்சு உண்ட உடையானே! அடியேற்கு உன்\nபாத மலர் காட்டிய ஆறு அன்றே, எம் பரம் பரனே!", "பச்சைத் தாள் அரவு ஆட்டீ! படர் சடையாய்! பாத மலர்\nஉச்சத்தார் பெருமானே! அடியேனை உய்யக்கொண்டு,\nஎச்சத்து ஆர் சிறு தெய்வம் ஏத்தாதே, அச்சோ! என்\nசித்தத்து ஆறு உய்ந்த ஆறு அன்றே, உன் திறம் நினைந்தே!", "கற்று அறியேன் கலை ஞானம்; கசிந்து உருகேன்; ஆயிடினும்,\nமற்று அறியேன் பிற தெய்வம்; வாக்கு இயலால், வார் கழல் வந்து\nஉற்று, இறுமாந்து இருந்தேன்; எம்பெருமானே! அடியேற்குப்\nபொன் தவிசு நாய்க்கு இடும் ஆறு அன்றே, நின் பொன் அருளே!", "பஞ்சு ஆய அடி மடவார் கடைக் கண்ணால், இடர்ப்பட்டு,\nநஞ்சு ஆய துயர் கூர, நடூுங்குவேன்; நின் அருளால்\nஉய்ஞ்சேன்; எம்பெருமானே! உடையானே! அடியேனை,\nஅஞ்சேல், என்று ஆண்ட ஆறு அன்றே, அம்பலத்து அமுதே!", "என்பாலைப் பிறப்பு அறுத்து, இங்கு, இமையவர்க்கும் அறிய\nஒண்ணா,\nதென்பாலைத் திருப்பெருந்துறை உறையும் சிவபெருமான்,\nஅன்பால், நீ அகம் நெகவே புகுந்தருளி, ஆட்கொண்டது,\nஎன்பாலே நோக்கிய ஆறு அன்றே, எம்பெருமானே!", "மூத்தானே, மூவாத முதலானே, முடிவு இல்லா\nஒத்தானே, பொருளானே! உண்மையும் ஆய், இன்மையும் ஆய்,\nபூத்தானே! புகுந்து இங்குப் புரள்வேனை, கருணையினால்\nபேர்த்தே, நீ ஆண்ட ஆறு அன்றே, எம்பெருமானே!", "மருவு இனிய மலர்ப் பாதம், மனத்தில் வளர்ந்து உள் ௨௬௧,\nதெருவுதொறும் மிக அலறி, சிவபெருமான்' என்று ஏத்தி,\nபருகிய நின் பரம் கருணைத் தடம் கடலில் படிவு ஆம் ஆறு,\nஅருள் எனக்கு, இங்கு இடைமருதே இடம் கொண்ட அம்மானே!", "நானேயோ தவம் செய்தேன்? சிவாய நம' எனப் பெற்றேன்?\nதேன் ஆய், இன் அமுதமும் ஆய், தித்திக்கும் சிவபெருமான்\nதானே வந்து, எனது உள்ளம் புகுந்து, அடியேற்கு அருள் செய்தான்\nஊன் ஆரும் உயிர் வாழ்க்கை ஒறுத்து அன்றே, வெறுத்திடவே!"]], ["திருப்புலம்பல்", ["பூம் கமலத்து அவனொடு மால் அறியாத நெறியானே,\nகோங்கு அலர் சேர் குவி முலையாள் கூறா, வெண் நீறு ஆடீ,\nஓங்கு எயில் சூழ் திருவாரூர் உடையானே, அடியேன், நின்\nபூம் கழல்கள் அவை அல்லாது, எவை யாதும் புகழேனே!", "சடையானே, தழல் ஆடீ, தயங்கு மூ இலைச் சூலப்\nபடையானே, பரஞ்சோதி, பசுபத், மழ வெள்ளை\nவிடையானே, விரி பொழில் சூழ் பெருந்துறையாய், அடியேன் நான்,\nஉடையானே, உனை அல்லாது, உறு துணை மற்று அறியேனே!", "உற்றாரை யான் வேண்டேன்; ஊர் வேண்டேன்; பேர் வேண்டேன்;\nகற்றாரை யான் வேண்டேன்; கற்பனவும் இனி அமையும்;\nகுற்றாலத்து அமர்ந்து உறையும் கூத்தா! உன் குரை கழற்கே,\nகற்றாவின் மனம் போல, கசிந்து, உருக வேண்டுவனே!"]], ["குலாப் பத்து", ["ஓடும், கவந்தியுமே, உறவு' என்றிட்டு, உள் கசிந்து;\nதேடும் பொருளும் சிவன் கழலே எனத் தெளிந்து;\nகூடும், உயிரும், குமண்டையிடக் குனித்து; அடியேன்\nஆடும் குலா தில்லை ஆண்டானைக் கொண்டன்றே.", "துடி ஏர் இடுகு இடைத் தூ மொழியார் தோள் நசையால்\nசெடி ஏறு தீமைகள் எத்தனையும் செய்திடினும்,\nமுடியேன்; பிறவேன்; எனைத் தன தாள் முயங்குவித்த\nஅடியேன் குலா தில்லை ஆண்டானைக் கொண்டன்றே.", "என்பு உள் உருக்கி, இரு வினையை ஈடு அழித்து,\nதுன்பம் களைந்து, துவந்துவங்கள் தூய்மை செய்து,\nமுன்பு உள்ளவற்றை முழுது அழிய, உள் புகுந்த\nஅன்பின் குலா தில்லை ஆண்டானைக் கொண்டன்றே.", "குறியும், நெறியும், குணமும், இலாக் குழாங்கள் தமைப்\nபிறியும் மனத்தார் பிறிவு அரிய பெற்றியனை;\nசெறியும் கருத்தில் உருத்து, அமுது ஆம் சிவ பதத்தை;\nஅறியும் குலா தில்லை ஆண்டானைக் கொண்டன்றே.", "பேரும், குணமும், பிணிப்பு உறும் இப் பிறவி தனைத்\nதூரும் பரிசு, துரிசு அறுத்து, தொண்டர் எல்லாம்\nசேரும் வகையால், சிவன் கருணைத் தேன் பறாகி,\nஆரும் குலா தில்லை ஆண்டானைக் கொண்டன்றே.", "கொம்பில் அரும்பு ஆய், குவி மலர் ஆய், காய் ஆகி,\nவம்பு பழுத்து, உடலம் மாண்டு, இங்ஙன் போகாமே;\nநம்பும் என் சிந்தை நணுகும்வண்ணம், நான் அணுகும்\nஅம் பொன் குலா தில்லை ஆண்டானைக் கொண்டன்றே.", "மதிக்கும் திறல் உடைய வல் அரக்கன் தோள் நெரிய,\nமிதிக்கும் திருவடி என் தலை மேல் விற்றிருப்ப,\nகதிக்கும் பசு பாசம் ஒன்றும் இலோம்' எனக் களித்து, இங்கு\nஅதிர்க்கும் குலா தில்லை ஆண்டானைக் கொண்டன்றே.", "இடக்கும் ௧௬ முருட்டு ஏனப் பின், கானகத்தே,\nநடக்கும் திருவடி என் தலைமேல் நட்டமையால்,\nகடக்கும் திறல் ஐவர் கண்டகர் தம் வல் அரட்டை\nஅடக்கும் குலா தில்லை ஆண்டானைக் கொண்டன்றே.", "பாழ்ச் செய் விளாவி, பயன் இலியாய்க் கிடப்பேற்கு,\nகீழ்ச் செய் தவத்தால் கிளியீடு நேர்பட்டு,\nதாள் செய்ய தாமரைச் சைவனுக்கு, என் புன் தலையால்\nஆட்செய் குலா தில்லை ஆண்டானைக் கொண்டன்றே.", "கொம்மை வரி முலைக் கொம்பு அனையாள் கூறனுக்கு,\nசெம்மை மனத்தால் திருப் பணிகள் செய்வேனுக்கு,\nஇம்மை தரும் பயன் இத்தனையும் ஈங்கு ஒழிக்கும்,\nஅம்மை குலா தில்லை ஆண்டானைக் கொண்டன்றே."]], ["அற்புதப் பத்து", ["மையல் ஆய், இந்த மண்ணிடை வாழ்வு எனும் ஆழியுள் அகப்பட்டு,\nதையலார் எனும் சுழித்தலைப் பட்டு, நான் தலை தடுமாறாமே,\nபொய் எலாம் விட, திருவருள் தந்து, தன் பொன் அடி இணை காட்டி,\nமெய்யன் ஆய், வெளி காட்டி, முன் நின்றது ஓர் அற்புதம்\nவிளம்பேனே!", "ஏய்ந்த மா மலர் இட்டு, முட்டாதது ஓர் இயல்பொடும் வணங்காதே,\nசாந்தம் ஆர் முலைத் தையல் நல்லாரொடும் தலை தடுமாறு ஆகி,\nபோந்து, யான் துயர் புகாவணம் அருள்செய்து, பொன் கழல் இணை\nகாட்ட,\nவேந்தன் ஆய், வெளியே, என் முன் நின்றது ஓர் அற்புதம்\nவிளம்பனே!", "நடித்து, மண்ணிடை; பொய்யினைப் பல செய்து; நான், எனது, எனும்\nமாயம்\nகடித்த வாயிலே நின்று; முன் வினை மிகக் கழறியே திரிவேனை,\nபிடித்து, முன் நின்று, அப் பெரு மறை தேடிய அரும் பொருள்,\nஅடியேனை\nஅடித்து அடித்து, அக்காரம் முன் தீற்றிய அற்புதம் அறியேனே!", "பொருந்தும் இப் பிறப்பு, இறப்பு இவை நினையாது; பொய்களே\nபுகன்று போய்;\nகரும் குழலினார் கண்களால் ஏறுண்டு; கலங்கியே கிடப்பேனை;\nதிருந்து சேவடிச் சிலம்பு அவை சிலம்பிட, திருவொடும் அகலாதே,\nஅரும் துணைவன் ஆய், ஆண்டுகொண்டு, அருளிய அற்புதம்\nஅறியேனே!", "மாடும், சுற்றமும், மற்று உள போகமும், மங்கையர் தம்மோடும்\nகூடி, அங்குள குணங்களால் ஏறுண்டு, குலாவியே திரிவேனை,\nவிடு தந்து, என் தன் வெம் தொழில் விட்டிட, மென் மலர்க் கழல்\nகாட்ட,\nஆ௫டவித்து, எனது அகம் புகுந்து, ஆண்டது ஓர் அற்புதம் அறியேனே!\nவணங்கும் இப் பிறப்பு, இறப்பு இவை நினையாது, மங்கையர்", "தம்மோடும்\nபிணைந்து, வாய் இதழ்ப் பெரு வெள்ளத்து அழுந்தி, நான்\nபித்தனாய்த் திரிவேனை,\nகுணங்களும், குறிகளும், இலாக் குணக் கடல் கோமளத்தொடும்\nகூடி,\nஅணைந்து வந்து, எனை ஆண்டுகொண்டு, அருளிய அற்புதம்\nஅறியேனே!", "இப் பிறப்பினில் இணை மலர் கொய்து, நான் இயல்பொடு அஞ்சு\nஎழுத்து ஓதி,\nதப்பு இலாது பொன் கழல்களுக்கு இடாது, நான், தட முலையார்\nதங்கள்\nமைப்பு உலாம் கண்ணால், ஏறுண்டு கிடப்பேனை, மலர் அடி இணை\nகாட்ட,\nஅப்பன், என்னை, வந்து, ஆண்டுகொண்டு, அருளிய அற்புதம்\nஅறியேனே!", "ஊசல் ஆடும் இவ் உடல் உயிர் ஆயின இரு வினை அறுத்து,\nஎன்னை,\nஓசையால் உணர்வார்க்கு உணர்வு அரியவன், உணர்வு தந்து, ஒளி\nஆக்கி,\nபாசம் ஆனவை பற்று அறுத்து, உயர்ந்த தன் பரம் பெரும்\nகருணையால்\nஆசை தீர்த்து, அடியார் அடிக் கூட்டிய அற்புதம் அறியேனே!", "பொச்சை ஆன இப் பிறவியில் கிடந்து, நான், புழுத்து அலை\nநாய்போல,\nஇச்சை ஆயின ஏழையர்க்கே செய்து, அங்கு இணங்கியே\nதிரிவேனை,\nவிச்சகத்து, அரி, அயனும் எட்டாத, தன் விரை மலர்க் கழல் காட்டி,\nஅச்சன், என்னையும் ஆண்டுகொண்டு, அருளிய அற்புதம்\nஅறியேனே!", "செறியும் இப் பிறப்பு, இறப்பு இவை நினையாது, செறி குழலார்\nசெய்யும்\nகிறியும், கீழ்மையும், கெண்டை அம் கண்களும், உன்னியே\nகிடப்பேனை,\nஇறைவன், எம்பிரான், எல்லை இல்லாத தன் இணை மலர்க் கழல்\nகாட்ட,\nஅறிவு தந்து எனை ஆண்டுகொண்டு, அருளிய அற்புதம் அறியேனே!"]], ["சென்னிப் பத்து", ["தேவ தேவன், மெய்ச் சேவகன், தென் பெருந்துறை நாயகன்,\nமூவராலும் அறிஒணா, முதல் ஆய, ஆனந்த மூர்த்தியான்,\nயாவர் ஆயினும், அன்பர் அன்றி, அறிஒணா மலர்ச் சோதியான்,\nதூய மா மலர்ச் சேவடிக்கண், நம் சென்னி மன்னி, சுடருமே!", "அட்ட மூர்த்தி, அழகன், இன் அமுது ஆய ஆனந்த வெள்ளத்தான்,\nசிட்டன், மெய்ச் சிவலோக நாயகன், தென் பெருந்துறைச் சேவகன்,\nமட்டு வார் குழல் மங்கையாளை ஒர் பாகம் வைத்த அழகன் தன\nவட்ட மா மலர்ச் சேவடிக்கண், நம் சென்னி மன்னி, மலருமே!", "நங்கைமீர்! எனை நோக்குமின்; நங்கள் நாதன், நம் பணி\nகொண்டவன்,\nதெங்கு சோலைகள் சூழ் பெருந்துறை மேய சேவகன், நாயகன்,\nமங்கைமார் கையில் வளையும் கொண்டு, எம் உயிரும் கொண்டு,\nஎம் பணி கொள்வான்\nபொங்கு மா மலர்ச் சேவடிக்கண், நம் சென்னி மன்னி, பொலியுமே!", "பத்தர் சூழ, பரா பரன் பாரில் வந்து, பார்ப்பான் என,\nசித்தர் சூழ, சிவபிரான், தில்லை மூதூர் நடம் செய்வான்,\nஎத்தன் ஆகி வந்து, இல் புகுந்து எமை ஆளுங்கொண்டு, எம் பணி\nகொள்வான்\nவைத்த மா மலர்ச் சேவடிக்கண், நம் சென்னி மன்னி, மலருமே!", "மாய வாழ்க்கையை, மெய் என்று எண்ணி, மதித்திடா வகை\nநல்கினான்;\nவேய தோள் உமை பங்கன், எங்கள் திருப்பெருந்துறை மேவினான்;\nகாயத்துள் அமுது ஊற ஊற, நீ கண்டுகொள்! என்று காட்டிய\nசேய மா மலர்ச் சேவடிக்கண், நம் சென்னி மன்னி, திகழுமே!", "சித்தமே புகுந்து, எம்மை ஆட்கொண்டு, தீ வினை கெடுத்து, உய்யல்\nஆம்\nபத்தி தந்து, தன் பொன் கழல்கணே பன் மலர் கொய்து சேர்த்தலும்,\nமுத்தி தந்து, இந்த மூ உலகுக்கும் அப்புறத்து எமை வைத்திடும்\nமத்தன் மா மலர்ச் சேவடிக்கண், நம் சென்னி மன்னி, மலருமே!", "பிறவி என்னும் இக் கடலை நீந்த, தன் பேர் அருள் தந்தருளினான்;\nஅறவை என்று அடியார்கள் தங்கள் அருள் குழாம் புகவிட்டு, நல்\nஉறவு செய்து, எனை உய்யக்கொண்ட பிரான் தன் உண்மைப்\nபெருக்கம் ஆம்\nதிறமை காட்டிய சேவடிக்கண், நம் சென்னி மன்னி, திகழுமே!", "புழுவினால் பொதிந்திடு குரம்பையில் பொய் தனை ஒழிவித்திடும்\nஎழில்கொள் சோதி, எம் ஈசன், எம்பிரான், என்னுடை அப்பன்' என்று\nஎன்று,\nதொழுத கையினர் ஆகி; தூ மலர்க் கண்கள் நீர் மல்கு\nதொண்டர்க்கு,\nவழு இலா மலர்ச் சேவடிக்கண், நம் சென்னி மன்னி, மலருமே!", "வம்பனாய்த் திரிவேனை வா என்று வல் வினைப் பகை\nமாய்த்திடும்\nஉம்பரான், உலகு ஊடு அறுத்து, அப் புறத்தன் ஆய் நின்ற எம்பிரான்,\nஅன்பர் ஆனவர்க்கு அருளி, மெய் அடியார்கட்கு இன்பம்\nதழைத்திடும்\nசெம் பொன்
