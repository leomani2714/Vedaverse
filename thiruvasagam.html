<!DOCTYPE html>
<html lang="ta">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>திருவாசகம் | Thiruvasagam</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --maroon: #6b1d1d;
      --deep: #3d0f0f;
      --saffron: #e8871e;
      --gold: #d4a62a;
      --cream: #fff6e5;
      --ink: #2b1608
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      min-height: 100vh;
      font-family: 'Noto Sans Tamil', Latha, 'Nirmala UI', sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 50% 0, #ffe3b0, #f6b66a 55%, #d9822b);
      padding: 16px
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto
    }

    header {
      text-align: center;
      color: var(--cream);
      background: linear-gradient(160deg, var(--maroon), var(--deep));
      border: 2px solid var(--gold);
      border-radius: 18px;
      padding: 26px 16px;
      box-shadow: 0 8px 24px rgba(61, 15, 15, .35)
    }

    header h1 {
      font-family: 'Noto Serif Tamil', serif;
      font-size: clamp(2rem, 6vw, 3rem);
      color: #ffd77a;
      letter-spacing: .02em
    }

    header .parts {
      margin-top: 8px;
      font-size: .95rem;
      opacity: .9
    }

    header .author {
      margin-top: 6px;
      font-size: .9rem;
      color: #ffd77a
    }

    .sec {
      margin: 16px 0 0;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap
    }

    select {
      font: inherit;
      padding: 10px 12px;
      border-radius: 10px;
      border: 2px solid var(--gold);
      background: var(--cream);
      color: var(--deep);
      max-width: 100%
    }

    .card {
      margin-top: 16px;
      background: var(--cream);
      border: 2px solid var(--gold);
      border-radius: 18px;
      padding: 22px 18px;
      box-shadow: 0 6px 18px rgba(61, 15, 15, .25)
    }

    .card .tag {
      text-align: center;
      color: var(--maroon);
      font-weight: 600
    }

    .card .num {
      text-align: center;
      color: #8a5a10;
      font-size: .9rem;
      margin-bottom: 12px
    }

    .verse {
      font-family: 'Noto Serif Tamil', serif;
      font-size: clamp(1.1rem, 3.6vw, 1.5rem);
      line-height: 2;
      color: var(--deep);
      text-align: center;
      white-space: pre-line;
      min-height: 8em
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 16px
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 0;
      border-radius: 999px;
      padding: 11px 18px;
      color: var(--cream);
      background: linear-gradient(135deg, var(--saffron), #c4600f);
      box-shadow: 0 3px 8px rgba(0, 0, 0, .25)
    }

    button:hover:not(:disabled) {
      filter: brightness(1.1)
    }

    button:disabled {
      opacity: .45;
      cursor: default
    }

    button:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--deep);
      outline-offset: 2px
    }

    .count {
      color: var(--deep);
      font-weight: 600;
      text-align: center
    }

    .tools {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 14px
    }

    .tools button {
      background: linear-gradient(135deg, var(--maroon), var(--deep))
    }

    .tools button.on {
      background: linear-gradient(135deg, #2e7d32, #1b5e20)
    }

    footer {
      text-align: center;
      margin: 22px 0 8px;
      color: var(--deep);
      font-size: .9rem
    }

    @media(max-width:520px) {
      .nav button {
        padding: 10px 12px;
        font-size: .9rem
      }
    }
  </style>
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body>
  <div class="wrap">
    <header>
      <h1>திருவாசகம்</h1>
      <div class="parts">சிவபுராணம் முதல் அச்சோப் பதிகம் வரை | முற்றோதல்</div>
      <div class="author">ஸ்ரீ மாணிக்கவாசகர் அருளியது</div>
      <div class="sec"><select id="sel" aria-label="பகுதியைத் தேர்ந்தெடுக்கவும்"></select></div>
    </header>
    <main class="card">
      <div class="tag" id="tag"></div>
      <div class="num" id="num"></div>
      <div class="verse" id="verse" aria-live="polite"></div>
      <div class="nav">
        <button id="prev">← முந்தைய பாடல்</button>
        <div class="count" id="count"></div>
        <button id="next">அடுத்த பாடல் →</button>
      </div>
      <div class="tools">
        <button id="auto">▶️ தானாக படிக்கவும்</button>
        <button id="copy">📋 பாடலை நகல் செய்</button>
      </div>
    </main>
    <footer>திருவாசகம் - தேன் போன்ற வாசகம் | பக்தியுடன் தயாரிக்கப்பட்டது</footer>
  </div>
  <script>
    const DATA = [["சிவபுராணம்", ["நமச்சிவாய வாஅழ்க! நாதன் தாள் வாழ்க!\nஇமைப் பொழுதும் என் நெஞ்சில் நீங்காதான் தாள் வாழ்க!\nகோகழி ஆண்ட குருமணி தன் தாள் வாழ்க!\nஆகமம் ஆகிநின்று அண்ணிப்பான் தாள் வாழ்க!\nஏகன், அநேகன், இறைவன், அடி வாழ்க!", "வேகம் கெடுத்து ஆண்ட வேந்தன் அடி வெல்க!\nபிறப்பு அறுக்கும் பிஞ்ஞகன் தன் பெய் கழல்கள் வெல்க!\nபுறத்தார்க்குச் சேயோன் தன் பூம் கழல்கள் வெல்க!\nகரம் குவிவார் உள் மகிழும் கோன் கழல்கள் வெல்க!\nசிரம் குவிவார் ஓங்குவிக்கும் சீரோன் கழல் வெல்க! ?", "ஈசன் அடி போற்றி! எந்தை அடி போற்றி!\nதேசன் அடி போற்றி! சிவன் சேவடி போற்றி!\nநேயத்தே நின்ற நிமலன் அடி போற்றி!\nமாயப் பிறப்பு அறுக்கும் மன்னன் அடி போற்றி!\nசீர் ஆர் பெருந்துறை நம் தேவன் அடி போற்றி!\nஆராத இன்பம் அருளும் மலை போற்றி!", "சிவன், அவன் என் சிந்தையுள் நின்ற அதனால்,\nஅவன் அருளாலே அவன் தாள் வணங்கி,\nசிந்தை மகிழ, சிவபுராணம் தன்னை,\nமுந்தை வினை முழுதும் ஓய, ப்பன் யான்:\nகண்ணுதலான், தன் கருணைக் கண் காட்ட, வந்து எய்தி,\nஎண்ணுதற்கு எட்டா எழில் ஆர் கழல் இறைஞ்சி;", "விண் நிறைந்து, மண் நிறைந்து, மிக்காய், விளங்கு ஒளியாய்!\nஎண் இறந்து, எல்லை இலாதானே! நின் பெரும் சீர்,\nபொல்லா வினையேன், புகழும் ஆறு ஒன்று அறியேன்;", "புல் ஆகி, பூடு ஆய், புழு ஆய், மரம் ஆகி,\nபல் விருகம் ஆகி, பறவை ஆய், பாம்பு ஆகி,\nகல் ஆய், மனிதர் ஆய், பேய் ஆய், கணங்கள் ஆய்,\nவல் அசுரர் ஆகி, முனிவர் ஆய், தேவர் ஆய்,\nசெல்லாஅ நின்ற இத் தாவர சங்கமத்துள்,\nஎல்லாப் பிறப்பும் பிறந்து இளைத்தேன்; எம்பெருமான்!\nமெய்யே, உன் பொன் அடிகள் கண்டு, இன்று வீடு உற்றேன்;", "உய்ய, என் உள்ளத்துள், ஓங்காரம் ஆய் நின்ற\nமெய்யா! விமலா! விடைப் பாகா! வேதங்கள்\n\"ஐயா” என, ஓங்கி, ஆழ்ந்து, அகன்ற, நுண்ணியனே!", "வெய்யாய்! தணியாய்! இயமானன் ஆம் விமலா!\nபொய் ஆயின எல்லாம் போய் அகல, வந்தருளி,\nமெய்ஞ்ஞானம் ஆகி, மிளிர்கின்ற மெய்ச் சுடரே!\nஎஞ்ஞானம் இல்லாதேன் இன்பப் பெருமானே!\nஅஞ்ஞானம் தன்னை அகல்விக்கும் நல் அறிவே!", "ஆக்கம், அளவு, இறுதி, இல்லாய்! அனைத்து உலகும்\nஆக்குவாய், காப்பாய், அழிப்பாய், அருள் தருவாய்,\nபோக்குவாய், என்னைப் புகுவிப்பாய் நின் தொழும்பில்;\nநாற்றத்தின் நேரியாய்! சேயாய்! நணியானே!\nமாற்றம், மனம், கழிய நின்ற மறையோனே!\nகறந்த பால், கன்னலொடு, நெய் கலந்தால் போலச்\nசிறந்து, அடியார் சிந்தனையுள் தேன் ஊறிநின்று,\nபிறந்த பிறப்பு அறுக்கும் எங்கள் பெருமான்!", "நிறங்கள் ஓர் ஐந்து உடையாய்! விண்ணோர்கள் ஏத்த\nமறைந்து இருந்தாய், எம்பெருமான்! வல்வினையேன் தன்னை\nமறைந்திட மூடிய மாய இருளை,\nஅறம், பாவம், என்னும் அரும் கயிற்றால் கட்டி,\nபுறம் தோல் போர்த்து, எங்கும் புழு அழுக்கு மூடி,\nமலம் சோரும் ஒன்பது வாயில் குடிலை\nமலங்க, புலன் ஐந்தும் வஞ்சனையைச் செய்ய,\nவிலங்கு மனத்தால், விமலா! உனக்குக்\nகலந்த அன்பு ஆகி, கசிந்து உள் உருகும்\nநலம் தான் இலாத சிறியேற்கு நல்கி,\nநிலம் தன் மேல் வந்தருளி, நீள் கழல்கள் காஅட்டி,\nநாயின் கடையாய்க் கிடந்த அடியேற்கு,\nதாயின் சிறந்த தயா ஆன தத்துவனே!", "மாசு அற்ற சோதி மலர்ந்த மலர்ச் சுடரே!\nதேசனே! தேன் ஆர் அமுதே! சிவபுரனே!\nபாசம் ஆம் பற்று அறுத்து, பாரிக்கும் ஆரியனே!\nநேச அருள் புரிந்து நெஞ்சில் வஞ்சம் கெட,\nபேராது நின்ற பெரும் கருணைப் பேர் ஆறே!\nஆரா அமுதே! அளவு இலாப் பெம்மானே!\nஓராதார் உள்ளத்து ஒளிக்கும் ஒளியானே!\nநீராய் உருக்கி, என் ஆர் உயிர் ஆய் நின்றானே!\nஇன்பமும் துன்பமும் இல்லானே! உள்ளானே!\nஅன்பருக்கு அன்பனே! யாவையும் ஆய், அல்லையும் ஆம்\nசோதியனே! துன் இருளே! தோன்றாப் பெருமையனே!\nஆதியனே! அந்தம், நடு, ஆகி, அல்லானே!\nஈர்த்து என்னை, ஆட்கொண்ட எந்தை பெருமானே!\nகூர்த்த மெய்ஞ்ஞானத்தால் கொண்டு உணர்வார் தம் கருத்தின்\nநோக்கு அரிய நோக்கே! நுணுக்கு அரிய நுண் உணர்வே!\nபோக்கும், வரவும், புணர்வும், இலாப் புண்ணியனே!\nகாக்கும் எம் காவலனே! காண்பு அரிய பேர் ஒளியே!\nஆற்று இன்ப வெள்ளமே! அத்தா! மிக்காய்! நின்ற\nதோற்றச் சுடர் ஒளி ஆய், சொல்லாத நுண் உணர்வு ஆய்,\nமாற்றம் ஆம் வையகத்தின் வெவ்வேறே வந்து, அறிவு ஆம்\nதேற்றனே! தேற்றத் தெளிவே! என் சிந்தனையுள்\nஊற்று ஆன உண் ஆர் அமுதே! உடையானே!", "வேற்று விகார விடக்கு உடம்பின் உள் கிடப்ப\nஆற்றேன்; \"எம் ஐயா,\" \"அரனே! ஓ!” என்று என்று\nபோற்றி, புகழ்ந்திருந்து, பொய் கெட்டு, மெய் ஆனார்\nமீட்டு இங்கு வந்து, வினைப் பிறவி சாராமே,\nகள்ளப் புலக் குரம்பை கட்டழிக்க வல்லானே!\nநள் இருளில் நட்டம் பயின்று ஆடும் நாதனே!\nதில்லையுள் கூத்தனே! தென்பாண்டி நாட்டானே!\nஅல்லல் பிறவி அறுப்பானே! ஓ!' என்று,\nசொல்லற்கு அரியானைச் சொல்லி, திருவடிக் கீழ்ச்\nசொல்லிய பாட்டின் பொருள் உணர்ந்து சொல்லுவார்\nசெல்வர் சிவபுரத்தின் உள்ளார் சிவன் அடிக் கீழ்,\nபல்லோரும் ஏத்தப் பணிந்து."]], ["கீர்த்தித் திருஅகவல்", ["தில்லை மூதூர் ஆடிய திருவடி\nபல் உயிர் எல்லாம் பயின்றனன் ஆகி,\nஎண் இல் பல் குணம் எழில் பெற விளங்கி,\nமண்ணும், விண்ணும், வானோர் உலகும்,\nதுன்னிய கல்வி தோற்றியும், அழித்தும்,\nஎன்னுடை இருளை ஏறத் துரந்தும்,\nஅடியார் உள்ளத்து அன்பு மீதூரக்\nகுடியாக் கொண்ட கொள்கையும், சிறப்பும்,", "மன்னும் மா மலை மயேந்திரம் அதனில்\nசொன்ன ஆகமம் தோற்றுவித்து அருளியும்;", "கல்லாடத்துக் கலந்து, இனிது அருளி,\nநல்லாளோடு நயப்புறவு எய்தியும்;", "பஞ்சப்பள்ளியில் பால்மொழி தன்னொடும்,\nஎஞ்சாது ஈண்டும் இன் அருள் விளைத்தும்;", "கிராத வேடமொடு கிஞ்சுக வாயவள்\nவிராவு கொங்கை நல் தடம் படிந்தும்;", "கேவேடர் ஆகி, கெளிறு அது படுத்தும்;\nமா வேட்டு ஆகிய ஆகமம் வாங்கியும்;", "மற்று, அவை தம்மை மயேந்திரத்து இருந்து\nஉற்ற ஐம் முகங்களால் பணித்தருளியும்;", "நந்தம்பாடியில் நான்மறையோன் ஆய்,\nஅந்தம் இல் ஆரியன் ஆய், அமர்ந்தருளியும்;", "வேறு வேறு உருவும், வேறு வேறு இயற்கையும்,\nநூறு நூறு ஆயிரம் இயல்பினது ஆகி,\nஏறு உடை ஈசன், இப் புவனியை உய்ய,\nகூறு உடை மங்கையும் தானும் வந்தருளி,", "குதிரையைக் கொண்டு, குடநாடு அதன்மிசை,\nசதிர்பட, சாத்து ஆய், தான் எழுந்தருளியும்;", "வேலம்புத்தூர் விட்டேறு அருளி,\nகோலம் பொலிவு காட்டிய கொள்கையும்;", "தர்ப்பணம் அதனில் சாந்தம்புத்தூர்\nவில் பொரு வேடற்கு ஈந்த விளைவும்;", "மொக்கணி அருளிய முழுத் தழல் மேனி\nசொக்கது ஆகக் காட்டிய தொன்மையும்;", "அரியொடு பிரமற்கு அளவு அறி ஒண்ணான்\nநரியைக் குதிரை ஆக்கிய நன்மையும்;", "ஆண்டுகொண்டு அருள அழகு உறு திருவடி\nபாண்டியன் தனக்குப் பரிமா விற்று,\nஈண்டு கனகம் இசையப் பெறாஅது,\nஆண்டான் அங்கு ஓர் அருள்வழி இருப்ப,\nதூண்டு சோதி தோற்றிய தொன்மையும்;", "அந்தணன் ஆகி, ஆண்டுகொண்டு அருளி,\nஇந்திர ஞாலம் காட்டிய இயல்பும்;", "மதுரைப் பெரு நல் மா நகர் இருந்து,\nகுதிரைச் சேவகன் ஆகிய கொள்கையும்;", "ஆங்கு, அது தன்னில், அடியவட்கு ஆக,\nபாங்காய் மண் சுமந்தருளிய பரிசும்;", "உத்தரகோசமங்கையுள் இருந்து,\nவித்தக வேடம் காட்டிய இயல்பும்;", "பூவணம் அதனில் பொலிந்து, இனிது அருளி,\nதூ வண மேனி காட்டிய தொன்மையும்;", "வாதவூரினில் வந்து, இனிது அருளி,\nபாதச் சிலம்பு ஒலி காட்டிய பண்பும்;", "திரு ஆர் பெருந்துறைச் செல்வன் ஆகி,\n௧௬ ஆர் சோதியில் கரந்த கள்ளமும்;", "பூவலம் அதனில் பொலிந்து, இனிது அருளி,\nபாவம் நாசம் ஆக்கிய பரிசும்;", "தண்ணீர்ப் பந்தர் சயம் பெற வைத்து,\nநல் நீர்ச் சேவகன் ஆகிய நன்மையும்;\nவிருந்தினன் ஆகி, வெண்காடு அதனில்,", "குருந்தின் கீழ், அன்று, இருந்த கொள்கையும்;\nபட்டமங்கையில் பாங்காய் இருந்து, அங்கு", "அட்ட மா சித்தி அருளிய அதுவும்;\nவேடுவன் ஆகி, வேண்டு உருக் கொண்டு,", "காடு அது தன்னில், கரந்த கள்ளமும்;\nமெய்க்காட்டிட்டு, வேண்டு உருக் கொண்டு,", "தக்கான் ஒருவன் ஆகிய தன்மையும்;\nஓரியூரில் உகந்து, இனிது அருளி,", "பார் இரும் பாலகன் ஆகிய பரிசும்;\nபாண்டூர் தன்னில் ஈண்ட இருந்தும்;", "தேவூர்த் தென்பால் திகழ்தரு தீவில்", "கோ ஆர் கோலம் கொண்ட கொள்கையும்;\nதேன் அமர் சோலைத் திருவாரூரில்", "ஞானம் தன்னை நல்கிய நன்மையும்;\nஇடைமருது அதனில் ஈண்ட இருந்து,", "படிமப் பாதம் வைத்த அப் பரிசும்;\nஏகம்பத்தில் இயல்பாய் இருந்து,", "பாகம் பெண்ணோடு ஆயின பரிசும்;", "திருவாஞ்சியத்தில் சீர் பெற இருந்து,\nமரு ஆர் குழலியொடு மகிழ்ந்த வண்ணமும்;", "சேவகன் ஆகி, திண் சிலை ஏந்தி,\nபாவகம் பல பல காட்டிய பரிசும்;", "கடம்பூர் தன்னில் இடம் பெற இருந்தும்;", "ஈங்கோய் மலையில் எழில் அது காட்டியும்;", "ஐயாறு அதனில் சைவன் ஆகியும்;", "துருத்தி தன்னில் அருத்தியோடு இருந்தும்;", "திருப்பனையூரில் விருப்பன் ஆகியும்;", "கழுமலம் அதனில் காட்சி கொடுத்தும்;", "கழுக்குன்று அதனில் வழுக்காது இருந்தும்;", "புறம்பயம் அதனில் அறம் பல அருளியும்;", "குற்றாலத்துக் குறியாய் இருந்தும்;", "அந்தம் இல் பெருமை அழல் உருக் கரந்து,\nசுந்தர வேடத்து ஒரு முதல் உருவு கொண்டு,\nஇந்திர ஞாலம் போல வந்தருளி,\nஎவெவர் தன்மையும் தன்வயின் படுத்து,\nதானே ஆகிய தயாபரன், எம் இறை,\nசந்திரதீபத்து, சாத்திரன் ஆகி,\nஅந்தரத்து இழிந்து வந்து, அழகு அமர் பாலையுள்\nசுந்தரத் தன்மையொடுூ துதைந்து, இருந்தருளியும்;", "மந்திர மா மலை மயேந்திர வெற்பன்,\nஅந்தம் இல் பெருமை அருள் உடை அண்ணல்,\nஎம்தமை ஆண்ட பரிசுஅது பகரில்\nஆற்றல் அது உடை, அழகு அமர் திரு ௨௬,\nநீற்றுக் கோடி நிமிர்ந்து, காட்டியும்;", "ஊனம் தன்னை ஒருங்கு உடன் அறுக்கும்\nஆனந்தம்மே, ஆறா அருளியும்;", "மாதில் கூறு உடை மாப் பெரும் கருணையன்\nநாதப் பெரும்பறை நவின்று கறங்கவும்;", "அழுக்கு அடையாமல் ஆண்டூகொண்டருள்பவன்\nகழுக்கடை தன்னைக் கைக்கொண்டருளியும்;", "மூலம் ஆகிய மும் மலம் அறுக்கும்,\nதூய மேனி, சுடர்விடு சோதி\nகாதலன் ஆகி, கழுநீர் மாலை\nஏல்வு உடைத்து ஆக, எழில் பெற, அணிந்தும்;", "அரியொடு பிரமற்கு அளவு அறியாதவன்\nபரிமாவின்மிசைப் பயின்ற வண்ணமும்;", "மீண்டு வாரா வழி அருள் புரிபவன்\nபாண்டி நாடே பழம் பதி ஆகவும்,", "பத்தி செய் அடியரைப் பரம்பரத்து உய்ப்பவன்\nஉத்தரகோசமங்கை ஊர் ஆகவும்,", "ஆதிமூர்த்திகட்கு அருள்புரிந்தருளிய\nதேவ தேவன் திருப் பெயர் ஆகவும்,\nஇருள் கடிந்தருளிய இன்ப ஊர்தி\nஅருளிய பெருமை அருள் மலை ஆகவும்,", "எப் பெரும் தன்மையும், எவெவர் திறனும்,\nஅப் பரிசு அதனால் ஆண்டுகொண்டருளி;", "நாயினேனை நலம் மலி தில்லையுள்,\nகோலம் ஆர்தரு பொதுவினில், வருக! என,\nஏல, என்னை ஈங்கு ஒழித்தருளி;\nஅன்று உடன் சென்ற அருள் பெறும் அடியவர்\nஒன்ற ஒன்ற, உடன் கலந்தருளியும்;", "எய்த வந்திலாதார் எரியில் பாயவும்,\nமால் அது ஆகி, மயக்கம் எய்தியும்,\nபூதலம் அதனில் புரண்டு வீழ்ந்து அலறியும்,\nகால் விசைத்து ஓடி, கடல் புக மண்டி,\nநாத! நாத! என்று அழுது அரற்றி,\nபாதம் எய்தினர் பாதம் எய்தவும்;\nபதஞ்சலிக்கு அருளிய பரம நாடக' என்று\nஇதம் சலிப்பு எய்தநின்று ஏங்கினர் ஏங்கவும்;", "எழில் பெறும் இமயத்து இயல்பு உடை அம் பொன்\nபொலிதரு புலியூர்ப் பொதுவினில், நடம் நவில்\nகனிதரு செவ் வாய் உமையொடு, காளிக்கு,\nஅருளிய திருமுகத்து, அழகு உறு சிறு நகை,\nஇறைவன், ஈண்டிய அடியவரோடும்,\nபொலிதரு புலியூர்ப் புக்கு, இனிது அருளினன்\nஒலிதரு கைலை உயர் கிழவோனே."]], ["திருஅண்டப் பகுதி", ["அண்டப் பகுதியின் உண்டைப் பிறக்கம்,\nஅளப்புஅரும் தன்மை, வளப் பெரும் காட்சி\nஒன்றனுக்கு ஒன்று நின்ற எழில் பகரின்\nநூற்று ஒரு கோடியின் மேற்பட விரிந்தன;\nஇல் நுழை கதிரின் துன் அணுப் புரைய,\nசிறிய ஆகப் பெரியோன். தெரியின்", "வேதியன் தொகையொடு மால் அவன் மிகுதியும்,\nதோற்றமும், சிறப்பும், ஈற்றொடு புணரிய\nமாப் பேர் ஊழியும், நீக்கமும், நிலையும்,\nசூக்கமொடு, தூலத்து, தறை மாருதத்து\nஎறியது வளியின்\nகொட்கப் பெயர்க்கும் குழகன்:", "முழுவதும்\nபடைப்போன் படைக்கும் பழையோன்; படைத்தவை\nகாப்போன் காக்கும் கடவுள்; காப்பவை\nகரப்போன்; கரப்பவை கருதாக்\nகருத்துடைக் கடவுள்; திருத்தகும்\nஅறுவகைச் சமயத்து அறுவகையோர்க்கும்\nவீடு பேறு ஆய், நின்ற விண்ணோர் பகுதி\nகீடம் புரையும் கிழவோன்; நாள்தொறும்\nஅருக்கனில் சோதி அமைத்தோன்; திருத்தகு\nமதியில் தண்மை வைத்தோன்; திண் திறல்\nதீயில் வெம்மை செய்தோன்; பொய் தீர்\nவானில் கலப்பு வைத்தோன்; மேதகு\nகாலில் ஊக்கம் கண்டோன்; நிழல் திகழ்\nநீரில் இன்சுவை நிகழ்ந்தோன்; வெளிப்பட\nமண்ணில் திண்மை வைத்தோன் என்று என்று,\nஎனைப் பல கோடி, எனைப் பல பிறவும்,\nஅனைத்துஅனைத்து, அவ்வயின் அடைத்தோன். அஃதான்று\nமுன்னோன் காண்க! முழுதோன் காண்க!\nதன் நேர் இல்லோன் தானே காண்க!\nஏனத் தொல் எயிறு அணிந்தோன் காண்க!\nகானப் புலி உரி அரையோன் காண்க!\nநீற்றோன் காண்க! நினைதொறும், நினைதொறும்,\nஆற்றேன் காண்க! அந்தோ! கெடுவேன்!\nஇன் இசை வீணையில் இசைந்தோன் காண்க!\nஅன்னது ஒன்று அவ்வயின் அறிந்தோன் காண்க!\nபரமன் காண்க! பழையோன் காண்க!\nபிரமன், மால், காணாப் பெரியோன் காண்க!\nஅற்புதன் காண்க! அநேகன் காண்க!\nசொல் பதம் கடந்த தொல்லோன் காண்க!\nசித்தமும் செல்லாச் சேட்சியன் காண்க!\nபத்தி வலையில் படுவோன் காண்க!\nஒருவன் என்னும் ஒருவன் காண்க!\nவிரி பொழில் முழுதாய் விரிந்தோன் காண்க!\nஅணுத் தரும் தன்மையில் ஐயோன் காண்க!\nஇணைப்பு அரும் பெருமை ஈசன் காண்க!\nஅரியதில் அரிய அரியோன் காண்க!\nமருவி எப் பொருளும் வளர்ப்போன் காண்க!\nநூல் உணர்வு உணரா நுண்ணியோன் காண்க!\nமேலொடு, கீழாய், விரிந்தோன் காண்க!\nஅந்தமும், ஆதியும், அகன்றோன் காண்க!\nபந்தமும், விடும், படைப்போன் காண்க!\nநிற்பதும், செல்வதும், ஆனோன் காண்க!\nகற்பமும், இறுதியும், கண்டோன் காண்க!\nயாவரும் பெற உறும் ஈசன் காண்க!\nதேவரும் அறியாச் சிவனே காண்க!\nபெண், ஆண், அலி, எனும் பெற்றியன் காண்க!", "கண்ணால் யானும் கண்டேன் காண்க!\nஅருள் நனி சுரக்கும் அமுதே காண்க!\nகருணையின் பெருமை கண்டேன் காண்க!\nபுவனியில் சேவடி தீண்டினன் காண்க!\nசிவன் என யானும் தேறினன் காண்க!\nஅவன் எனை ஆட்கொண்டு அருளினன் காண்க!\nகுவளைக் கண்ணி கூறன் காண்க!\nஅவளும், தானும், உடனே காண்க!", "பரம ஆனந்தப் பழம் கடல் அதுவே\n௧௬ மா முகிலின் தோன்றி,\nதிரு ஆர் பெருந்துறை வரையில் ஏறி,\nதிருத்தகு மின் ஒளி திசை திசை விரிய,\nஐம் புலப் பந்தனை வாள் அரவு இரிய,\nவெம் துயர்க் கோடை மாத் தலை கரப்ப,\nநீடு எழில் தோன்றி, வாள் ஒளி மிளிர,\nஎம் தம் பிறவியில் கோபம் மிகுத்து,\nமுரசு எறிந்து, மாப் பெரும் கருணையின் முழங்கி,\nபூப் புரை அஞ்சலி காந்தள் காட்ட,\nஎஞ்சா இன் அருள் நுண் துளி கொள்ள,\nசெம் சுடர் வெள்ளம் திசை திசை தெவிட்ட, வரை உறக்\nகேதக் குட்டம் கையற ஓங்கி,\nஇரு முச் சமயத்து ஒரு பேய்த்தேரினை,\nநீர் நசை தரவரும், நெடும் கண், மான் கணம்\nதவப் பெரு வாயிடைப் பருகி, தளர்வொடும்,\nஅவப் பெரும் தாபம் நீங்காது அசைந்தன;\nஆயிடை, வானப் பேர் யாற்று அகவயின்\nபாய்ந்து எழுந்து, இன்பப் பெரும் சுழி கொழித்து,\nசுழித்து, எம் பந்த மாக் கரை பொருது, அலைத்து, இடித்து,\nஊழ் ஊழ் ஓங்கிய நங்கள்\nஇரு வினை மா மரம் வேர் பறித்து, எழுந்து\nஉருவ, அருள் நீர் ஓட்டா, அரு வரைச்\nசந்தின் வான் சிறை கட்டி, மட்டு அவிழ்\nவெறி மலர்க் குளவாய் கோலி, நிறை அகில்\nமாப் புகைக் கரை சேர் வண்டு உடைக் குளத்தின்\nமீக்கொள, மேல் மேல் மகிழ்தலின், நோக்கி,\nஅருச்சனை வயலுள் அன்பு வித்து இட்டு,\nதொண்ட உழவர் ஆரத் தந்த\nஅண்டத்து அரும் பெறல் மேகன், வாழ்க!", "கரும் பணக் கச்சைக் கடவுள், வாழ்க!\nஅரும் தவர்க்கு அருளும் ஆதி, வாழ்க!\nஅச்சம் தவிர்த்த சேவகன், வாழ்க!\nநிச்சலும் ஈர்த்து ஆட்கொள்வோன், வாழ்க!\nசூழ் இரும் துன்பம் துடைப்போன், வாழ்க!\nஎய்தினர்க்கு ஆர் அமுது அளிப்போன், வாழ்க!\nகூர் இருள் கூத்தொடு குனிப்போன், வாழ்க!\nபேர் அமைத் தோளி காதலன், வாழ்க!\nஏதிலர்க்கு ஏதில் எம் இறைவன், வாழ்க!\nகாதலர்க்கு எய்ப்பினில் வைப்பு, வாழ்க!", "நச்சு அரவு ஆட்டிய நம்பன், போற்றி!\nபிச்சு எமை ஏற்றிய பெரியோன், போற்றி!\nநீற்றொடு தோற்ற வல்லோன், போற்றி நால் திசை\nநடப்பன நடாஅய், கிடப்பன கிடாஅய்,\nநிற்பன நிறிஇ,சொல் பதம் கடந்த தொல்லோன்;\nஉள்ளத்து உணர்ச்சியில் கொள்ளவும் படாஅன்;\nகண் முதல் புலனால் காட்சியும் இல்லோன்;\nவிண் முதல் பூதம் வெளிப்பட வகுத்தோன்;\nபூவில் நாற்றம் போன்று உயர்ந்து, எங்கும்\nஒழிவு அற நிறைந்து, மேவிய பெருமை;", "இன்று எனக்கு எளிவந்து, அருளி,\nஅழிதரும் ஆக்கை ஒழியச் செய்த ஒண் பொருள்;\nஇன்று எனக்கு எளிவந்து, இருந்தனன் போற்றி!\nஅளிதரும் ஆக்கை செய்தோன், போற்றி!\nஊற்றிருந்து உள்ளம் களிப்போன், போற்றி!\nஆற்றா இன்பம் அலர்ந்து அலை செய்ய,\nபோற்றா ஆக்கையைப் பொறுத்தல் புகலேன்:", "மரகதக் குவாஅல், மா மணிப் பிறக்கம்,\nமின் ஒளி கொண்ட பொன் ஒளி திகழ,\nதிசைமுகன் சென்று தேடினர்க்கு ஒளித்தும்;\nமுறையுளி ஒற்றி முயன்றவர்க்கு ஒளித்தும்;\nஒற்றுமை கொண்டு நோக்கும் உள்ளத்து\nஉற்றவர் வருந்த, உறைப்பவர்க்கு ஒளித்தும்;\nமறைத் திறம் நோக்கி வருந்தினர்க்கு ஒளித்தும்;\nஇத் தந்திரத்தில் காண்டும்' என்று இருந்தோர்க்கு,\nஅத் தந்திரத்தில், அவ்வயின், ஒளித்தும்;\nமுனிவு அற நோக்கி, நனி வரக் கெளவி,\nஆண் எனத் தோன்றி, அலி எனப் பெயர்ந்து,\nவாள் நுதல் பெண் என ஒளித்தும்; சேண் வயின்,\nஐம் புலன் செல விடுத்து, அரு வரைதொறும் போய்,\nதுற்றவை துறந்த வெற்று உயிர் ஆக்கை\nஅரும் தவர் காட்சியுள் திருந்த ஒளித்தும்;\nஒன்று உண்டு, இல்லை, என்ற அறிவு ஒளித்தும்;\nபண்டே பயில்தொறும், இன்றே பயில்தொறும்,\nஒளிக்கும் சோரனைக் கண்டனம்;\nஆர்மின்! ஆர்மின்! நாள் மலர்ப் பிணையலில்\nதாள் தளை இடூமின்!\nசுற்றுமின்! சூழ்மின்! தொடர்மின்! விடேன்மின்!\nபற்றுமின்!' என்றவர் பற்று முற்று ஒளித்தும்;", "தன் நேர் இல்லோன் தானே ஆன தன்மை\nஎன் நேர் அனையார் கேட்க வந்து இயம்பி,\nஅறை கூவி, ஆட்கொண்டருளி,\nமறையோர் கோலம் காட்டி அருளலும்;\nஉலையா அன்பு என்பு உரக, ஓலம் இட்டு,\nஅலை கடல் திரையின் ஆர்த்து ஆர்த்து ஓங்கி,\nதலை தடமாறா வீற்ந்து, புரண்டு அலறி,\nபித்தரின் மயங்கி, மத்தரின் மதித்து,\nநாட்டவர் மருளவும், கேட்டவர் வியப்பவும்,\nகடக் களிறு ஏற்றாத் தடப் பெரு மதத்தின்\nஆற்றேன் ஆக, அவயவம் சுவைதரு\nகோல் தேன் கொண்டு செய்தனன்;\nஏற்றார் மூதூர் எழில் நகை எரியின்\nவீழ்வித்தாங்கு, அன்று,\nஅருள் பெரும் தீயின் அடியோம் அடிக் குடில்\nஒருத்தரும் வழாமை ஒடுக்கினன்;\nதடக் கையின் நெல்லிக்கனி எனக்கு ஆயினன்:\nசொல்லுவது அறியேன்; வாழி! முறையோ?", "தரியேன் நாயேன்; தான் எனைச் செய்தது\nதெரியேன்; ஆ! ஆ! செத்தேன்; அடியேற்கு\nஅருளியது அறியேன்; பருகியும் ஆரேன்;\nவிழுங்கியும் ஒல்லகில்லேன்:\nசெழும், தண் பால் கடல் திரை புரைவித்து,\nஉவாக் கடல் நள்ளும் நீர் உள் அகம் ததும்ப,\nவாக்கு இறந்து, அமுதம், மயிர்க்கால்தோறும்,\nதேக்கிடச் செய்தனன்; கொடியேன் ஊன் தழை\nகுரம்பைதோறும், நாய் உடல் அகத்தே\nகுரம்பு கொண்டு, இன் தேன் பாய்த்தினன்; நிரம்பிய\nஅற்புதமான அமுத தாரைகள்,\nஎற்புத் துளைதொறும், ஏற்றினன்; உருகுவது\nஉள்ளம் கொண்டு ஓர் உருச் செய்தாங்கு, எனக்கு\nஅள்ளூறு ஆக்கை அமைத்தனன்; ஒள்ளிய\nகன்னல் கனி தேர் களிறு என, கடைமுறை\nஎன்னையும் இருப்பது ஆக்கினன்; என்னில்\nகருணை வான்றேன் கலக்க\nஅருளொது பரவமு தாக்கினன்\nபிரமன்மால் அரியாப் பெற்றி யோனே."]], ["போற்றித் திருஅகவல்", ["நான்முகன் முதலா வானவர் தொழுதெழ\nஈரடி யாலே மூவுல களந்து\nநாற்றிசை முனிவரும் ஐமுலன் மலரப்\nபோற்றிச்செய் கதிர்முதித் திருநெடு மாலன்று)\nஆடிமுதி யரியும் ஆதர வதனிற்\nகதுமுரண் ஏனம் ஆகி முன்கலந்து)\nஏழ்தலம் உருவ இடந்து பின்னெய்த்து)\nஊழி முதல்வ சயசய என்று\nவழுத்தியுங் காணா மலர் அடி இணைகள்,\nவழுத்துதற்கு எளிது ஆய் வார் கடல் உலகினில்,", "யானை முதலா எறும்பு ஈறு ஆய,\nஊனம் இல், யோனியின் உள் வினை பிழைத்தும்;\nமானுடப் பிறப்பினுள், மாதா உதரத்து,\nஈனம் இல் கிருமிச் செருவினில் பிழைத்தும்;\nஒரு மதித் தான்றியின் இருமையில் பிழைத்தும்;\nஇரு மதி விளைவின் ஒருமையில் பிழைத்தும்;\nமும் மதி தன்னுள் அம் மதம் பிழைத்தும்;\nஈர் இரு திங்களில் பேர் இருள் பிழைத்தும்;\nஅஞ்சு திங்களில் முஞ்சுதல் பிழைத்தும்;", "ஆறு திங்களில் ஊறு அலர் பிழைத்தும்;\nஏழு திங்களில் தாழ் புவி பிழைத்தும்;\nஎட்டுத் திங்களில் கட்டமும் பிழைத்தும்;\nஒன்பதில் வருதரு துன்பமும் பிழைத்தும்;\nதக்க தச மதி தாயொடு தான் படும்\nதுக்க சாகரத் துயரிடைப் பிழைத்தும்;\nஆண்டுகள்தோறும் அடைந்த அக் காலை\nஈண்டியும், இருத்தியும், எனைப் பல பிழைத்தும்;\nகாலை மலமொடு, கடும் பகல் பசி, நிசி\nவேலை நித்திரை, யாத்திரை, பிழைத்தும்:\nகரும் குழல்; செவ் வாய்; வெள் நகை; கார் மயில்\nஒருங்கிய சாயல்; நெருங்கி, உள் மதர்த்து,\nகச்சு அற நிமிர்ந்து, கதிர்த்து, முன் பணைத்து,\nஎய்த்து இடை வருந்த எழுந்து, புடை பரந்து,\nஈர்க்கு இடை போகா இள முலை; மாதர் தம்\nகூர்த்த நயனக் கொள்ளையில் பிழைத்தும்:\nபித்த உலகர் பெரும் துறைப் பரப்பினுள்\nமத்தக் களிறு எனும் அவாவிடைப் பிழைத்தும்;\nகல்வி என்னும் பல் கடல் பிழைத்தும்;\nசெல்வம் என்னும் அல்லலில் பிழைத்தும்;\nநல்குரவு என்னும் தொல் விடம் பிழைத்தும்;\nபுல் வரம்பு ஆகிய பல துறை பிழைத்தும்;", "தெய்வம் என்பது ஓர் சித்தம் உண்டாகி,\nமுனிவு இலாதது ஓர் பொருள்அது கருதலும்\nஆறு கோடி மாயா சத்திகள்\nவேறு வேறு தம் மாயைகள் தொடங்கின;\nஆத்தம் ஆனார் அயலவர் கூடி,\nநாத்திகம் பேசி, நாத் தழும்பு ஏறினர்;\nசுற்றம் என்னும் தொல் பசுக் குழாங்கள்\nபற்றி அழைத்துப் பதறினர்; பெருகவும்\nவிரதமே பரம் ஆக, வேதியரும்,\nசரதம் ஆகவே, சாத்திரம் காட்டினர்;\nசமய வாதிகள் தம் தம் மதங்களே\nஅமைவது ஆக, அரற்றி, மலைந்தனர்;\nமிண்டிய மாயா வாதம் என்னும்\nசண்ட மாருதம், சுழித்து, அடித்து, ஆஅர்த்து,\nஉலோகாயதன் எனும் ஒள் திறல் பாம்பின்\nகலா பேதத்த கடு விடம் எய்தி,\nஅதில் பெரு மாயை எனைப் பல சூழவும்,", "தப்பாமே, தாம் பிடித்தது சலியா,\nதழல் அது கண்ட மெழுகு அது போல,\nதொழுது, உளம் உருகி, அழுது, உடல் கம்பித்து,\nஆடியும், அலறியும், பாடியும், பரவியும்,\nகொடிறும், பேதையும், கொண்டது விடாது' எனும்\nபடியே ஆகி, நல் இடை அறா அன்பின்,\nபசு மரத்து ஆணி அறைந்தால் போல,\nகசிவது பெருகி, கடல் என மறுகி,\nஅகம் குழைந்து, அனுகுலம் ஆய், மெய் விதிர்த்து,\nசகம் பேய்! என்று தம்மைச் சிரிப்ப,\nநாண் அது ஒழிந்து, நாடவர் பழித்துரை\nபூண் அதுவாக, கோணுதல் இன்றி,\nசதிர் இழந்து, அறி மால் கொண்டு, சாரும்\nகதியது பரம அதிசயம் ஆக,\nகற்றா மனம் எனக் கதறியும், பதறியும்,\nமற்று ஓர் தெய்வம் கனவிலும் நினையாது,\nஅரு பரத்து ஒருவன் அவனியில் வந்து,\nகுருபரன் ஆகி, அருளிய பெருமையை,\nசிறுமை என்று இகழாதே, திருவடி இணையை,\nபிறிவினை அறியா நிழல் அது போல,\nமுன் பின் ஆகி, முனியாது, அத் திசை\nஎன்பு நைந்து உருகி, நெக்கு நெக்கு ஏங்கி,\nஅன்பு எனும் ஆறு கரை அது புரள,\nநன் புலன் ஒன்றி, நாத' என்று அரற்றி,\nஉரை தடுமாறி, உரோமம் சிலிர்ப்பு,\nகர மலர் மொட்டித்து, இருதயம் மலர,\nகண் களி கூர, நுண் துளி அரும்ப,\nசாயா அன்பினை, நாள்தொறும் தழைப்பவர்\nதாயே ஆகி, வளர்த்தனை போற்றி!", "மெய் தரு வேதியன் ஆகி, வினை கெட,\nகைதர வல்ல கடவுள், போற்றி!", "ஆடக மதுரை அரசே, போற்றி!\nகூடல் இலங்கு குருமணி, போற்றி!\nதென் தில்லை மன்றினுள் ஆடி, போற்றி!\nஇன்று, எனக்கு ஆர் அமுது ஆனாய், போற்றி!", "மூவா நான்மறை முதல்வா, போற்றி!\nசே ஆர் வெல் கொடிச் சிவனே, போற்றி!", "மின் ஆர் உருவ விகிர்தா, போற்றி!\nகல் நார் உரித்த கனியே, போற்றி!", "காவாய், கனகக் குன்றே, போற்றி!\nஆ! ஆ! என் தனக்கு அருளாய், போற்றி!", "படைப்பாய், காப்பாய், துடைப்பாய், போற்றி!\nஇடரைக் களையும் எந்தாய், போற்றி!", "ஈச, போற்றி! இறைவ, போற்றி!", "தேசப் பளிங்கின் திரளே, போற்றி!", "அரைசே, போற்றி! அமுதே, போற்றி!\nவிரை சேர் சரண விகிர்தா, போற்றி!", "வேதி, போற்றி! விமலா, போற்றி!\nஆதி, போற்றி! அறிவே, போற்றி!", "கதியே, போற்றி! கனியே, போற்றி!\nநதி சேர் செம் சடை நம்பா, போற்றி!", "உடையாய், போற்றி! உணர்வே, போற்றி!\nகடையேன் அடிமை கண்டாய், போற்றி!", "ஐயா, போற்றி! அணுவே, போற்றி!\nசைவா, போற்றி! தலைவா, போற்றி!", "குறியே, போற்றி! குணமே, போற்றி!\nநெறியே, போற்றி! நினைவே, போற்றி!", "வானோர்க்கு அரிய மருந்தே, போற்றி!\nஏனோர்க்கு எளிய இறைவா, போற்றி!", "மூ ஏழ் சுற்றமும் முரண் உறு நரகிடை\nஆழாமே அருள் அரசே, போற்றி!", "தோழா, போற்றி! துணைவா, போற்றி!\nவாழ்வே, போற்றி! என் வைப்பே, போற்றி!", "முத்தா போற்றி! முதல்வா, போற்றி!\nஅத்தா, போற்றி! அரனே, போற்றி!", "உரை, உணர்வு, இறந்த ஒருவ, போற்றி!", "விரி கடல் உலகின் விளைவே, போற்றி!", "அருமையில் எளிய அழகே, போற்றி!\n௧௬ முகில் ஆகிய கண்ணே, போற்றி!", "மன்னிய திரு அருள் மலையே, போற்றி!\nஎன்னையும் ஒருவன் ஆக்கி, இரும் கழல்\nசென்னியில் வைத்த சேவக, போற்றி!", "தொழுத கை துன்பம் துடைப்பாய், போற்றி!\nவழுவு இலா ஆனந்த வாரி, போற்றி!", "அழிவதும், ஆவதும், கடந்தாய், போற்றி!\nமுழுவதும் இறந்த முதல்வா, போற்றி:", "மான் நேர் நோக்கி மணாளா, போற்றி!\nவானகத்து அமரர் தாயே, போற்றி!", "பாரிடை ஐந்தாய்ப் பரந்தாய், போற்றி!\nநீரிடை நான்காய் நிகழ்ந்தாய், போற்றி!\nதீயிடை மூன்றாய்த் திகழ்ந்தாய், போற்றி!\nவளியிடை இரண்டாய் மகிழ்ந்தாய், போற்றி!\nவெளியிடை ஒன்றாய் விளைந்தாய், போற்றி!\nஅளிபவர் உள்ளத்து அமுதே, போற்றி!", "கனவிலும் தேவர்க்கு அரியாய், போற்றி!\nநனவிலும் நாயேற்கு அருளினை, போற்றி!", "இடைமருது உறையும் எந்தாய், போற்றி!\nசடையிடைக் கங்கை தரித்தாய், போற்றி!\nஆரூர் அமர்ந்த அரசே, போற்றி!\nசீர் ஆர் திருவையாறா, போற்றி!", "அண்ணாமலை எம் அண்ணா, போற்றி!\nகண் ஆர் அமுதக் கடலே, போற்றி!\nஏகம்பத்து உறை எந்தாய், போற்றி!\nபாகம் பெண் ௨௬ ஆனாய், போற்றி!\nபராய்த்துறை மேவிய பரனே, போற்றி!\nசிராப்பள்ளி மேவிய சிவனே, போற்றி!\nமற்று ஓர் பற்று இங்கு அறியேன், போற்றி:\nகுற்றாலத்து எம் கூத்தா, போற்றி!\nகோகழி மேவிய கோவே, போற்றி!\nஈங்கோய்மலை எம் எந்தாய், போற்றி!\nபாங்கு ஆர் பழனத்து அழகா, போற்றி!\nகடம்பூர் மேவிய விடங்கா, போற்றி!", "அடைந்தவர்க்கு அருளும் அப்பா, போற்றி!\nஇத்தி தன்னின் கீழ், இரு மூவர்க்கு,\nஅத்திக்கு, அருளிய அரசே, போற்றி!\nதென் நாடு உடைய சிவனே, போற்றி!\nஎந் நாட்டவர்க்கும் இறைவா, போற்றி!", "ஏனக் குருளைக்கு அருளினை, போற்றி!\nமானக் கயிலை மலையாய், போற்றி!", "அருளிட வேண்டும் அம்மான், போற்றி!\nஇருள் கெட அருளும் இறைவா, போற்றி!", "தளர்ந்தேன், அடியேன், தமியேன், போற்றி!", "களம் கொளக் கருத அருளாய், போற்றி!", "அஞ்சேல்' என்று இங்கு அருளாய், போற்றி!\nநஞ்சே அமுதா நயத்தாய், போற்றி!", "அத்தா, போற்றி! ஐயா, போற்றி!\nநித்தா, போற்றி! நிமலா, போற்றி!\nபத்தா, போற்றி! பவனே, போற்றி!", "பெரியாய், போற்றி! பிரானே, போற்றி!\nஅரியாய், போற்றி! அமலா, போற்றி!", "மறையோர் கோல நெறியே, போற்றி!\nமுறையோ? தரியேன்! முதல்வா, போற்றி!", "உறவே, போற்றி! உயிரே, போற்றி!\nசிறவே, போற்றி! சிவமே, போற்றி!", "மஞ்சா, போற்றி! மணாளா, போற்றி!\nபஞ்சு ஏர் அடியாள் பங்கா, போற்றி!", "அலந்தேன், நாயேன், அடியேன், போற்றி!\nஇலங்கு சுடர் எம் ஈசா, போற்றி!", "கவைத்தலை மேவிய கண்ணே, போற்றி!\nகுவைப்பதி மலைந்த கோவே, போற்றி!\nமலை நாடு உடைய மன்னே, போற்றி!\nகலை ஆர் அரிகேசரியாய், போற்றி!\nதிருக்கழுக்குன்றில் செல்வா, போற்றி!\nபொருப்பு அமர் பூவணத்து அரனே, போற்றி!", "அருவமும், உருவமும், ஆனாய், போற்றி!\nமருவிய கருணை மலையே, போற்றி!", "துரியமும் இறந்த சுடரே, போற்றி!\nதெரிவு அரிது ஆகிய தெளிவே, போற்றி\nதோளா முத்தச் சுடரே, போற்றி!\nஆள் ஆனவர்கட்கு அன்பா, போற்றி!\nஆரா அமுதே, அருளே, போற்றி!\nபேர் ஆயிரம் உடைப் பெம்மான், போற்றி!\nதாளி அறுகின் தாராய், போற்றி!\nநீள் ஒளி ஆகிய நிருத்தா, போற்றி\nசந்தனச் சாந்தின் சுந்தர, போற்றி!\nசிந்தனைக்கு அரிய சிவமே, போற்றி!\nமந்திர மா மலை மேயாய், போற்றி!\nஎம் தமை உய்யக் கொள்வாய், போற்றி!\nபுலி முலை புல்வாய்க்கு அருளினை, போற்றி!\nஅலை கடல் மீமிசை நடந்தாய், போற்றி!\nகருங்குருவிக்கு அன்று அருளினை, போற்றி!\nஇரும் புலன் புலர இசைந்தனை, போற்றி!\nபடி உறப் பயின்ற பாவக, போற்றி!\nஅடியொடு, நடு, ஈறு, ஆனாய், போற்றி!\nநரகொடு, சுவர்க்கம், நால் நிலம், புகாமல்,\nபர கதி பாண்டியற்கு அருளினை, போற்றி!\nஒழிவு அற நிறைந்த ஒருவ, போற்றி!\nசெழு மலர்ச் சிவபுரத்து அரசே, போற்றி!\nகழுநீர் மாலைக் கடவுள், போற்றி!\nதொழுவார் மையல் துணிப்பாய், போற்றி!\nபிழைப்பு, வாய்ப்பு, ஒன்று அறியா நாயேன்\nகுழைத்த சொல் மாலை கொண்டருள், போற்றி!\nபுரம் பல எரித்த புராண, போற்றி!\nபரம் பரம் சோதிப் பரனே, போற்றி!\nபோற்றி! போற்றி! புயங்கப் பெருமான்!\nபோற்றி! போற்றி! புராண காரண!\nபோற்றி! போற்றி! சய, சய, போற்றி!"]], ["மெய்யுணர்தல்", ["மெய் தான் அரும்பி, விதிர்விதிர்த்து, உன் விரை ஆர் கழற்கு, என்\nகை தான் தலை வைத்து, கண்ணீர் ததும்பி, வெதும்பி, உள்ளம்\nபொய் தான் தவிர்ந்து, உன்னை, போற்றி, சய, சய, போற்றி! என்னும்\nகை தான் நெகிழவிடேன்; உடையாய்! என்னைக் கண்டுகொள்ளே.", "கொள்ளேன் புரந்தரன், மால், அயன் வாழ்வு; குடி கெடினும்,\nநள்ளேன் நினது அடியாரொடு அல்லால்; நரகம் புகினும்,\nஎள்ளேன் திரு அருளாலே இருக்கப் பெறின்; இறைவா!\nஉள்ளேன் பிற தெய்வம், உன்னை அல்லாது; எங்கள் உத்தமனே!", "உத்தமன், அத்தன், உடையான், அடியே நினைந்து உருகி,\nமத்த மனத்தொடு, மால் இவன்! என்ன, மன நினைவில்\nஒத்தன ஒத்தன சொல்லிட, ஊர் ஊர் திரிந்து, எவரும்\nதம் தம் மனத்தன பேச, எஞ்ஞான்று கொல் சாவதுவே?", "சாவ, முன் நாள், தக்கன் வேள்வித் தகர் தின்று, நஞ்சம் அஞ்சி,\nஆவ! எந்தாய்! என்று, அவிதா இடும் நம்மவர் அவரே,\nமூவர் என்றே எம்பிரானொடும் எண்ணி, விண் ஆண்டு, மண்மேல்\nதேவர் என்றே இறுமாந்து, என்ன பாவம் திரிதவரே!", "தவமே புரிந்திலன்; தண் மலர் இட்டு, முட்டாது இறைஞ்சேன்;\nஅவமே பிறந்த அரு வினையேன், உனக்கு அன்பர் உள் ஆம்\nசிவமே பெறும் திரு எய்திற்றிலேன்; நின் திருவடிக்கு ஆம்\nபவமே அருளு கண்டாய் அடியேற்கு; எம் பரம்பரனே!", "பரந்து பல் ஆய் மலர் இட்டு, முட்டாது, அடியே இறைஞ்சி,\nஇரந்த எல்லாம் எமக்கே பெறலாம்' என்னும், அன்பர் உள்ளம்\nகரந்து நில்லாக் கள்வனே! நின் தன் வார் கழற்கு அன்பு, எனக்கும்\nநிரந்தரமாய் அருளாய் நின்னை ஏத்த முழுவதுமே.", "முழுவதும் கண்டவனைப் படைத்தான், முடி சாய்த்து, முன்நாள்,\nசெழு மலர் கொண்டு எங்கும் தேட, அப்பாலன்; இப்பால், எம்பிரான்\nகழுதொடு காட்டிடை நாடகம் ஆடி, கதி இலியாய்,\nஉழுவையின் தோல் உடுத்து, உன்மத்தம் மேல்கொண்டு, உழிதருமே.", "உழிதரு காலும், கனலும், புனலொடு, மண்ணும், விண்ணும்,\nஇழிதரு காலம், எக் காலம் வருவது? வந்ததன் பின்,\nஉழிதரு கால், அத்த! உன் அடியேன் செய்த வல் வினையைக்\nகழிதரு காலமும் ஆய், அவை காத்து, எம்மைக் காப்பவனே!", "பவன், எம்பிரான், பனி மா மதிக் கண்ணி, விண்ணோர் பெருமான்,\nசிவன், எம்பிரான், என்னை ஆண்டுகொண்டான், என் சிறுமை\nகண்டும்;\nஅவன் எம்பிரான் என்ன, நான் அடியேன் என்ன, இப் பரிசே\nபுவன், எம்பிரான்! தெரியும் பரிசு ஆவது இயம்புகவே.", "புகவே தகேன் உனக்கு அன்பருள், யான்; என் பொல்லா மணியே!\nதகவே, எனை உனக்கு ஆட்கொண்ட தன்மை? எப் புன்மையரை\nமிகவே உயர்த்தி, விண்ணோரைப் பணித்தி; அண்ணா! அமுதே!\nநகவே தகும் எம்பிரான்! என்னை நீ செய்த நாடகமே."]], ["அறிவுறுத்தல்", ["நாடகத்தால் உன் அடியார்போல் நடித்து, நான் நடுவே\nவீடு அகத்தே புகுந்திடூவான், மிகப் பெரிதும் விரைகின்றேன்;\nஆடகச் சீர் மணிக் குன்றே! இடை அறா அன்பு உனக்கும் என்\nஊடு அகத்தே நின்று, உருகத் தந்தருள்; எம் உடையானே!\nயான் ஏதும் பிறப்பு அஞ்சேன்; இறப்பு அதனுக்கு என் கடவேன்?", "வானேயும் பெறில் வேண்டேன்; மண் ஆள்வான் மதித்தும் இரேன்;", "தேன் ஏயும் மலர்க் கொன்றைச் சிவனே! எம்பெருமான்! எம்\nமானே! உன் அருள் பெறும் நாள் என்று? என்றே வருந்துவனே.", "வருந்துவன், நின் மலர்ப் பாதம் அவை காண்பான்; நாய் அடியேன்\nஇருந்து நல மலர் புனையேன்; ஏத்தேன் நாத் தழும்பு ஏற;\nபொருந்திய பொன் சிலை குனித்தாய்! அருள் அமுதம் புரியாயேல்,\nவருந்துவன் அத் தமியேன்; மற்று என்னே நான் ஆம் ஆறே?", "ஆம் ஆறு, உன் திருவடிக்கே அகம் குழையேன்; அன்பு உருகேன்;\nபூமாலை புனைந்து ஏத்தேன்; புகழ்ந்து உரையேன்; புத்தேளிர்\nகோமான்! நின் திருக்கோயில் தூகேன், மெழுகேன், கூத்து ஆடேன்,\nசாம் ஆறே விரைகின்றேன் சதிராலே சார்வானே.", "வான் ஆகி, மண் ஆகி, வளி ஆகி, ஒளி ஆகி,\nஊன் ஆகி, உயிர் ஆகி, உண்மையும் ஆய், இன்மையும் ஆய்,\nகோன் ஆகி, யான், எனது என்று அவர் அவரைக் கூத்தாட்டு\nவான் ஆகி, நின்றாயை என் சொல்லி வாழ்த்துவனே!", "வாழ்த்துவதும் வானவர்கள் தாம் வாழ்வான்; மனம் நின்பால்\nதாழ்த்துவதும், தாம் உயர்ந்து, தம்மை எல்லாம் தொழவேண்டி;\nசூழ்த்து மதுகரம் முரலும் தாரோயை, நாய் அடியேன்,\nபாழ்த்த பிறப்பு அறுத்திடுவான், யானும் உன்னைப் பரவுவனே.", "பரவுவார் இமையோர்கள்; பாடூவன நால்வேதம்;\nகுரவு வார் குழல் மடவாள் கூறு உடையாள், ஒரு பாகம்;\nவிரவுவார் மெய் அன்பின் அடியார்கள், மேன்மேல்; உன்\nஅரவு வார் கழல் இணைகள் காண்பாரோ, அரியானே?", "அரியானே யாவர்க்கும்! அம்பரவா! அம்பலத்து எம்\nபெரியானே! சிறியேனை ஆட்கொண்ட பெய் கழல்கீழ்\nவிரை ஆர்ந்த மலர் தூவேன்; வியந்து அலறேன்; நயந்து உருகேன்;\nதரியேன்; நான் ஆம் ஆறு என்? சாவேன்; நான் சாவேனே!", "வேனல் வேள் மலர்க் கணைக்கும், வெள் நகை, செவ் வாய், கரிய\nபானல் ஆர் கண்ணியர்க்கும், பதைத்து உருகும் பாழ் நெஞ்சே!\nஊன் எலாம் நின்று உருக, புகுந்து ஆண்டான்; இன்று போய்\nவான் உளான்; காணாய் நீ, மாளா வாழ்கின்றாயே.", "வாழ்கின்றாய்; வாழாத நெஞ்சமே! வல் வினைப் பட்டு\nஆழ்கின்றாய்; ஆழாமல் காப்பானை ஏத்தாதே,\nசூழ்கின்றாய் கேடு உனக்கு; சொல்கின்றேன், பல்காலும்;\nவிழகின்றாய் நீ அவலக் கடல் ஆய வெள்ளத்தே."]], ["சுட்டறுத்தல்", ["வெள்ளம் தாழ் விரி சடையாய்! விடையாய்!", "விண்ணோர் பெருமானே! எனக் கேட்டு வேட்ட நெஞ்சாய்,\nபள்ளம் தாழ் உறு புனலில், கீழ் மேலாக,\nபதைத்து உருகும் அவர் நிற்க, என்னைஆண்டாய்க்கு,\nஉள்ளந்தாள் நின்று உச்சி அளவும் நெஞ்சாய்\nஉருகாதால்; உடம்பு எல்லாம் கண்ணாய், அண்ணா!\nவெள்ளம் தான் பாயாதால்; நெஞ்சம் கல் ஆம்;\nகண் இணையும் மரம் ஆம் தீவினையினேற்கே.\nவினையிலே கிடந்தேனை, புகுந்து நின்று, போது, நான்", "வினைக்கேடன்' என்பாய் போல,\nஇனையன் நான்' என்று உன்னை அறிவித்து, என்னை\nஆட்கொண்டு, எம்பிரான் ஆனாய்க்கு,இரும்பின் பாவை\nஅனைய நான், பாடேன்; நின்று ஆடேன்; அந்தோ!\nஅலறிடேன்; உலறிடேன்; ஆவி சோரேன்;\nமுனைவனே! முறையோ, நான் ஆன ஆறு?\nமுடிவு அறியேன்; முதல், அந்தம், ஆயினானே!\nஆய நான்மறையவனும் நீயே ஆதல்\nஅறிந்து, யான் யாவரினும் கடையன் ஆய\nநாயினேன் ஆதலையும் நோக்கிக் கண்டும்,\nநாதனே! நான் உனக்கு ஓர் அன்பன் என்பேன்\nஆயினேன்; ஆதலால், ஆண்டூுகொண்டாய்\nஅடியார் தாம் இல்லையே? அன்றி, மற்று ஓர்\nபேயனேன்? இது தான் நின் பெருமை அன்றே!\nஎம்பெருமான்! என் சொல்லிப் பேசுகேனே?", "பேசின், தாம் ஈசனே, எந்தாய், எந்தை\nபெருமானே! என்று என்றே பேசிப் பேசி;\nபூசின், தாம் திருநீறே நிறையப் பூசி;\nபோற்றி எம்பெருமானே! என்று; பின்றா\nநேசத்தால் பிறப்பு இறப்பைக் கடந்தார் தம்மை\nஆண்டானே! அவா வெள்ளக் கள்வனேனை,\nமாசு அற்ற மணிக் குன்றே! எந்தாய்! அந்தோ!\nஎன்னை, நீ ஆட்கொண்ட வண்ணம் தானே?", "வண்ணம் தான் சேயது அன்று; வெளிதே அன்று;\nஅநேகன்; ஏகன்; அணு; அணுவில் இறந்தாய்;என்று அங்கு\nஎண்ணம் தான் தடுமாறி, இமையோர் கூட்டம்\nஎய்தும் ஆறு அறியாத எந்தாய்! உன் தன்\nவண்ணம் தான் அது காட்டி, வடிவு காட்டி,\nமலர்க் கழல்கள் அவை காட்டி, வழிஅற்றேனை,\nதிண்ணம் தான் பிறவாமல் காத்து ஆட்கொண்டாய்;\nஎம்பெருமான்! என் சொல்லிச் சிந்திக்கேனே?", "சிந்தனை நின் தனக்கு ஆக்கி, நாயினேன் தன்\nகண் இணை நின் திருப்பாதப் போதுக்குஆக்கி,\nவந்தனையும் அம் மலர்க்கே ஆக்கி, வாக்கு, உன்\nமணி வார்த்தைக்கு ஆக்கி, ஐம்புலன்கள் ஆர\nவந்து, எனை ஆட்கொண்டு, உள்ளே புகுந்த விச்சை\nமால் அமுதப் பெரும் கடலேமலையே! உன்னைத்\nதந்தனை செம் தாமரைக் காடு அனைய மேனித்\nதனிச் சுடரே! இரண்டும் இல் இத்தனியனேற்கே.", "தனியனேன், பெரும் பிறவிப் பெளவத்து, எவ்வம்\nதடம் திரையால் எற்றுண்டு, பற்றுஒன்று இன்றி,\nகனியின் நேர் துவர் வாயார் என்னும் காலால்\nகலக்குண்டு காம வான் சுறவின் வாய்ப்பட்டு,\nஇனி, என்னே உய்யும் ஆறு? என்று என்று எண்ணி,\nஅஞ்சு எழுத்தின் புணை பிடித்துக்கிடக்கின்றேனை,\nமுனைவனே! முதல், அந்தம், இல்லா மல்லல்\nகரை காட்டி, ஆட்கொண்டாய் மூர்க்கனேற்கே.", "கேட்டு ஆரும் அறியாதான்; கேடு ஒன்று இல்லான்;\nகிளை இலான்; கேளாதே எல்லாம் கேட்டான்\nநாட்டார்கள் விழித்திருப்ப ஞாலத்துள்ளே\nநாயினுக்குத் தவிசு இட்டு, நாயினேற்கே\nகாட்டாதன எல்லாம் காட்டி, பின்னும்\nகேளாதன எல்லாம் கேட்பித்து, என்னை\nமீட்டேயும் பிறவாமல் காத்து, ஆட்கொண்டான்\nஎம்பெருமான் செய்திட்ட விச்சை தானே!", "விச்சை தான் இது ஒப்பது உண்டோ? கேட்கின்\nமிகு காதல் அடியார் தம் அடியன் ஆக்கி\nஅச்சம் தீர்த்து ஆட்கொண்டான்; அமுதம் ஊறி,\nஅகம் நெகவே புகுந்து, ஆண்டான், அன்புகூர;\nஅச்சன், ஆண், பெண், அலி, ஆகாசம், ஆகி,\nஆர் அழல் ஆய், அந்தம் ஆய், அப்பால் நின்ற\nசெச்சை மா மலர் புரையும் மேனி, எங்கள்\nசிவபெருமான், எம்பெருமான், தேவர் கோவே!", "தேவர் கோ அறியாத தேவ தேவன்;\nசெழும் பொழில்கள் பயந்து, காத்து, அழிக்கும்மற்றை\nமூவர் கோனாய் நின்ற முதல்வன்; மூர்த்தி;\nமூதாதை; மாது ஆளும் பாகத்து எந்தை;\nயாவர் கோன்; என்னையும் வந்து ஆண்டுகொண்டான்;\nயாம் ஆர்க்கும் குடி அல்லோம்; யாதும் அஞ்சோம்;\nமேவினோம் அவன் அடியார் அடியாரோடு;\nமேன் மேலும் குடைந்து ஆடி, ஆடுவோமே."]], ["ஆன்ம சுத்தி", ["ஆடுகின்றிலை; கூத்துஉடையான் கழற்கு அன்பு இலை; என்பு\nஉருகிப\nபாடுகின்றிலை; பதைப்பதும் செய்கிலை; பணிகிலை; பாத மலர்\nசூடுகின்றிலை; சூட்டுகின்றதும் இலை; துணை இலி பிண நெஞ்சே!\nதேடுகின்றிலை; தெருவுதோறு அலறிலை; செய்வது ஒன்று\nஅறியேனே.", "அறிவு இலாத எனை, புகுந்து ஆண்டுகொண்டு அறிவதை அருளி,\nமெய்ந்\nநெறி எலாம் புலம் ஆக்கிய எந்தையை, பந்தனை அறுப்பானை,\nபிறிவு இலாத இன் அருள்கள் பெற்றிருந்தும், மாறு ஆடுதி; பிண\nநெஞ்சே!\nகிறி எலாம் மிகக் கீழ்ப்படுத்தாய்; கெடுத்தாய் என்னைக் கெடுமாறே.", "மாறி நின்று எனைக் கெடக் கிடந்தனையை, எம் மதி இலி மட\nநெஞ்சே!\nதேறுகின்றிலம் இனி உனை; சிக்கெனச் சிவன் அவன் திரள்\nதோள்மேல்\nநீறு நின்றது கண்டனை; ஆயினும், நெக்கிலை; இக் காயம்\nகீறுகின்றிலை; கெடுவது உன் பரிசு இது; கேட்கவும் கில்லேனே.", "கிற்ற வா, மனமே! கெடுவாய்; உடையான் அடி நாயேனை\nவிற்று எலாம் மிக ஆள்வதற்கு உரியவன் விரை மலர்த்\nதிருப்பாதம்\nமுற்று இலா இளம் தளிர் பிரிந்து இருந்து நீ உண்டன எல்லாம்\nமுன்\nஅற்ற ஆறும் நின் அறிவும் நின் பெருமையும் அளவு\nஅறுக்கில்லேனே.", "அளவு அறுப்பதற்கு அரியவன் இமையவர்க்கு அடியவர்க்கு\nஎளியான் நம்\nகளவு அறுத்து நின்று ஆண்டமை கருத்தினுள் கசிந்து உணர்ந்து\nஇருந்தேயும்\nஉள கறுத்து உனை நினைந்து உளம் பெருங்களன் செய்த்தும்\nஇலை நெஞ்சே\nபளகு அறுத்து உடையான் கழல் பணிந்திலை பரகதி புகுவானே.", "புகுவது ஆவதும்; போதரவு இல்லதும்; பொன் நகர் புகப் போதற்கு\nஉகுவது ஆவதும்; எந்தை, எம்பிரான், என்னை ஆண்டவன் கழற்கு\nஅன்பு\nநெகுவது ஆவதும்; நித்தலும் அமுதொடு, தேனொடு, பால், கட்டி,\nமிகுவது ஆவதும்; இன்று எனின், மற்று இதற்கு என் செய்கேன்\nவினையேனே?", "வினை என்போல் உடையார் பிறர் ஆர்? உடையான், அடி\nநாயேனைத்\nதினையின் பாகமும் பிரிவது திருக்குறிப்பு அன்று; மற்று அதனாலே,\nமுனைவன் பாத நல் மலர் பிரிந்திருந்தும், நான் முட்டிலேன், தலை\nகீறேன்;\nஇனையன் பாவனை, இரும்பு; கல், மனம்; செவி, இன்னது என்று\nஅறியேனே.", "ஏனை யாவரும் எய்திடல் உற்று, மற்று இன்னது என்று அறியாத\nதேனை, ஆன் நெயை, கரும்பின் இன் தேறலை, சிவனை, என்\nசிவலோகக்\nகோனை, மான் அன நோக்கி தன் கூறனை, குறுகிலேன்; நெடும்\nகாலம்,\nஊனை, யான் இருந்து ஓம்புகின்றேன்; கெடுவேன் உயிர் ஓயாதே.", "ஓய்வு இலாதன; உவமனில் இறந்தன; ஒள் மலர்த் தாள் தந்து,\nநாயில் ஆகிய குலத்தினும் கடைப்படும் என்னை, நல் நெறி காட்டி,\nதாயில் ஆகிய இன் அருள் புரிந்த என் தலைவனை நனி காணேன்;\nதீயில் வீழ்கிலேன்; திண் வரை உருள்கிலேன்: செழும் கடல்\nபுகுவேனே?\nவேனில் வேள் கணை கிழித்திட, மதி சுடும்; அது தனை", "நினையாதே,\nமான் நிலாவிய நோக்கியர் படிறிடை மத்து இடு தயிர் ஆகி,\nதேன் நிலாவிய திருஅருள் புரிந்த, என் சிவன் நகர் புகப் போகேன்;\nஊனில் ஆவியை ஓம்புதல் பொருட்டு, இனும் உண்டு உடுத்து\nஇருந்தேனே."]], ["கைம்மாறு கொடுத்தல்", ["இரு கை யானையை ஒத்து இருந்து, என் உளக்", "கருவை யான் கண்டிலேன்; கண்டது எவ்வமே;\nவருக' என்று பணித்தனை; வான் உளோர்க்கு\nஒருவனே! கிற்றிலேன்; கிற்பன் உண்ணவே.\nஉண்டு ஓர் ஒள் பொருள் என்று உணர்வார்க்கு எலாம்", "பெண்டிர், ஆண், அலி, என்று அறி ஒண்கிலை;\nதொண்டனேற்கு உள்ளவா வந்து தோன்றினாய்;\nகண்டும் கண்டிலேன்: என்ன கண் மாயமே!", "மேலை வானவரும் அறியாதது ஓர்\nகோலமே, எனை ஆட்கொண்ட கூத்தனே,\nஞாலமே, விசும்பே, இவை வந்து போம்\nகாலமே! உனை என்று கொல் காண்பதே?", "காணல் ஆம் பரமே, கட்கு இறந்தது ஓர்\nவாள் நிலாப் பொருளே, இங்கு, ஒர் பார்ப்பு என,\nபாணனேன் படிற்று ஆக்கையை விட்டு, உனைப்\nபூணும் ஆறு அறியேன் புலன் போற்றியே.", "போற்றி' என்றும், புரண்டும், புகழ்ந்தும் நின்று,\nஆற்றல் மிக்க அன்பால் அழைக்கின்றிலேன்;\nஏற்று வந்து எதிர், தாமரைத் தாள் உறும்\nகூற்றம் அன்னது ஓர் கொள்கை என் கொள்கையே.", "கொள்ளும்கில், எனை அன்பரில் கூய்ப் பணி\nகள்ளும், வண்டும், அறா மலர்க் கொன்றையான்;\nநள்ளும், கீழ் உளும், மேல் உளும், யா உளும்,\nஎள்ளும் எண்ணெயும் போல், நின்ற எந்தையே?", "எந்தை, யாய், எம்பிரான்; மற்றும் யாவர்க்கும்\nதந்தை, தாய், தம்பிரான்; தனக்கு அஃது இலான்;\nமுந்தி என்னுள் புகுந்தனன் யாவரும்\nசிந்தையாலும் அறிவு அரும் செல்வனே.", "செல்வம், நல்குரவு, இன்றி; விண்ணோர், புழு,\nபுல் வரம்பு இன்றி; யார்க்கும் அரும் பொருள்\nஎல்லை இல் கழல் கண்டும் பிரிந்தனன்:\nகல் வகை மனத்தேன் பட்ட கட்டமே!", "கட்டு அறுத்து, எனை ஆண்டு, கண் ஆர, நீறு\nஇட்ட அன்பரொடு, யாவரும் காணவே,\nபட்டிமண்டபம் ஏற்றினை, ஏற்றினை\nஎட்டினோடு இரண்டும் அறியேனையே.", "அறிவனே! அமுதே! அடி நாயினேன்\nஅறிவன் ஆகக் கொண்டோ, எனை ஆண்டதும்?\nஅறிவு இலாமை அன்றே கண்டது, ஆண்ட நாள்?\nஅறிவனோ, அல்லனோ? அருள், ஈசனே!"]], ["அநுபோக சுத்தி", ["ஈசனே! என் எம்மானே! எந்தை பெருமான்! என் பிறவி\nநாசனே! நான் யாதும் ஒன்று அல்லாப் பொல்லா நாய் ஆன\nநீசனேனை ஆண்டாய்க்கு, நினைக்கமாட்டேன் கண்டாயே:\nதேசனே! அம்பலவனே! செய்வது ஒன்றும் அறியேனே.", "செய்வது அறியாச் சிறு நாயேன், செம் பொன் பாத மலர் காணாப்\nபொய்யர் பெறும் பேறு அத்தனையும் பெறுதற்கு உரியேன்; பொய்\nஇலா\nமெய்யர் வெறி ஆர் மலர்ப் பாதம் மேவக் கண்டும், கேட்டிருந்தும்,\nபொய்யனேன் நான் உண்டு, உடுத்து, இங்கு இருப்பது ஆனேன்: போர்", "போர் ஏறே! நின் பொன் நகர்வாய் நீ போந்தருளி, இருள் நீக்கி,\nவார் ஏறு இள மென் முலையாளோடு உடன் வந்தருள, அருள்\nபெற்ற\nசீர் ஏறு அடியார் நின் பாதம் சேரக் கண்டும், கண் கெட்ட\nஊர் ஏறு ஆய், இங்கு உழல்வேனோ? கொடியேன் உயிர் தான்\nஉலவாதே!", "உலவாக் காலம் தவம் எய்தி, உறுப்பும் வெறுத்து, இங்கு உனைக்\nகாண்பான்,\nபல மா முனிவர் நனி வாட, பாவியேனைப் பணி கொண்டாய்;\nமல மாக் குரம்பை இது மாய்க்க மாட்டேன்; மணியே, உனைக்\nகாண்பான்,\nஅலவாநிற்கும் அன்பு இலேன்; என் கொண்டு எழுகேன், எம்மானே?", "மான் நேர் நோக்கி உமையாள் பங்கா! வந்து இங்கு ஆட்கொண்ட\nதேனே! அமுதே! கரும்பின் தெளிவே! சிவனே! தென் தில்லைக்\nகோனே! உன் தன் திருக்குறிப்புக் கூடுவார் நின் கழல் கூட,\nஊன் ஆர் புழுக்கூடு இது காத்து, இங்கு இருப்பது ஆனேன்;\nஉடையானே!", "உடையானே! நின் தனை உள்கி, உள்ளம் உருகும், பெரும் காதல்\nஉடையார், உடையாய்! நின் பாதம் சேரக் கண்டு, இங்கு ஊர் நாயின்\nகடை ஆனேன், நெஞ்சு உருகாதேன், கல்லா மனத்தேன், கசியாதேன்,\nமுடை ஆர் புழுக் கூடு இது காத்து, இங்கு இருப்பது ஆக\nமுடித்தாயே.", "முடித்த ஆறும், என் தனக்கே தக்கதே; முன், அடியாரைப்\nபிடித்த ஆறும், சோராமல் சோரனேன் இங்கு, ஒருத்தி வாய்\nதுடித்த ஆறும், துகில் இறையே சோர்ந்த ஆறும், முகம் குறு வேர்\nபொடித்த ஆறும், இவை உணர்ந்து, கேடு என் தனக்கே தசழ்ந்தேனே.", "தேனை, பாலை, கன்னலின் தெளியை, ஒளியை, தெளிந்தார் தம்\nஊனை உருக்கும் உடையானை, உம்பரானை, வம்பனேன்,\nநான் நின் அடியேன்; நீ என்னை ஆண்டாய், என்றால், அடியேற்குத்\nதானும் சிரித்தே, அருளலாம் தன்மை ஆம், என் தன்மையே.", "தன்மை பிறரால் அறியாத தலைவா! பொல்லா நாய் ஆன\nபுன்மையேனை ஆண்டு, ஐயா! புறமே போக விடுவாயோ?\nஎன்னை நோக்குவார் யாரே? என் நான் செய்கேன்? எம்பெருமான்!\nபொன்னே திகழும் திருமேனி எந்தாய்! எங்குப் புகுவேனே?", "புகுவேன், எனதே நின் பாதம்; போற்றும் அடியார் உள் நின்று\nநகுவேன், பண்டு தோள் நோக்கி நாணம் இல்லா நாயினேன்.\nநெகும் அன்பு இல்லை, நினைக் காண; நீ ஆண்டு அருள, அடியேனும்\nதகுவனே? என் தன்மையே! எந்தாய், அந்தோ! தரியேனே!"]], ["காருணியத்து இரங்கல்", ["தரிக்கிலேன் காய வாழ்க்கை; சங்கரா, போற்றி! வான\nவிருத்தனே, போற்றி! எங்கள் விடலையே, போற்றி! ஒப்பு இல்\nஒருத்தனே, போற்றி! உம்பர் தம்பிரான், போற்றி! தில்லை\nநிருத்தனே, போற்றி! எங்கள் நின்மலா, போற்றி! போற்றி!", "போற்றி! ஓம் நமச்சிவாய! புயங்கனே, மயங்குகின்றேன்;\nபோற்றி! ஓம் நமச்சிவாய! புகல் இடம் பிறிது ஒன்று இல்லை;\nபோற்றி! ஓம் நமச்சிவாய! புறம் எனைப் போக்கல், கண்டாய்;\nபோற்றி! ஓம் நமச்சிவாய! சய! சய! போற்றி! போற்றி!", "போற்றி! என் போலும் பொய்யர் தம்மை ஆட்கொள்ளும் வள்ளல்\nபோற்றி! நின் பாதம் போற்றி! நாதனே, போற்றி! போற்றி!\nபோற்றி! நின் கருணை வெள்ளப் புது மது; புவனம், நீர், தீ,\nகாற்று, இயமானன், வானம், இரு சுடர், கடவுளானே!", "கடவுளே போற்றி! என்னைக் கண்டுகொண்டு, அருளு, போற்றி!\nவிட, உளே உருக்கி என்னை ஆண்டிட வேண்டும், போற்றி!\nஉடல் இது களைந்திட்டு, ஒல்லை உம்பர் தந்து அருளு, போற்றி!\nசடையுளே கங்கை வைத்த சங்கரா, போற்றி! போற்றி!", "சங்கரா, போற்றி! மற்று ஓர் சரண் இலேன்; போற்றி! கோலப்\nபொங்கு அரா அல்குல், செவ் வாய், வெள் நகை, கரிய வாள் கண்,\nமங்கை ஓர் பங்க, போற்றி! மால் விடை ஊர்தி, போற்றி!\nஇங்கு, இவ் வாழ்வு ஆற்றகில்லேன்; எம்பிரான்! இழித்திட்டேனே.", "இழித்தனன் என்னை யானே; எம்பிரான், போற்றி! போற்றி!\nபழித்திலேன் உன்னை; என்னை ஆளுடைப் பாதம் போற்றி!\nபிழைத்தவை பொறுக்கை எல்லாம் பெரியவர் கடமை; போற்றி!\nஒழித்திடு இவ் வாழ்வு; போற்றி! உம்பர் நாட்டு எம்பிரானே!", "எம்பிரான், போற்றி! வானத்தவர் அவர் ஏறு, போற்றி!\nகொம்பர் ஆர் மருங்குல் மங்கை கூற, வெள் நீற, போற்றி!\nசெம் பிரான், போற்றி! தில்லைத் திருச்சிற்றம்பலவ, போற்றி!\nஉம்பராய், போற்றி! என்னை ஆளுடை ஒருவ, போற்றி!", "ஒருவனே போற்றி! ஒப்பு இல் அப்பனே, போற்றி! வானோர்\nகுருவனே, போற்றி! எங்கள் கோமளக் கொழுந்து, போற்றி!\nவருக' என்று, என்னை நின்பால் வாங்கிட வேண்டும், போற்றி!\nதருக நின் பாதம், போற்றி! தமியனேன் தனிமை தீர்த்தே.", "தீர்ந்த அன்பாய அன்பர்க்கு அவரினும் அன்ப, போற்றி!\nபேர்ந்தும், என் பொய்ம்மை ஆட்கொண்டு அருளிடும் பெருமை,\nபோற்றி!\nவார்ந்த நஞ்சு அயின்று, வானோர்க்கு அமுதம் ஈ வள்ளல், போற்றி!\nஆர்ந்த நின் பாதம், நாயேற்கு அருளிட வேண்டும், போற்றி!", "போற்றி! இப் புவனம், நீர், தீ காலொடு, வானம் ஆனாய்;\nபோற்றி! எவ் உயிர்க்கும் தோற்றம் ஆகி, நீ, தோற்றம் இல்லாய்;\nபோற்றி! எல்லா உயிர்க்கும் ஈறு ஆய், ஈறு இன்மை ஆனாய்;\nபோற்றி! ஐம் புலன்கள் நின்னைப் புணர்கிலாப் புணர்க்கையானே."]], ["ஆனந்தத்து அழுந்தல்", ["புணர்ப்பது ஒக்க, எந்தை! என்னை ஆண்டு, பூண நோக்கினாய்;\nபுணர்ப்பது அன்று இது என்ற போது, நின்னொடு என்னொடு, என்\nஇது ஆம்?\nபுணர்ப்பது ஆக, அன்று இது ஆக, அன்பு நின் கழல்கணே\nபுணர்ப்பது ஆக, அம் கணாள, புங்கம் ஆன போகமே!", "போகம் வேண்டி, வேண்டிலேன் புரந்தர ஆதி இன்பமும்;\nஏக! நின் கழல் இணை அலாது இலேன், என் எம்பிரான்;\nஆகம் விண்டு, கம்பம் வந்து, குஞ்சி அஞ்சலிக்கணே\nஆக, என் கை; கண்கள் தாரை ஆறு அது ஆக; ஐயனே!", "ஐய, நின்னது அல்லது இல்லை, மற்று ஓர் பற்று, வஞ்சனேன்;\nபொய் கலந்தது அல்லது இல்லை, பொய்மையேன்; என் எம்பிரான்,\nமை கலந்த கண்ணி பங்க, வந்து நின் கழல்கணே\nமெய் கலந்த அன்பர் அன்பு எனக்கும் ஆகவேண்டுமே.", "வேண்டும், நின் கழல்கண் அன்பு; பொய்மை தீர்த்து மெய்ம்மையே\nஆண்டுகொண்டு, நாயினேனை, ஆவ' என்று அருளு, நீ;\nபூண்டுகொண்டு அடியனேனும் போற்றி! போற்றி! என்றும், என்றும்\nமாண்டு மாண்டு, வந்து வந்து, மன்ன! நின் வணங்கவே.", "வணங்கும் நின்னை, மண்ணும், விண்ணும்; வேதம் நான்கும் ஓலம்\nஇட்டு\nஉணங்கும், நின்னை எய்தல் உற்று, மற்று ஓர் உண்மை\nஇன்மையின்;\nவணங்கி, யாம், விடேங்கள் என்ன, வந்து நின்று அருளுதற்கு,\nஇணங்கு கொங்கை மங்கை பங்க! என் கொலோ நினைப்பதே?", "நினைப்பது ஆக சிந்தை செல்லும் எல்லை, ஏய வாக்கினால்\nதினைத்தனையும் ஆவது இல்லை; சொல்லல் ஆவ கேட்பவே;\nஅனைத்து உலகும் ஆய நின்னை ஐம் புலன்கள் காண்கிலா;\nஎனைத்து, எனைத்து அது, எப் புறத்தது எந்தை பாதம் எய்தவே?", "எய்தல் ஆவது என்று, நின்னை, எம்பிரான்? இவ் வஞ்சனேற்கு\nஉய்தல் ஆவது, உன்கண் அன்றி, மற்று ஓர் உண்மை இன்மையின்,\nபைதல் ஆவது என்று பாதுகாத்து இரங்கு; பாவியேற்கு\nஇஃது அலாது, நின்கண் ஒன்றும்வண்ணம் இல்லை; ஈசனே!", "ஈசனே! நீ அல்லது இல்லை இங்கும் அங்கும் என்பதும்,\nபேசினேன் ஓர் பேதம் இன்மை பேதையேன். என் எம்பிரான்!\nநீசனேனை ஆண்டுகொண்ட நின்மலா! ஒர் நின் அலால்,\nதேசனே! ஓர் தேவர் உண்மை சிந்தியாது, சிந்தையே.", "சிந்தை, செய்கை, கேள்வி, வாக்கு, சீர் இல் ஜம் புலன்களால்,\nமுந்தை ஆன காலம் நின்னை எய்திடாத மூர்க்கனேன்,\nவெந்து, ஐயா, விழுந்திலேன்; என் உள்ளம் வெள்கி விண்டிலேன்;\nஎந்தை ஆய நின்னை, இன்னம் எய்தல் உற்று, இருப்பனே.", "இருப்பு நெஞ்ச வஞ்சனேனை ஆண்டுகொண்ட நின்ன தாள்\nகருப்பு மட்டு வாய் மடுத்து, எனைக் கலந்து போகவும்,\nநெருப்பும் உண்டு; யானும் உண்டிருந்தது உண்டு; அது; ஆயினும்,\nவிருப்பும் உண்டு நின்கண் என்கண் என்பது என்ன விச்சையே!"]], ["ஆனந்த பரவசம்", ["விச்சுக் கேடு பொய்க்கு ஆகாது என்று, இங்கு எனை வைத்தாய்;\nஇச்சைக்கு ஆனார் எல்லாரும் வந்து, உன் தாள் சேர்ந்தார்;\nஅச்சத்தாலே ஆழ்ந்திடுகின்றேன்; ஆரூர் எம்\nபிச்சைத் தேவா, என் நான் செய்கேன்? பேசாயே.", "பேசப்பட்டேன் நின் அடியாரில்; திருநீறே\nபூசப்பட்டேன்; பூதலரால், உன் அடியான் என்று,\nஏசப்பட்டேன்; இனிப் படுகின்றது அமையாதால்;\nஆசைப்பட்டேன்; ஆட்பட்டேன்; உன் அடியேனே.", "அடியேன் அல்லேன் கொல்லோ? தான், எனை ஆட்கொண்டிலை\nகொல்லோ?\nஅடியார் ஆனார் எல்லாரும் வந்து, உன் தாள் சேர்ந்தார்;", "செடி சேர் உடலம் இது, நீக்க மாட்டேன்; எங்கள் சிவலோகா!\nகடியேன் உன்னை, கண் ஆரக் காணும் ஆறு, காணேனே.", "காணும் ஆறு காணேன்; உன்னை அந் நாள் கண்டேனும்\nபாணே பேசி, என் தன்னைப் படுத்தது என்ன? பரஞ்சோதி!\nஆணே, பெண்ணே, ஆர் அமுதே, அத்தா, செத்தே போயினேன்;\nஏண் நாண் இல்லா நாயினேன், என் கொண்டு எழுகேன், எம்மானே?", "மான் நேர் நோக்கி, உமையாள் பங்கா, மறை ஈறு அறியா\nமறையோனே,\nதேனே, அமுதே, சிந்தைக்கு அரியாய், சிறியேன் பிழை பொறுக்கும்\nகோனே, சிறிது என் கொடுமை பறைந்தேன்; சிவ மா நகர் குறுகப்\nபோனார் அடியார்; யானும், பொய்யும், புறமே போந்தோமே.", "புறமே போந்தோம் பொய்யும், யானும்; மெய் அன்பு\nபெறவே வல்லேன் அல்லா வண்ணம் பெற்றேன் யான்.\nஅறவே நின்னைச் சேர்ந்த அடியார் மற்று ஒன்று அறியாதார்;\nசிறவே செய்து வழுவாது, சிவனே! நின் தாள் சேர்ந்தாரே.", "தாராய், உடையாய்! அடியேற்கு உன் தாள் இணை அன்பு;\nபோரா உலகம் புக்கார் அடியார்; புறமே போந்தேன் யான்;\nஊர் ஆ மிலைக்க, குருட்டு ஆ மிலைத்தாங்கு, உன் தாள் இணை\nஅன்புக்கு\nஆரா அடியேன், அயலே மயல்கொண்டு, அழுகேனே.", "அழுகேன், நின்பால் அன்பு ஆம் மனம் ஆய்; அழல் சேர்ந்த\nமெழுகே அன்னார், மின் ஆர், பொன் ஆர், கழல் கண்டு\nதொழுதே, உன்னைத் தொடர்ந்தாரோடும் தொடராதே,\nபழுதே பிறந்தேன்; என் கொண்டு உன்னைப் பணிகேனே?", "பணிவார் பிணி தீர்த்தருளி, பழைய அடியார்க்கு உன்\nஅணி ஆர் பாதம் கொடுத்தி; அதுவும் அரிது என்றால்,\nதிணி ஆர் மூங்கில் அனையேன், வினையைப் பொடி ஆக்கி,\nதணி ஆர் பாதம், வந்து, ஒல்லை தாராய்; பொய் தீர் மெய்யானே!", "யானே பொய்; என் நெஞ்சும் பொய்; என் அன்பும் பொய்;\nஆனால், வினையேன் அழுதால், உன்னைப் பெறலாமே?\nதேனே, அமுதே, கரும்பின் தெளிவே, தித்திக்கும்\nமானே, அருளாய் அடியேன் உனை வந்து உறுமாறே."]], ["ஆனந்தாதீதம்", ["மாறு இலாத மாக் கருணை வெள்ளமே! வந்து முந்தி நின்\nமலர்கொள் தாள் இணை,\nவேறு இலாப் பதப் பரிசு பெற்ற, நின் மெய்ம்மை அன்பர், உன்\nமெய்ம்மை மேவினார்;\nஈறு இலாத நீ, எளியை ஆகி வந்து, ஒளிசெய் மானிடம் ஆக,\nநோக்கியும்,\nகீறு இலாத நெஞ்சு உடைய நாயினேன் கடையன் ஆயினேன் பட்ட\nகீழ்மையே.", "மை இலங்கு நல் கண்ணி பங்கனே! வந்து எனைப் பணிகொண்ட\nபின், மழக்\nகை இலங்கு பொன் கிண்ணம் என்று அலால், அரியை என்று\nஉனைக் கருதுகின்றிலேன்;\nமெய் இலங்கு வெள் நீற்று மேனியாய், மெய்ம்மை அன்பர் உன்\nமெய்ம்மை மேவினார்;\nபொய்யில் இங்கு எனைப் புகுதவிட்டு, நீ போவதோ? சொலாய்,\nபொருத்தம் ஆவதே?", "பொருத்தம் இன்மையேன்; பொய்ம்மை உண்மையேன்; போத' என்று\nஎனைப் புரிந்து நோக்கவும்,\nவருத்தம் இன்மையேன்; வஞ்சம் உண்மையேன்; மாண்டிலேன்;\nமலர்க் கமல பாதனே,\nஅரத்த மேனியாய், அருள்செய் அன்பரும், நீயும், அங்கு எழுந்தருளி,\nஇங்கு எனை\nஇருத்தினாய்; முறையோ? என் எம்பிரான், வம்பனேன் வினைக்கு\nஇறுதி இல்லையே?", "இல்லை நின் கழற்கு அன்பு அது, என்கணே; ஏலம் ஏலும் நல் குழலி\nபங்கனே!\nகல்லை மென் கனி ஆக்கும் விச்சை கொண்டு, என்னை நின்\nகழற்கு அன்பன் ஆக்கினாய்;\nஎல்லை இல்லை நின் கருணை; எம்பிரான்! ஏது கொண்டு, நான் ஏது\nசெய்யினும்,\nவல்லையே எனக்கு இன்னும் உன் கழல் காட்டி, மீட்கவும், மறு இல்\nவானனே?", "வான நாடரும் அறி ஒணாத நீ, மறையில் ஈறும் முன் தொடர்\nஒணாத நீ,\nஏனை நாடரும் தெரி ஒணாத நீ, என்னை இன்னிதாய்\nஆண்டுகொண்டவா,\nஊனை நாடகம் ஆடுவித்தவா, உருகி, நான் உனைப் பருக\nவைத்தவா,\nஞான நாடகம் ஆடுவித்தவா நைய வையகத்துடைய விச்சையே!", "விச்சு அது இன்றியே, விளைவு செய்குவாய்; விண்ணும், மண்ணகம்\nமுழுதும், யாவையும்,\nவைச்சு வாங்குவாய்; வஞ்சகப் பெரும் புலையனேனை, உன்\nகோயில் வாயிலில்\nபிச்சன் ஆக்கினாய்; பெரிய அன்பருக்கு உரியன் ஆக்கினாய்; தாம்\nவளர்த்தது, ஓர்\nநச்சு மா மரம் ஆயினும், கொலார்; நானும் அங்ஙனே, உடைய\nநாதனே!", "உடைய நாதனே, போற்றி! நின் அலால் பற்று, மற்று எனக்கு ஆவது\nஒன்று இனி\nஉடையனோ? பணி; போற்றி! உம்பரார் தம் பரா பரா, போற்றி!\nயாரினும்\nகடையன் ஆயினேன்; போற்றி! என் பெரும் கருணையாளனே,\nபோற்றி! என்னை, நின்\nஅடியன் ஆக்கினாய்; போற்றி! ஆதியும், அந்தம், ஆயினாய், போற்றி!\nஅப்பனே!", "அப்பனே, எனக்கு அமுதனே, ஆனந்தனே, அகம் நெக அள்ளூறு தேன்\nஒப்பனே, உனக்கு உரிய அன்பரில் உரியனாய், உனைப் பருக\nநின்றது ஓர்\nதுப்பனே, சுடர் முடியனே, துணையாளனே, தொழும்பாளர் எய்ப்பினில்\nவைப்பனே, எனை வைப்பதோ, சொலாய் நைய, வையகத்து, எங்கள்\nமன்னனே?", "மன்ன, எம்பிரான், வருக' என் எனை; மாலும், நான்முகத்து ஒருவன்,\nயாரினும்\nமுன்ன, எம்பிரான், வருக' என் எனை; முழுதும் யாவையும் இறுதி\nஉற்ற நாள்\nபின்ன, எம்பிரான், வருக' என் எனை; பெய்கழற்கண் அன்பாய், என்\nநாவினால்\nபன்ன, எம்பிரான், வருக! என் எனை பாவநாச, நின் சீர்கள் பாடவே.", "பாட வேண்டும் நான்; போற்றி! நின்னையே பாடி, நைந்து நைந்து\nஉருகி, நெக்கு நெக்கு,\nஆட வேண்டும் நான்; போற்றி! அம்பலத்து ஆடும் நின் கழல் போது,\nநாயினேன்\nகூட வேண்டும் நான்; போற்றி! இப் புழுக் கூடு நீக்கு எனை; போற்றி!\nபொய் எலாம்\nவி வேண்டும் நான்; போற்றி! வீடு தந்து அருளு; போற்றி! நின்\nமெய்யர் மெய்யனே!"]], ["நீத்தல் விண்ணப்பம்", ["கடையவனேனைக் கருணையினால் கலந்து, ஆண்டுகொண்ட", "விடையவனே, விட்டிடுதி கண்டாய்? விறல் வேங்கையின் தோல்\nஉடையவனே, மன்னும் உத்தரகோசமங்கைக்கு அரசே,\nசடையவனே, தளர்ந்தேன்; எம்பிரான், என்னைத் தாங்கிக்கொள்ளே.\nகொள் ஏர் பிளவு அகலாத் தடம் கொங்கையர் கொவ்வைச் செவ்", "வாய்\nவிள்ளேன் எனினும், விடுதி கண்டாய்: நின் விழுத் தொழும்பின்\nஉள்ளேன்; புறம் அல்லேன்; உத்தரகோசமங்கைக்கு அரசே,\nகள்ளேன் ஒழியவும், கண்டுகொண்டு ஆண்டது எக் காரணமே?\nகார் உறு கண்ணியர் ஐம் புலன் ஆற்றங்கரை மரமாய்", "வேர் உறுவேனை விடுதி கண்டாய்?விளங்கும் திருவா\nரூர் உறைவாய், மன்னும் உத்தரகோசமங்கைக்கு அரசே,\nவார் உறு பூண் முலையாள் பங்க, என்னை வளர்ப்பவனே.\nவளர்கின்ற நின் கருணைக் கையில் வாங்கவும் நீங்கி, இப்பால்", "மிளிர்கின்ற என்னை விடுதி கண்டாய்? வெண் மதிக் கொழுந்து\nஒன்று\nஒளிர்கின்ற நீள் முடி உத்தரகோசமங்கைக்கு அரசே,\nதெளிகின்ற பொன்னும், மின்னும், அன்ன தோற்றச் செழும் சுடரே.\nசெழிகின்ற தீப் புகு விட்டிலின், சில் மொழியாரில் பல் நாள்", "விழுகின்ற என்னை விடுதி கண்டாய்? வெறி வாய் அறுகால்\nஉழுகின்ற பூ முடி உத்தரகோசமங்கைக்கு அரசே,\nவழி நின்று, நின் அருள் ஆர் அமுது ஊட்ட மறுத்தனனே.", "மறுத்தனன் யான், உன் அருள் அறியாமையின், என் மணியே;\nவெறுத்து எனை நீ விட்டிடுதி கண்டாய்? வினையின் தொகுதி\nஒறுத்து, எனை ஆண்டுகொள்; உத்தரகோசமங்கைக்கு அரசே,\nபொறுப்பர் அன்றே பெரியோர், சிறு நாய்கள் தம் பொய்யினையே?", "பொய்யவனேனைப் பொருள் என ஆண்டு, ஒன்று பொத்திக்கொண்ட\nமெய்யவனே, விட்டிடுதி கண்டாய்? விடம் உண் மிடற்று\nமையவனே, மன்னும் உத்தரகோசமங்கைக்கு அரசே,\nசெய்யவனே, சிவனே, சிறியேன் பவம் தீர்ப்பவனே.", "தீர்க்கின்ற ஆறு என் பிழையை, நின் சீர் அருள் என்கொல் என்று\nவேர்க்கின்ற என்னை விடுதி கண்டாய் விரவார் வெருவ\nஆர்க்கின்ற தார் விடை உத்தர கோச மங்கைக்கு அரசே\nஈர்க்கின்ற அஞ்சொடு அச்சம் வினையேனை இருதலையே!", "இருதலைக் கொள்ளியின் உள் எறும்பு ஒத்து நினைப் பிரிந்த\nவிரிதலையேனை விடுதி கண்டாய் வியன் மூவுலகுக்கு\nஒரு தலைவா மன்னும் உத்தர கோச மங்கைக்கு அரசே\nபொரு தலை மூவிலை வேல் வலன் ஏந்திப் பொலிபவனே!", "பொலிகின்ற நின் தாள் புகுதப்பெற்று ஆக்கையைப் போக்கப் பெற்று\nமெலிகின்ற என்னை விடுதி கண்டாய் அளி தேர் விளரி\nஒலி நின்ற பூம் பொழில் உத்தரகோசமங்கைக்கு அரசே,\nவலி நின்ற திண் சிலையால் எரித்தாய் புரம், மாறுபட்டே.", "மாறுபட்டு அஞ்சு என்னை வஞ்சிப்ப, யான் உன் மணி மலர்த் தாள்\nவேறுபட்டேனை விடுதி கண்டாய்? வினையேன் மனத்தே\nஊறும் மட்டே, மன்னும் உத்தரகோசமங்கைக்கு அரசே,\nநீறு பட்டே ஒளி காட்டும் பொன் மேனி நெடுந்தகையே.", "நெடுந்தகை, நீ, என்னை ஆட்கொள்ள, யான், ஐம் புலன்கள் கொண்\nவிடும் தகையேனை விடுதி கண்டாய்? விரவார் வெருவ,\nஅடும் தகை வேல் வல்ல உத்தரகோசமங்கைக்கு அரசே,\nகடும் தகையேன் உண்ணும் தெள் நீர் அமுதப் பெரும் கடலே.", "கடலினுள் நாய் நக்கி ஆங்கு, உன் கருணைக் கடலின் உள்ளம்\nவிடல் அரியேனை விடுதி கண்டாய்? விடல் இல் அடியார்\nஉடல் இலமே மன்னும் உத்தரகோசமங்கைக்கு அரசே,\nமடலின் மட்டே, மணியே, அமுதே, என் மது வெள்ளமே.", "வெள்ளத்துள் நா வற்றி ஆங்கு, உன் அருள் பெற்றுத் துன்பத்தின்\n[நின்றும்\nவிள்ளக்கிலேனை விடுதி கண்டாய்? விரும்பும் அடியார்\nஉள்ளத்து உள்ளாய், மன்னும் உத்தரகோசமங்கைக்கு அரசே,\nகள்ளத்து உளேற்கு, அருளாய் களியாத களி, எனக்கே.", "களிவந்த சிந்தையொடு உன் கழல் கண்டும், கலந்தருள\nவெளி வந்திலேனை விடுதி கண்டாய்: மெய்ச் சுடருக்கு எல்லாம்\nஒளிவந்த பூம் கழல் உத்தரகோசமங்கைக்கு அரசே,\nஎளிவந்த எந்தை பிரான், என்னை ஆளுடை என் அப்பனே!", "என்னை அப்பா, அஞ்சல், என்பவர் இன்றி, நின்று எய்த்து\nஅலைந்தேன்;\nமின்னை ஒப்பாய், விட்டிடுதி கண்டாய்? உவமிக்கின், மெய்யே\nஉன்னை ஒப்பாய்; மன்னும் உத்தரகோசமங்கைக்கு அரசே,\nஅன்னை ஒப்பாய்; எனக்கு அத்தன் ஒப்பாய்; என் அரும் பொருளே!", "பொருளே, தமியேன் புகல் இடமே, நின் புகழ் இகழ்வார்\nவெருளே, எனை விட்டிடூதி கண்டாய்? மெய்ம்மையார் விழுங்கும்\nஅருளே, அணி பொழில் உத்தரகோசமங்கைக்கு அரசே,\nஇருளே, வெளியே, இக பரம் ஆகி இருந்தவனே.", "இருந்து என்னை ஆண்டுகொள்; விற்றுக்கொள்; ஒற்றி வை;' என்னின்\nஅல்லால்,\nவிருந்தினனேனை, விடுதி கண்டாய்? மிக்க நஞ்சு அமுதா\nஅருந்தினனே, மன்னும் உத்தரகோசமங்கைக்கு அரசே,\nமருந்தினனே, பிறவிப் பிணிப்பட்டு மடங்கினர்க்கே.", "மடங்க என் வல் வினைக் காட்டை, நின் மன் அருள் தீக்\nகொளுவும்\nவிடங்க, என்தன்னை விடுதி கண்டாய்?என் பிறவியை வே\nரொடும் களைந்து ஆண்டுகொள்; உத்தரகோசமங்கைக்கு அரசே,\nகொடும் கரிக்குன்று உரித்து, அஞ்சுவித்தாய், வஞ்சிக்\nகொம்பினையே.", "கொம்பர் இல்லாக் கொடிபோல், அலமந்தனன்; கோமளமே,\nவெம்புகின்றேனை விடுதி கண்டாய்? விண்ணவர் நண்ணுகில்லா\nஉம்பர் உள்ளாய்; மன்னும் உத்தரகோசமங்கைக்கு அரசே,\nஅம்பரமே, நிலனே, அனல், காலொடு, அப்பு, ஆனவனே.", "ஆனை வெம் போரில், குறும் தூறு எனப் புலனால் அலைப்புண்\nடேனை, எந்தாய், விட்டிடுதி கண்டாய்? வினையேன் மனத்துத்\nதேனையும், பாலையும், கன்னலையும், அமுதத்தையும், ஒத்து,\nஊனையும், என்பினையும், உருக்காநின்ற ஒண்மையனே.", "ஒண்மையனே, திருநீற்றை உத்தூளித்து, ஒளி மிளிரும்\nவெண்மையனே, விட்டிடுதி கண்டாய்? மெய் அடியவர்கட்கு\nஅண்மையனே, என்றும் சேயாய் பிறர்க்கு; அறிதற்கு அரிது ஆம்\nபெண்மையனே, தொன்மை ஆண்மையனே, அலிப் பெற்றியனே.", "பெற்றது கொண்டு, பிழையே பெருக்கி, சுருக்கும் அன்பின்\nவெற்று அடியேனை, விடுதி கண்டாய்? விடிலோ கெடுவேன்;\nமற்று, அடியேன் தன்னை, தாங்குநர் இல்லை; என் வாழ் முதலே,\nஉற்று, அடியேன், மிகத் தேறி நின்றேன்; எனக்கு உள்ளவனே.", "உள்ளனவே நிற்க, இல்லன செய்யும் மையல் துழனி\nவெள்ளனலேனை விடுதி கண்டாய்? வியன் மாத் தடக் கைப்\nபொள்ளல் நல் வேழத்து உரியாய், புலன், நின்கண் போதல் ஒட்டா,\nமெள்ளெனவே மொய்க்கும் நெய்க் குடம் தன்னை எறும்பு எனவே.", "எறும்பிடை நாங்கூழ் என, புலனால் அரிப்புண்டு, அலந்த\nவெறும் தமியேனை விடுதி கண்டாய்? வெய்ய கூற்று ஒடூங்க,\nஉறும் கடிப் போது அவையே உணர்வு உற்றவர் உம்பர் உம்பர்\nபெறும் பதமே, அடியார் பெயராத பெருமையனே.", "பெரு நீர் அற, சிறு மீன் துவண்டு ஆங்கு, நினைப் பிரிந்த\nவெரு நீர்மையேனை விடுதி கண்டாய்? வியன் கங்கை பொங்கி\nவரும் நீர் மடுவுள், மலைச் சிறு தோணி வடிவின், வெள்ளைக்\nகுரு நீர் மதி பொதியும் சடை, வானக் கொழு மணியே!", "கொழு மணி ஏர் நகையார் கொங்கைக் குன்றிடைச் சென்று, குன்றி\nவிழும் அடியேனை விடுதி கண்டாய்? மெய்ம் முழுதும் கம்பித்து,\nஅழும் அடியாரிடை ஆர்த்து வைத்து, ஆட்கொண்டருளி, என்னைக்\nகழு மணியே, இன்னும் காட்டு கண்டாய் நின் புலன் கழலே.", "புலன்கள் திகைப்பிக்க, யானும் திகைத்து, இங்கு ஒர் பொய்ந்\nநெறிக்கே\nவிலங்குகின்றேனை விடுதி கண்டாய்? விண்ணும், மண்ணும்,\nஎல்லாம்\nகலங்க, முந்நீர் நஞ்சு அமுது செய்தாய்; கருணாகரனே!\nதுலங்குகின்றேன் அடியேன்; உடையாய், என் தொழுகுலமே.", "குலம் களைந்தாய்; களைந்தாய் என்னைக் குற்றம்; கொற்றச் சிலை\nஆம்\nவிலங்கல் எந்தாய், விட்டிடுதி கண்டாய்? பொன்னின் மின்னு\nகொன்றை\nஅலங்கல் அம் தாமரை மேனி அப்பா, ஒப்பு இலாதவனே,\nமலங்கள் ஐந்தால் சுழல்வன், தயிரில் பொரு மத்து உறவே.", "மத்து உறு தண் தயிரின், புலன் தீக் கதுவக் கலங்கி,\nவித்து உறுவேனை விடுதி கண்டாய்? வெண் தலை மிலைச்சி,\nகொத்து உறு போது மிலைந்து, குடர் நெடு மாலை சுற்றி,\nதத்து உறு நீறுடன் ஆரச் செம் சாந்து அணி சச்சையனே.", "சச்சையனே, மிக்க தண் புனல், விண், கால், நிலம், நெருப்பு, ஆம்\nவிச்சையனே, விட்டிடுதி கண்டாய்? வெளியாய், கரியாய்,\nபச்சையனே, செய்ய மேனியனே, ஒண் பட அரவக்\nகச்சையனே கடந்தாய் தடம் தாள அடல் கரியே.", "அடல் கரி போல், ஐம் புலன்களுக்கு அஞ்சி அழிந்த என்னை\nவிடற்கு அரியாய், விட்டிடூதி கண்டாய்: விழுத் தொண்டர்க்கு\nஅல்லால்\nதொடற்கு அரியாய், சுடர் மா மணியே, சுடு தீச் சுழல,\nகடல் கரிது ஆய் எழு நஞ்சு அமுது ஆக்கும் கறைக்கண்டனே.", "கண்டது செய்து, கருணை மட்டுப் பருகிக் களித்து,\nமிண்டுகின்றேனை விடுதி கண்டாய்? நின் விரை மலர்த் தாள்\nபண்டு தந்தால் போல் பணித்து, பணிசெயக் கூவித்து, என்னைக்\nகொண்டு, என் எந்தாய், களையாய் களை ஆய குதுகுதுப்பே.", "குதுகுதுப்பு இன்றி நின்று, என் குறிப்பே செய்து, நின் குறிப்பில்\nவிதுவிதுப்பேனை விடுதி கண்டாய்? விரை ஆர்ந்து, இனிய\nமது மதுப் போன்று, என்னை வாழைப் பழத்தின் மனம் கனிவித்து,\nஎதிர்வது எப்போது? பயில்வி, கயிலைப் பரம்பரனே!", "பரம்பரனே, நின் பழ அடியாரொடும் என் படிறு\nவிரும்பு அரனே, விட்டிடுதி கண்டாய்? மென் முயல் கறையின்\nஅரும்பு, அர, நேர் வைத்து அணிந்தாய், பிறவி ஐ வாய் அரவம்\nபொரும், பெருமான் வினையேன் மனம் அஞ்சி, பொதும்பு உறவே.", "பொதும்பு உறு தீப்போல் புகைந்து எரிய, புலன் தீக் கதுவ,\nவெதும்புறுவேனை விடுதி கண்டாய்? விரை ஆர் நறவம்\nததும்பும் மந்தாரத்தில் தாரம் பயின்று, மந்தம் முரல் வண்டு\nஅதும்பும், கொழும் தேன் அவிர் சடை வானத்து அடல் அரைசே.", "அரைசே, அறியாச் சிறியேன் பிழைக்கு அஞ்சல்' என்னின் அல்லால்,\nவிரை சேர் முடியாய், விடுதி கண்டாய்? வெள் நகை, கரும் கண்,\nதிரை சேர் மடந்தை மணந்த திருப் பொன் பதப் புயங்கா,\nவரை சேர்ந்து அடர்ந்து என்ன, வல் வினை தான் வந்து\nஅடர்வனவே.", "அடர் புலனால், நின் பிரிந்து அஞ்சி, அம் சொல் நல்லார் அவர் தம்\nவிடர் விடலேனை விடுதி கண்டாய்: விரிந்தே எரியும்\nசுடர் அனையாய், சுடுகாட்டு அரசே, தொழும்பர்க்கு அமுதே,\nதொடர்வு அரியாய், தமியேன் தனி நீக்கும் தனித் துணையே.", "தனித் துணை நீ நிற்க, யான் தருக்கி, தலையால் நடந்த\nவினைத் துணையேனை விடுதி கண்டாய்? வினையேனுடைய\nமனத் துணையே, என் தன் வாழ் முதலே, எனக்கு எய்ப்பில்\nவைப்பே,\nதினைத்துணையேனும் பொறேன், துயர் ஆக்கையின் திண்\nவலையே.", "வலைத்தலை மான் அன்ன நோக்கியர் நோக்கின் வலையில் பட்டு,\nமிலைத்து அலைந்தேனை விடுதி கண்டாய்? வெள் மதியின்\nஒற்றைக்\nகலைத் தலையாய், கருணாகரனே, கயிலாயம் என்னும்\nமலைத் தலைவா, மலையாள் மணவாள, என் வாழ் முதலே.", "முதலைச் செவ் வாய்ச்சியர் வேட்கை வெந்நீரில் கடிப்ப மூழ்கி,\nவிதலைச் செய்வேனை விடுதி கண்டாய்? விடக்கு ஊன் மிடைந்த\nசிதலைச் செய் காயம் பொறேன்; சிவனே, முறையோ? முறையோ?\nதிதலைச் செய் பூண் முலை மங்கை பங்கா, என் சிவகதியே!", "கதி அடியேற்கு உன் கழல் தந்தருளவும், ஊன் கழியா\nவிதி அடியேனை விடுதி கண்டாய்? வெள் தலை முழையில்\nபதி உடை வாள் அரப் பார்த்து, இறை பைத்துச் சுருங்க, அஞ்சி,\nமதி நெடு நீரில் குளித்து, ஒளிக்கும் சடை மன்னவனே.", "மன்னவனே, ஒன்றும் ஆறு அறியாச் சிறியேன் மகிழ்ச்சி\nமின்னவனே, விட்டிடுதி கண்டாய்? மிக்க வேத மெய்ந் நூல்\nசொன்னவனே, சொல் கழிந்தவனே, கழியாத் தொழும்பர்\nமுன்னவனே, பின்னும் ஆனவனே, இம் முழுதையுமே.", "முழுது அயில் வேல் கண்ணியர் என்னும் மூரித் தழல் முழுகும்\nவிழுது அனையேனை விடுதி கண்டாய்? நின் வெறி மலர்த் தாள்\nதொழுது செல் வானத் தொழும்பரில் கூட்டிடு; சோத்தம்' பிரான்;\nபழுது செய்வேனை விடேல்; உடையாய், உன்னைப் பாடூவனே.", "பாடிற்றிலேன்; பணியேன்; மணி, நீ ஒளித்தாய்க்குப் பச்சன்\nவிடிற்றிலேனை விடுதி கண்டாய்? வியந்து, ஆங்கு அலறித்\nதேடிற்றிலேன்; சிவன் எவ் இடத்தான்? எவர் கண்டனர்? என்று\nஓடிற்றிலேன்; கிடந்து உள் உருகேன்; நின்று உழைத்தனனே.\nஉழைதரு நோக்கியர் கொங்கை, பலாப்பழத்து ஈயின் ஒப்பாய்,", "விழைதருவேனை விடுதி கண்டாய்: விடின், வேலை நஞ்சு உண்\nமழைதரு கண்டன், குணம் இலி, மானிடன், தேய் மதியன்\nபழைதரு மா பரன் என்று என்று அறைவன், பழிப்பினையே.", "பழிப்பு இல் நின் பாதப் பழம் தொழும்பு எய்தி, விழ, பழித்து,\nவிழித்திருந்தேனை விடுதி கண்டாய்? வெண் மணிப் பணிலம்\nகொழித்து, மந்தாரம் மந்தாகினி நுந்தும், பந்தப் பெருமை\nதழிச் சிறை நீரில், பிறைக் கலம் சேர்தரு தாரவனே.", "தாரகை போலும் தலைத் தலை மாலை, தழல் அரப் பூண்\nவீர, என் தன்னை விடுதி கண்டாய்? விடின், என்னை மிக்கார்\nஆர் அடியான்' என்னின், உத்தரகோசமங்கைக்கு அரசின்\nசீர் அடியார் அடியான்' என்று, நின்னைச் சிரிப்பிப்பனே.\nசிரிப்பிப்பன், சீறும் பிழைப்பை; தொழும்பையும் ஈசற்கு' என்று", "விரிப்பிப்பன்; என்னை விடுதி கண்டாய்? விடின், வெம் கரியின்\nஉரிப் பிச்சன், தோல் உடைப் பிச்சன், நஞ்சு ஊண் பிச்சன், ஊர்ச்\nசுடுகாட்டு\nஎரிப் பிச்சன், என்னையும் ஆளுடைப் பிச்சன்' என்று ஏசுவனே.\nஏசினும், யான், உன்னை ஏத்தினும், என் பிழைக்கே குழைந்து", "வேசறுவேனை விடுதி கண்டாய்? செம் பவள வெற்பின்\nதேசு உடையாய்; என்னை ஆளுடையாய்; சிற்றுயிர்க்கு இரங்கி,\nகாய் சின ஆலம் உண்டாய் அமுது உண்ணக் கடையவனே."]], ["திருஎம்பாவை", ["ஆதியும் அந்தமும் இல்லா அரும் பெரும்", "சோதியை யாம் பாடக் கேட்டேயும், வாள் தடம் கண்\nமாதே! வளருதியோ? வன் செவியோ நின் செவி தான்?\nமா தேவன் வார் கழல்கள் வாழ்த்திய வாழ்த்து ஒலி போய்\nவீதிவாய்க் கேட்டலுமே, விம்மி விம்மி, மெய்ம்மறந்து,\nபோது ஆர் அமளியின்மேல் நின்றும் புரண்டு, இங்ஙன்\nஏதேனும் ஆகாள், கிடந்தாள்; என்னே! என்னே!\nஈதே எம் தோழி பரிசு? ஏல் ஓர் எம்பாவாய்!", "பாசம் பரஞ்சோதிக்கு என்பாய், இராப் பகல் நாம்\nபேசும்போது; எப்போது இப் போது ஆர் அமளிக்கே\nநேசமும் வைத்தனையோ? நேரிழையாய்! நேரிழையீர்!\nசி சி இவையும் சிலவோ? விளையாடி\nஏசும் இடம் ஈதோ? விண்ணோர்கள் ஏத்துதற்குக்\nகூசும் மலர்ப் பாதம் தந்தருள வந்தருளும்\nதேசன், சிவலோகன், தில்லைச் சிற்றம்பலத்துள்\nஈசனார்க்கு அன்பு ஆர்? யாம் ஆர்? ஏல் ஓர் எம்பாவாய்!", "முத்து அன்ன வெள் நகையாய்! முன் வந்து, எதிர் எழுந்து, \"என்\nஅத்தன், ஆனந்தன், அமுதன்\" என்று அள்ளூறித்\nதித்திக்கப் பேசுவாய், வந்து உன் கடை திறவாய்.\nபத்து உடையீர்! ஈசன் பழ அடியீர்! பாங்கு உடையீர்!\nபுத்து அடியோம் புன்மை தீர்த்து ஆட்கொண்டால், பொல்லாதோ?'\nஎத்தோ நின் அன்புடைமை? எல்லோம் அறியோமோ?'\nசித்தம் அழகியார் பாடாரோ, நம் சிவனை?'\nஇத்தனையும் வேண்டும் எமக்கு' ஏல் ஓர் எம்பாவாய்!", "ஒள் நித்தில நகையாய்! இன்னம் புலர்ந்தின்றோ?'\nவண்ணக் கிளி மொழியார் எல்லாரும் வந்தாரோ?\nஎண்ணிக்கொடு உள்ளவா சொல்லுகோம்: அவ்வளவும்\nகண்ணைத் துயின்று, அவமே காலத்தைப் போக்காதே'\nவிண்ணுக்கு ஒரு மருந்தை, வேத விழுப் பொருளை,\nகண்ணுக்கு இனியானை, பாடிக் கசிந்து, உள்ளம்\nஉள் நெக்கு, நின்று உருக, யாம் மாட்டோம்; நீயே வந்து\nஎண்ணி, குறையில், துயில்! ஏல் ஓர் எம்பாவாய்!", "மால் அறியா, நான்முகனும் காணா, மலையினை, \"நாம்\nபோல் அறிவோம்,\" என்று உள்ள பொக்கங்களே பேசும்\nபால் ஊறு தேன் வாய்ப் படிறி கடை திறவாய்.\nஞாலமே, விண்ணே, பிறவே, அறிவு அரியான்\nகோலமும், நம்மை ஆட்கொண்டருளிக் கோதாட்டும்\nசீலமும் பாடி, \"சிவனே! சிவனே! என்று\nஓலம் இடினும், உணராய், உணராய் காண்!\nஏலக்குழலி பரிசு' ஏல் ஓர் எம்பாவாய்!", "மானே! நீ நென்னலை, \"நாளை வந்து உங்களை\nநானே எழுப்புவன்” என்றலும், நாணாமே\nபோன திசை பகராய்; இன்னம் புலர்ந்தின்றோ?\nவானே, நிலனே, பிறவே, அறிவு அரியான்\nதானே வந்து, எம்மைத் தலையளித்து, ஆட்கொண்டருளும்\nவான் வார் கழல் பாடி வந்தோர்க்கு, உன் வாய் திறவாய்!\nஊனே உருகாய், உனக்கே உறும்; எமக்கும்\nஏனோர்க்கும் தம் கோனைப் பாடு' ஏல் ஓர் எம்பாவாய்!", "அன்னே, இவையும் சிலவோ? பல அமரர்\nஉன்னற்கு அரியான், ஒருவன், இரும் சீரான்,\nசின்னங்கள் கேட்ப, \"சிவன்\" என்றே வாய் திறப்பாய்;\n\"தென்னா\" என்னா முன்னம், தீ சேர் மெழுகு ஒப்பாய்;\n\"என்னானை, என் அரையன், இன் அமுது,\" என்று எல்லோமும்\nசொன்னோம் கேள், வெவ்வேறாய்; இன்னம் துயிலுதியோ?\nவன் நெஞ்சப் பேதையர்போல் வாளா கிடத்தியால்,\nஎன்னே துயிலின் பரிசு? ஏல் ஓர் எம்பாவாய்!", "கோழி சிலம்ப, சிலம்பும் குருகு எங்கும்;\nஏழில் இயம்ப, இயம்பும் வெண் சங்கு எங்கும்;\nகேழ் இல் பரஞ்சோதி, கேழ் இல் பரங்கருணை,\nகேழ் இல் விழுப் பொருள்கள் பாடினோம்; கேட்டிலையோ?\nவாழி! ஈது என்ன உறக்கமோ? வாய் திறவாய்!\nஆழியான் அன்புடைமை ஆம் ஆறும் இவ்வாறோ?\nஊழி முதல்வனாய் நின்ற ஒருவனை,\nஏழை பங்காளனையே பாடு! ஏல் ஓர் எம்பாவாய்!", "முன்னைப் பழம் பொருட்கும் முன்னைப் பழம் பொருளே!\nபின்னைப் புதுமைக்கும் பேர்த்தும் அப் பெற்றியனே!\nஉன்னைப் பிரானாகப் பெற்ற உன் சீர் அடியோம்\nஉன் அடியார் தாள் பணிவோம்; ஆங்கு அவர்க்கே பாங்கு ஆவோம்;\nஅன்னவரே எம் கணவர் ஆவார்; அவர் உகந்து\nசொன்ன பரிசே தொழும்பாய்ப் பணி செய்வோம்;\nஇன்ன வகையே எமக்கு எம் கோன் நல்குதியேல்,\nஎன்ன குறையும் இலோம்' ஏல் ஓர் எம்பாவாய்!", "பாதாளம் ஏழினும் கீழ் சொல் கழிவு பாத மலர்;\nபோது ஆர் புனை முடியும் எல்லாப் பொருள் முடிவே!\nபேதை ஒருபால்; திருமேனி ஒன்று அல்லன்;\nவேத முதல்; விண்ணோரும், மண்ணும், துதித்தாலும்,\nஓத உலவா ஒரு தோழம் தொண்டர் உளன்;\nகோது இல் குலத்து, அரன் தன் கோயில் பிணாப் பிள்ளைகாள்!\nஏது அவன் ஊர்? ஏது அவன் பேர்? ஆர் உற்றார்? ஆர் அயலார்?\nஏது அவனைப் பாடும் பரிசு? ஏல் ஓர் எம்பாவாய்!", "மொய் ஆர் தடம் பொய்கை புக்கு, முகேர் என்னக்\nகையால் குடைந்து குடைந்து, உன் கழல் பாடி,\nஐயா! வழி அடியோம் வாழ்ந்தோம் காண்; ஆர் அழல்போல்\nசெய்யா! வெள் நீறு ஆடீ! செல்வா! சிறு மருங்குல்\nமை ஆர் தடம் கண் மடந்தை மணவாளா!\nஐயா! நீ ஆட்கொண்டருளும் விளையாட்டில்\nஉய்வார்கள் உய்யும் வகை எல்லாம், உய்ந்து ஒழிந்தோம்;\nஎய்யாமல் காப்பாய் எமை' ஏல் ஓர் எம்பாவாய்!", "ஆர்த்த பிறவித் துயர் கெட, நாம் ஆர்த்து ஆடும்\nதீர்த்தன்; நல் தில்லைச் சிற்றம்பலத்தே தீ ஆடும்\nகூத்தன்; இவ் வானும், குவலயமும், எல்லோமும்,\nகாத்தும், படைத்தும், கரந்தும், விளையாடி,\nவார்த்தையும் பேசி, வளை சிலம்ப, வார் கலைகள்\nஆர்ப்பு அரவம் செய்ய, அணி குழல்மேல் வண்டு ஆர்ப்ப,\nபூத் திகழும் பொய்கை குடைந்து, உடையான் பொன் பாதம்\nஏத்தி, இரும் சுனை நீர் ஆடு' ஏல் ஓர் எம்பாவாய்!", "பைம் குவளைக் கார் மலரால், செம் கமலப் பைம் போதால்,\nஅங்கம் குருகு இனத்தால், பின்னும் அரவத்தால்,\nதம்கண் மலம் கழுவுவார் வந்து சார்தலினால்,\nஎங்கள் பிராட்டியும், எம் கோனும், போன்று இசைந்த\nபொங்கு மடுவில், புகப் பாய்ந்து, பாய்ந்து, நம்\nசங்கம் சிலம்ப; சிலம்பு கலந்து ஆர்ப்ப;\nகொங்கைகள் பொங்க; குடையும் புனல் பொங்க;\nபங்கயப் பூம் புனல் பாய்ந்து ஆடு' ஏல் ஓர் எம்பாவாய்।", "காது ஆர் குழை ஆட, பைம் பூண் கலன் ஆட,\nகோதை குழல் ஆட, வண்டின் குழாம் ஆட,\nசீதப் புனல் ஆடி, சிற்றம்பலம் பாடி,\nவேதப் பொருள் பாடி, அப் பொருள் ஆமா பாடி,\nசோதி திறம் பாடி, சூழ் கொன்றைத் தார் பாடி,\nஆதி திறம் பாடி, அந்தம் ஆமா பாடி,\nபேதித்து நம்மை, வளர்த்து எடுத்த பெய்வளை தன்\nபாதத் திறம் பாடி, ஆடு' ஏல் ஓர் எம்பாவாய்!", "ஓர் ஒரு கால் \"எம்பெருமான்\" என்று என்றே, நம் பெருமான்\nசீர் ஒரு கால் வாய் ஓவாள்; சித்தம் களி கூர,\nநீர் ஒரு கால் ஓவா நெடும் தாரை கண் பனிப்ப,\nபார் ஒரு கால் வந்தனையாள்; விண்ணோரைத் தான் பணியாள்;\nபேர் அரையற்கு இங்ஙனே பித்து ஒருவர் ஆம் ஆறும்\nஆர் ஒருவர்? இவ்வண்ணம் ஆட்கொள்ளும் வித்தகர் தாள்,\nவார் உருவப் பூண் முலையீர், வாய் ஆர நாம் பாடி,\nஏர் உருவப் பூம் புனல் பாய்ந்து ஆடு' ஏல் ஓர் எம்பாவாய்।", "முன்னி, கடலை, சுருக்கி எழுந்து, உடையாள்\nஎன்னத் திகழ்ந்து, எம்மை ஆளுடையாள் இட்டிடையின்\nமின்னிப் பொலிந்து, எம்பிராட்டி திருவடிமேல்\nபொன் அம் சிலம்பில் சிலம்பி, திருப் புருவம்\nஎன்னச் சிலை குலவி, நம்தம்மை ஆள் உடையாள்\nதன்னில் பிரிவு இலா எம் கோமான் அன்பர்க்கு\nமுன்னி, அவள், நமக்கு முன் சுரக்கும் இன் அருளே\nஎன்னப் பொழியாய் மழை' ஏல் ஓர் எம்பாவாய்!", "செம் கண் அவன்பால், திசைமுகன்பால், தேவர்கள்பால்,\nஎங்கும் இலாதது ஓர் இன்பம் நம்பாலதா,\nகொங்கு உண் கரும் குழலி! நம் தம்மைக் கோதாட்டி,\nஇங்கு, நம் இல்லங்கள்தோறும் எழுந்தருளி,\nசெம் கமலப் பொன் பாதம் தந்தருளும் சேவகனை,\nஅம் கண் அரசை, அடியோங்கட்கு ஆர் அமுதை,\nநங்கள் பெருமானை, பாடி, நலம் திகழ,\nபங்கயப் பூம் புனல் பாய்ந்து ஆடு' ஏல் ஓர் எம்பாவாய்।", "அண்ணாமலையான் அடிக் கமலம் சென்று இறைஞ்சும்\nவிண்ணோர் முடியின் மணித் தொகை வீறு அற்றால்போல்,\nகண் ஆர் இரவி கதிர் வந்து கார் கரப்ப,\nதண் ஆர் ஒளி மழுங்கி, தாரகைகள் தாம் அகல,\nபெண் ஆகி, ஆண் ஆய், அலி ஆய், பிறங்கு ஒலி சேர்\nவிண் ஆகி, மண் ஆகி, இத்தனையும் வேறு ஆகி,\nகண் ஆர் அமுதமும் ஆய், நின்றான் கழல் பாடி,\nபெண்ணே! இப் பூம் புனல் பாய்ந்து ஆடு' ஏல் ஓர் எம்பாவாய்!", "உன் கையில் பிள்ளை உனக்கே அடைக்கலம், என்று\nஅங்கு அப் பழஞ்சொல் புதுக்கும் எம் அச்சத்தால்,\nஎங்கள் பெருமான், உனக்கு ஒன்று உரைப்போம், கேள்!\nஎம் கொங்கை நின் அன்பர் அல்லார் தோள் சேரற்க;\nஎம் கை உனக்கு அல்லாது எப் பணியும் செய்யற்க;\nகங்குல், பகல் எம் கண் மற்று ஒன்றும் காணற்க.\nஇங்கு இப் பரிசே எமக்கு எம் கோன் நல்குதியேல்,\nஎங்கு எழில் என் ஞாயிறு எமக்கு? ஏல் ஓர் எம்பாவாய்!", "போற்றி! அருளுக, நின் ஆதி ஆம் பாத மலர்.\nபோற்றி! அருளுக, நின் அந்தம் ஆம் செம் தளிர்கள்.\nபோற்றி! எல்லா உயிர்க்கும் தோற்றம் ஆம் பொன் பாதம்.\nபோற்றி! எல்லா உயிர்க்கும் போகம் ஆம் பூம் கழல்கள்.\nபோற்றி! எல்லா உயிர்க்கும் ஈறு ஆம் இணை அடிகள்.\nபோற்றி! மால், நான்முகனும், காணாத புண்டரிகம்.\nபோற்றி! யாம் உய்ய, ஆட்கொண்டருளும் பொன் மலர்கள்.\nபோற்றி! யாம் மார்கழி நீர் ஆடு ஏல் ஓர் எம்பாவாய்!"]], ["திருஅம்மானை", ["செம் கண் நெடுமாலும் சென்று இடந்தும், காண்பு அரிய\nபொங்கு மலர்ப் பாதம் பூதலத்தே போந்தருளி,\nஎங்கள் பிறப்பு அறுத்திட்டு, எம் தரமும் ஆட்கொண்டு,\nதெங்கு திரள் சோலை, தென்னன் பெருந்துறையான்,\nஅம் கணன், அந்தணன் ஆய், அறைகூவி, வீடு அருளும்\nஅம் கருணை வார் கழலே பாடுதும் காண்; அம்மானாய்!", "பாரார், விசும்பு உள்ளார், பாதாளத்தார், புறத்தார்,\nஆராலும் காண்டற்கு அரியான்; எமக்கு எளிய\nபேராளன்; தென்னன்; பெருந்துறையான்; பிச்சு ஏற்றி,\nவாரா வழி அருளி, வந்து, என் உளம் புகுந்த\nஆரா அமுது ஆய், அலை கடல்வாய் மீன் விசிறும்\nபேர் ஆசை வாரியனை பாடுதும் காண்; அம்மானாய்!", "இந்திரனும், மால், அயனும், ஏனோரும், வானோரும்,\nஅந்தரமே நிற்க, சிவன் அவனி வந்தருளி,\nஎம் தரமும் ஆட்கொண்டு, தோள் கொண்ட நீற்றன் ஆய்;\nசிந்தனையை வந்து உருக்கும் சீர் ஆர் பெருந்துறையான்,\nபந்தம் பறிய, பரி மேல்கொண்டான், தந்த\nஅந்தம் இலா ஆனந்தம் பாடுதும் காண்; அம்மானாய்!", "வான் வந்த தேவர்களும், மால், அவனோடு, இந்திரனும்,\nகான் நின்று வற்றியும், புற்று எழுந்தும், காண்பு அரிய\nதான் வந்து, நாயேனைத் தாய்போல் தலையளித்திட்டு,\nஊன் வந்து உரோமங்கள், உள்ளே உயிர்ப்பு எய்து\nதேன் வந்து, அமுதின் தெளிவின் ஒளி வந்த,\nவான் வந்த, வார் கழலே பாடுதும் காண்; அம்மானாய்!", "கல்லா மனத்துக் கடைப்பட்ட நாயேனை,\nவல்லாளன், தென்னன், பெருந்துறையான், பிச்சு ஏற்றி,\nகல்லைப் பிசைந்து கனி ஆக்கி, தன் கருணை\nவெள்ளத்து அழுத்தி, வினை கடிந்த வேதியனை,\nதில்லை நகர் புக்கு, சிற்றம்பலம் மன்னும்\nஒல்லை விடையானை பாடுதும் காண்; அம்மானாய்!", "கேட்டாயோ தோழி! கிறி செய்த ஆறு ஒருவன்\nதீட்டு ஆர் மதில் புடை சூழ், தென்னன் பெருந்துறையான்,\nகாட்டாதன எல்லாம் காட்டி, சிவம் காட்டி,\nதாள் தாமரை காட்டி, தன் கருணைத் தேன் காட்டி,\nநாட்டார் நகை செய்ய, நாம் மேலை வீடு எய்த,\nஆள் தான் கொண்டு ஆண்டவா பாடுதும் காண்; அம்மானாய்!", "ஓயாதே உள்குவார் உள் இருக்கும் உள்ளானை,\nசேயானை, சேவகனை, தென்னன் பெருந்துறையின்\nமேயானை, வேதியனை, மாது இருக்கும் பாதியனை,\nநாய் ஆன நம் தம்மை ஆட்கொண்ட நாயகனை,\nதாயானை, தத்துவனை, தானே உலகு ஏழும்\nஆயானை, ஆள்வானை பாடுதும் காண்; அம்மானாய்!", "பண் சுமந்த பாடல் பரிசு படைத்தருளும்\nபெண் சுமந்த பாகத்தன், பெம்மான், பெருந்துறையான்,\nவிண் சுமந்த கீர்த்தி வியன் மண்டலத்து ஈசன்,\nகண் சுமந்த நெற்றிக் கடவுள், கலி மதுரை\nமண் சுமந்த கூலி கொண்டு, அக் கோவால் மொத்துண்டு\nபுண் சுமந்த பொன் மேனி பாடுதும் காண்; அம்மானாய்!", "துண்டப் பிறையான், மறையான், பெருந்துறையான்,\nகொண்ட புரிநூலான், கோல மா ஊர்தியான்,\nகண்டம் கரியான், செம் மேனியான், வெள் நீற்றான்,\nஅண்டம் முதல் ஆயினான், அந்தம் இலா ஆனந்தம்,\nபண்டைப் பரிசே, பழ அடியார்க்கு ஈந்தருளும்;\nஅண்டம் வியப்பு உறுமா பாடுதும் காண்; அம்மானாய்!", "விண் ஆளும் தேவர்க்கும் மேல் ஆய வேதியனை,\nமண் ஆளும் மன்னவர்க்கும் மாண்பு ஆகி நின்றானை,\nதண் ஆர் தமிழ் அளிக்கும் தண் பாண்டி நாட்டானை,\nபெண் ஆளும் பாகனை, பேணு பெருந்துறையில்\nகண் ஆர் கழல் காட்டி நாயேனை ஆட்கொண்ட\nஅண்ணாமலையானை பாடுதும் காண்; அம்மானாய்!", "செப்பு ஆர் முலை பங்கன், தென்னன், பெருந்துறையான்,\nதப்பாமே தாள் அடைந்தார் நெஞ்சு உருக்கும் தன்மையினான்,\nஅப் பாண்டி நாட்டைச் சிவலோகம் ஆக்குவித்த\nஅப்பு ஆர் சடை அப்பன், ஆனந்த வார் கழலே\nஒப்பு ஆக ஒப்புவித்த உள்ளத்தார் உள் இருக்கும்\nஅப்பாலைக்கு அப்பாலை பாடுதும் காண்; அம்மானாய்!", "மைப்பொலியும் கண்ணி! கேள்; மால், அவனோடு, இந்திரனும்,\nஎப் பிறவியும் தேட, என்னையும் தன் இன் அருளால்\nஇப் பிறவி ஆட்கொண்டு, இனிப் பிறவாமே காத்து\nமெய்ப்பொருள்கண் தோற்றம் ஆய் மெய்யே நிலைபேறு ஆய்\nஎப்பொருட்கும் தானே ஆய் யாவைக்கும் வீடு ஆகும்\nஅப்பொருள் ஆம் நம் சிவனைப் பாடுதும் காண் அம்மானாய்!", "கைஆர் வளை சிலம்பக் காதுஆர் குழை ஆட\nமைஆர் குழல் புரழத் தேன் பாய வண்டு ஒலிப்பச்\nசெய்யானை வெண் நீறு அணிந்தானைச் சேர்ந்து அறியாக்\nகையானை எங்கும் செறிந்தானை அன்பர்க்கு\nமெய்யானை அல்லாதார்க்கு அல்லாத வேதியனை\nஐயாறு அமர்ந்தானைப் பாடுதும் காண் அம்மானை!", "ஆனை ஆய்க் கீடம் ஆய் மானுடர் ஆய்த் தேவர் ஆய்\nஏனைப் பிற ஆய், பிறந்து, இறந்து எய்த்தேனை\nஊனையும் நின்று உருக்கி, என் வினையை ஓட்டு உகந்து,\nதேனையும், பாலையும், கன்னலையும் ஓத்து, இனிய\nகோன் அவன் போல் வந்து, என்னை, தன் தொழும்பில்\nகொண்டருளும்\nவானவன் பூம் கழலே பாடுதும் காண்; அம்மானாய்!", "சந்திரனைத் தேய்த்தருளி, தக்கன் தன் வேள்வியினில்\nஇந்திரனைத் தோள் நெரித்திட்டு, எச்சன் தலை அரிந்து,\nஅந்தரமே செல்லும் அலர் கதிரோன் பல் தகர்த்து,\nசிந்தித் திசை திசையே தேவர்களை ஓட்டு உகந்த,\nசெம் தார்ப் பொழில் புடை சூழ் தென்னன் பெருந்துறையான்\nமந்தார மாலையே பாடுதும் காண்; அம்மானாய்!", "ஊன் ஆய், உயிர் ஆய், உணர்வு ஆய், என்னுள் கலந்து,\nதேன் ஆய், அமுதமும் ஆய், தீம் கரும்பின் கட்டியும் ஆய்,\nவானோர் அறியா வழி எமக்குத் தந்தருளும்,\nதேன் ஆர் மலர்க் கொன்றைச் சேவகனார், சீர் ஒளி சேர்\nஆனா அறிவு ஆய், அளவு இறந்த பல் உயிர்க்கும்\nகோன் ஆகி நின்றவா கூறுதும் காண்; அம்மானாய்!", "சூடுவேன் பூம் கொன்றை; சூடிச் சிவன் திரள் தோள்\nகூடுவேன்; கூடி, முயங்கி, மயங்கி நின்று,\nஊடுவேன்; செவ் வாய்க்கு உருகுவேன்; உள் உருகித்\nதேடுவேன்; தேடி, சிவன் கழலே சிந்திப்பேன்;\nவாடுவேன்; பேர்த்தும் மலர்வேன்; அனல் ஏந்தி\nஆடுவான் சேவடியே பாடுதும் காண்; அம்மானாய்!", "கிளி வந்த இன் மொழியாள் கேழ் கிளரும் பாதியனை,\nவெளி வந்த மால், அயனும், காண்பு அரிய வித்தகனை,\nதெளி வந்த தேறலை, சீர் ஆர் பெருந்துறையில்\nஎளிவந்து, இருந்து, இரங்கி, எண் அரிய இன் அருளால்\nஒளி வந்து, என் உள்ளத்தின் உள்ளே ஒளி திகழ,\nஅளி வந்த அந்தணனை பாடுதும் காண்; அம்மானாய்!", "முன்னானை, மூவர்க்கும்; முற்றும் ஆய், முற்றுக்கும்\nபின்னானை; பிஞ்ஞுகனை; பேணு பெருந்துறையின்\nமன்னானை; வானவனை; மாது இயலும் பாதியனை;\nதென் ஆனைக்காவானை; தென் பாண்டி நாட்டானை;\nஎன்னானை, என் அப்பன்! என்பார்கட்கு இன் அமுதை\nஅன்னானை; அம்மானை பாடுதும் காண்: அம்மானாய்!", "பெற்றி பிறர்க்கு அரிய பெம்மான், பெருந்துறையான்,\nகொற்றக் குதிரையின்மேல் வந்தருளி, தன் அடியார்\nகுற்றங்கள் நீக்கி, குணம் கொண்டு, கோதாட்டி,\nசுற்றிய சுற்றத் தொடர்வு அறுப்பான் தொல் புகழே\nபற்றி, இப் பாசத்தைப் பற்று அற நாம் பற்றுவான்,\nபற்றிய பேர் ஆனந்தம் பாடுதும் காண்; அம்மானாய்!"]], ["திருப்பொன் சுண்ணம்", ["முத்து நல் தாமம், பூ மாலை, தூக்கி, முளைக்குடம், தூபம், நல்\nதீபம்,வைம்மின்!\nசத்தியும், சோமியும், பார் மகளும், நா மகளோடு பல்லாண்டு\nஇசைமின்!\nசித்தியும், கெளரியும், பார்ப்பதியும், கங்கையும், வந்து, கவரி\nகொள்மின்!\nஅத்தன், ஐயாறன், அம்மானைப் பாடி, ஆட, பொற்சுண்ணம் இடித்தும்,\nநாமே!", "பூ இயல் வார் சடை எம்பிராற்கு, பொன் திருச் சுண்ணம்\nஇடிக்கவேண்டும்,\nமாவின் வடு வகிர் அன்ன கண்ணீர்! வம்மின்கள், வந்து, உடன்\nபாடுமின்கள்;\nகூவுமின், தொண்டர் புறம் நிலாமே; குனிமின், தொழுமின்; எம் கோன்,\nஎம் கூத்தன்,\nதேவியும் தானும் வந்து, எம்மை ஆள, செம் பொன் செய் சுண்ணம்\nஇடித்தும், நாமே!", "சுந்தர நீறு அணிந்து, மெழுகி, தூய பொன் சிந்தி, நிதி பரப்பி,\nஇந்திரன் கற்பகம் நாட்டி, எங்கும் எழில் சுடர் வைத்து, கொடி\nஎடுமின்;\nஅந்தரர் கோன், அயன் தன் பெருமான், ஆழியான் நாதன், நல்\nவேலன் தாதை,\nஎம் தரம் ஆள் உமையாள் கொழுறநற்கு, ஏய்ந்த பொற்சுண்ணம்\nஇடித்தும், நாமே!", "காசு அணிமின்கள், உலக்கை எல்லாம்; காம்பு அணிமின்கள், கறை\nஉரலை;\nநேசம் உடைய அடியவர்கள் நின்று நிலாவுக' என்று வாழ்த்தி,\nதேசம் எல்லாம் புகழ்ந்து ஆடும் கச்சித் திரு ஏகம்பன் செம் பொன்\nகோயில் பாட,\nபாச வினையைப் பறித்து நின்று, பாடி, பொற்சுண்ணம் இடித்தும்,\nநாமே!", "அறுகு எடுப்பார் அயனும், அரியும்; அன்றி, மற்று இந்திரனோடு,\nஅமரர்,\nநறுமுறு தேவர் கணங்கள் எல்லாம், நம்மில் பின்பு அல்லது, எடுக்க\nஒட்டோம்;\nசெறிவு உடை மும் மதில் எய்த வில்லி, திரு ஏகம்பன், செம் பொன்\nகோயில் பாட,\nமுறுவல் செவ் வாயினீர்! முக் கண் அப்பற்கு, ஆட, பொற்சுண்ணம்\nஇடித்தும், நாமே!", "உலக்கை பல ஓச்சுவார் பெரியோர், உலகம் எலாம் உரல் போதாது\nஎன்றே;\nகலக்க அடியவர் வந்து நின்றார், காண உலகங்கள் போதாது என்றே;\nநலக்க, அடியோமை ஆண்டுகொண்டு நாள் மலர்ப் பாதங்கள் தூடத்\nதந்த\nமலைக்கு மருகனைப் பாடிப் பாடி, மகிழ்ந்து பொற்சுண்ணம்\nஇடித்தும், நாமே!", "சூடகம், தோள் வளை, ஆர்ப்ப ஆர்ப்ப, தொண்டர் குழாம் எழுந்து\nஆர்ப்ப ஆர்ப்ப,\nநாடவர் நம் தம்மை ஆர்ப்ப ஆர்ப்ப, நாமும் அவர் தம்மை ஆர்ப்ப\nஆர்ப்ப,\nபாடகம் மெல் அடி ஆர்க்கும் மங்கை பங்கினன், எங்கள் பரா\nபரனுக்கு,\nஆடக மா மலை அன்ன கோவுக்கு, ஆட, பொற்சுண்ணம் இடித்தும்,\nநாமே!", "வாள் தடம் கண் மட மங்கை நல்லீர்! வரி வளை ஆர்ப்ப, வண்\nகொங்கை பொங்க,\nதோள் திருமுண்டம் துதைந்து இலங்க, சோத்தம், பிரான்! என்று\nசொல்லிச் சொல்லி,\nநாள் கொண்ட நாள் மலர்ப் பாதம் காட்டி, நாயின் கடைப்பட்ட\nநம்மை, இம்மை\nஆட்கொண்ட வண்ணங்கள் பாடிப் பாடி, ஆட, பொற்சுண்ணம்\nஇடித்தும், நாமே!", "வையகம் எல்லாம் உரல் அது ஆக, மா மேரு என்னும் உலக்கை\nநாட்டி,\nமெய் எனும் மஞ்சள் நிறைய அட்டி, மேதகு தென்னன்,\nபெருந்துறையான்,\nசெய்ய திருவடி பாடிப் பாடி, செம் பொன் உலக்கை வலக் கை\nபற்றி,\nஐயன், அணி தில்லைவாணனுக்கே, ஆட, பொற்சுண்ணம் இடித்தும்,\nநாமே!", "முத்து அணி கொங்கைகள் ஆட ஆட, மொய் குழல் வண்டு இனம்\nஆட ஆட,\nசித்தம் சிவனொடும் ஆட ஆட, செம் கயல் கண் பனி ஆட ஆட,\nபித்து எம்பிரானொடும் ஆட ஆட, பிறவி பிறரொடும் ஆட ஆட,\nஅத்தன் கருணையொடு ஆட ஆட, ஆட, பொற்சுண்ணம் இடித்தும்,\nநாமே!", "மாடு, நகை வாள் நிலா எறிப்ப, வாய் திறந்து அம் பவளம் துடிப்ப,\nபாடுமின், நம் தம்மை ஆண்ட ஆறும், பணி கொண்ட வண்ணமும்;\nபாடிப் பாடித்\nதேடுமின், எம்பெருமானை; தேடி, சித்தம் களிப்ப, திகைத்து, தேறி,\nஆடுமின்; அம்பலத்து ஆடினானுக்கு, ஆட, பொற்சுண்ணம் இடித்தும்,\nநாமே!", "மை அமர் கண்டனை, வான நாடர் மருந்தினை, மாணிக்கக் கூத்தன்\nதன்னை,\nஐயனை, ஐயர் பிரானை, நம்மை அகப்படுத்து ஆட்கொண்டு அருமை\nகாட்டும்\nபொய்யர் தம் பொய்யினை, மெய்யர் மெய்யை; போது அரிக் கண்\nஇணை, பொன் தொடுத் தோள்,\nபை அரவு அல்குல், மடந்தை நல்லீர்! பாடி, பொற்சுண்ணம் இடித்தும்,\nநாமே!", "மின் இடை, செம் துவர் வாய், கரும் கண், வெள் நகை, பண் அமர்\nமென் மொழியீர்!\nஎன்னுடை ஆர் அமுது, எங்கள் அப்பன், எம்பெருமான், இமவான்\nமகட்குத்\nதன்னுடைக் கேள்வன், மகன், தகப்பன், தமையன், எம் ஐயன தாள்கள்\nபாடி,\nபொன்னுடைப் பூண் முலை மங்கை நல்லீர்! பொன் திருச் சுண்ணம்\nஇடித்தும், நாமே!", "சங்கம் அரற்ற, சிலம்பு ஒலிப்ப, தாழ் குழல் சழ்தரும் மாலை ஆட,\nசெம் கனி வாய் இதழும் துடிப்ப, சேயிழையீர்! சிவலோகம் பாடி,\nகங்கை இரைப்ப அரா இரைக்கும் கற்றைச் சடை முடியான்\nகழற்கே,\nபொங்கிய காதலின் கொங்கை பொங்க, பொன் திருச் சுண்ணம்\nஇடித்தும், நாமே!", "ஞானக் கரும்பின் தெளியை, பாகை, நாடற்கு அரிய நலத்தை, நந்தாத்\nதேனை, பழச் சுவை ஆயினானை, சித்தம் புகுந்து தித்திக்க வல்ல\nகோனை, பிறப்பு அறுத்து, ஆண்டுகொண்ட கூத்தனை; நாத் தழும்பு\nஏற வாழ்த்தி,\nபானல் தடம் கண் மடந்தை நல்லீர்! பாடி, பொற்சுண்ணம் இடித்தும்,\nநாமே!", "ஆவகை, நாமும் வந்து, அன்பர் தம்மோடு ஆட்செயும் வண்ணங்கள்\nபாடி, விண்மேல்\nதேவர் கனாவிலும் கண்டு அறியாச் செம் மலர்ப் பாதங்கள் காட்டும்\nசெல்வச்\nசே வலன் ஏந்திய வெல் கொடியான், சிவபெருமான், புரம் செற்ற\nகொற்றச்\nசேவகன், நாமங்கள் பாடிப் பாடி, செம் பொன் செய் சுண்ணம்\nஇடித்தும், நாமே!", "தேன் அகம் மா மலர்க் கொன்றை பாடி, சிவபுரம் பாடி, திருச்\nசடைமேல்\nவான் அகம் மா மதிப் பிள்ளை பாடி, மால் விடை பாடி, வலக் கை\nஏந்தும்\nஊன் அகம் மா மழு, சலம், பாடி, உம்பரும் இம்பரும் உய்ய, அன்று,\nபோனகம் ஆக, நஞ்சு உண்டல் பாடி, பொன் திருச் சுண்ணம்\nஇடித்தும், நாமே!", "அயன் தலை கொண்டு செண்டு ஆடல் பாடி, அருக்கன் எயிறு\nபறித்தல் பாடி,\nகயம் தனைக் கொன்று, உரி போர்த்தல் பாடி, காலனைக் காலால்
